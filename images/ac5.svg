<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="ac5Head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#022851"/><stop offset="1" stop-color="#003a6b"/></linearGradient>
  <marker id="ac5Arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#022851"/></marker>
  <marker id="ac5ArrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00573f"/></marker>
  <marker id="ac5ArrGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d99a00"/></marker>
  <filter id="ac5Sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#022851" flood-opacity="0.18"/></filter>
</defs>
<rect width="640" height="420" fill="#f7fafc"/>
<rect width="640" height="56" fill="url(#ac5Head)"/>
<rect y="56" width="640" height="4" fill="#ffbf00"/>
<text x="24" y="27" fill="#ffffff" font-size="17" font-weight="bold">CRRT Anticoagulation: Heparin vs. Citrate</text>
<text x="24" y="45" fill="#ffbf00" font-size="11" letter-spacing="0.5">keep the circuit clot-free without bleeding the patient</text>

<!-- ============ heparin panel ============ -->
<rect x="40" y="76" width="280" height="196" rx="12" fill="#ffffff" stroke="#c10230" stroke-width="1.5" filter="url(#ac5Sh)"/>
<text x="56" y="98" fill="#c10230" font-size="13" font-weight="bold">Heparin — systemic</text>
<rect x="56" y="108" width="248" height="30" rx="6" fill="#fbeaea"/>
<text x="66" y="122" fill="#c10230" font-size="10.5" font-weight="bold">10–30 U/kg bolus, 5 min before start</text>
<text x="66" y="133" fill="#8a5560" font-size="8">then continuous infusion · target PTT 45–65 s</text>
<g font-size="9.5" fill="#1c2b39">
  <text x="56" y="160">· anticoagulates patient AND circuit</text>
  <text x="56" y="178">· bleeding is the main risk</text>
  <text x="56" y="196">· HIT — heparin-induced thrombocytopenia,</text>
  <text x="68" y="207" fill="#5b6b7a" font-size="8.5">the "white clot syndrome": clots ↑, platelets ↓</text>
  <text x="56" y="224">· heparin resistance — low antithrombin III</text>
  <text x="68" y="231" fill="#5b6b7a" font-size="8.5">in sepsis/DIC means more heparin won't work</text>
  <text x="56" y="252" fill="#c10230" font-size="8.5" font-weight="bold">proinflammatory in sepsis — use with caution</text>
</g>

<!-- ============ citrate panel ============ -->
<rect x="338" y="76" width="278" height="196" rx="12" fill="#ffffff" stroke="#00573f" stroke-width="1.5" filter="url(#ac5Sh)"/>
<text x="354" y="98" fill="#00573f" font-size="13" font-weight="bold">Citrate — regional (preferred)</text>
<g font-size="9.5" fill="#1c2b39">
  <text x="354" y="120">· citrate infused pre-filter chelates Ca²⁺</text>
  <text x="366" y="131" fill="#5b6b7a" font-size="8.5">no ionized calcium → blood won't clot in the circuit</text>
  <text x="354" y="140">· calcium returned to the patient post-filter</text>
  <text x="354" y="160">· ionized Ca²⁺ checked q30–60 min</text>
  <text x="354" y="172" fill="#5b6b7a" font-size="8.5">keep iCa ≈ 1.12–1.2 mmol/L</text>
  <text x="354" y="192">· anticoagulates the circuit only —</text>
  <text x="366" y="203" fill="#5b6b7a" font-size="8.5">the patient's own clotting stays intact</text>
  <text x="354" y="224">· no-calcium dialysate/replacement required</text>
</g>
<rect x="354" y="240" width="246" height="22" rx="6" fill="#fdf3d7"/>
<text x="477" y="251" fill="#8a6a00" font-size="8.5" text-anchor="middle" font-weight="bold">Caution: liver failure &amp; severe hypotension —</text>
<text x="477" y="259" fill="#8a6a00" font-size="7.5" text-anchor="middle">citrate can't be metabolized → accumulates, Ca drops</text>

<!-- ============ regional citrate circuit (bottom) ============ -->
<rect x="40" y="288" width="576" height="76" rx="12" fill="#ffffff" stroke="#e3e8ee" filter="url(#ac5Sh)"/>
<text x="56" y="310" fill="#022851" font-size="12" font-weight="bold">Regional citrate anticoagulation — one circuit</text>
<path d="M70 340 H196" fill="none" stroke="#c10230" stroke-width="4.5" stroke-linecap="round"/>
<path d="M160 322 V334" fill="none" stroke="#00573f" stroke-width="3.5" marker-end="url(#ac5ArrGreen)"/>
<text x="178" y="328" fill="#00573f" font-size="7.5" font-weight="bold">citrate in</text>
<g filter="url(#ac5Sh)"><rect x="200" y="324" width="46" height="32" rx="8" fill="#e9f1f8" stroke="#5b6b7a" stroke-width="1.5"/></g>
<g stroke="#ffbf00" stroke-width="1.5"><line x1="210" y1="328" x2="210" y2="352"/><line x1="218" y1="328" x2="218" y2="352"/><line x1="226" y1="328" x2="226" y2="352"/><line x1="236" y1="328" x2="236" y2="352"/></g>
<path d="M252 340 H300" fill="none" stroke="#c10230" stroke-width="4.5" stroke-linecap="round"/>
<path d="M276 348 V360" fill="none" stroke="#d99a00" stroke-width="3.5" marker-end="url(#ac5ArrGold)"/>
<text x="308" y="358" fill="#b8860b" font-size="7.5" font-weight="bold">calcium back to patient</text>
<text x="470" y="336" fill="#5b6b7a" font-size="8.5">circuit anticoagulated ·</text>
<text x="470" y="348" fill="#5b6b7a" font-size="8.5">patient protected from bleeding</text>

<text x="320" y="378" fill="#022851" font-size="11" text-anchor="middle" font-weight="bold">Bleeding risk high → citrate. Liver failure or shock → heparin (or none).</text>
<text x="616" y="410" fill="#9aa7b4" font-size="9" text-anchor="end">CNN Exam Prep · Acute Therapies</text>
</svg>