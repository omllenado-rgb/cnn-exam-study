<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="ac6Head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#022851"/><stop offset="1" stop-color="#003a6b"/></linearGradient>
  <marker id="ac6Arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#022851"/></marker>
  <filter id="ac6Sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#022851" flood-opacity="0.18"/></filter>
</defs>
<rect width="640" height="420" fill="#f7fafc"/>
<rect width="640" height="56" fill="url(#ac6Head)"/>
<rect y="56" width="640" height="4" fill="#ffbf00"/>
<text x="24" y="27" fill="#ffffff" font-size="17" font-weight="bold">CRRT Dosing &amp; KDIGO Targets</text>
<text x="24" y="45" fill="#ffbf00" font-size="11" letter-spacing="0.5">how much clearance is enough?</text>

<!-- ============ KDIGO gauge (left) ============ -->
<rect x="40" y="76" width="280" height="168" rx="12" fill="#ffffff" stroke="#e3e8ee" filter="url(#ac6Sh)"/>
<text x="56" y="98" fill="#022851" font-size="12" font-weight="bold">The KDIGO effluent dose</text>
<path d="M110 196 A70 70 0 0 1 250 196" fill="none" stroke="#e3e8ee" stroke-width="10" stroke-linecap="round"/>
<path d="M124 188 A56 56 0 0 1 240 178" fill="none" stroke="#00573f" stroke-width="7" stroke-linecap="round"/>
<line x1="180" y1="196" x2="130" y2="176" stroke="#022851" stroke-width="3" stroke-linecap="round"/>
<circle cx="180" cy="196" r="6" fill="#022851"/>
<text x="180" y="180" fill="#022851" font-size="15" text-anchor="middle" font-weight="bold">20–25</text>
<text x="180" y="216" fill="#00573f" font-size="9" text-anchor="middle" font-weight="bold">mL/kg/hr of effluent</text>
<text x="180" y="230" fill="#5b6b7a" font-size="8" text-anchor="middle">effluent volume ÷ body weight ÷ hours</text>

<!-- ============ prescribe for downtime (navy, right) ============ -->
<g filter="url(#ac6Sh)">
  <rect x="348" y="76" width="268" height="168" rx="12" fill="#022851"/>
</g>
<rect x="348" y="76" width="268" height="28" rx="12" fill="#0c3a63"/>
<rect x="348" y="92" width="268" height="12" fill="#0c3a63"/>
<text x="482" y="95" fill="#ffbf00" font-size="11.5" text-anchor="middle" font-weight="bold">Prescribe for the downtime</text>
<text x="364" y="136" fill="#ffffff" font-size="24" font-weight="bold">+ 25%</text>
<text x="364" y="154" fill="#cfe0f2" font-size="9">CRRT stops for clotted filters, procedures,</text>
<text x="364" y="166" fill="#cfe0f2" font-size="9">and ICU transport — prescribe above target</text>
<text x="364" y="178" fill="#cfe0f2" font-size="9">so the delivered dose still lands on 20–25</text>
<rect x="364" y="192" width="236" height="38" rx="8" fill="#0c3a63"/>
<text x="376" y="208" fill="#ffbf00" font-size="9.5" font-weight="bold">Example: want 25 delivered → prescribe ≈ 31</text>
<text x="374" y="221" fill="#cfe0f2" font-size="8">the 1 → 1.25 rule of thumb</text>

<!-- ============ where the dose leaks (bottom) ============ -->
<rect x="40" y="260" width="576" height="98" rx="12" fill="#ffffff" stroke="#e3e8ee" filter="url(#ac6Sh)"/>
<text x="56" y="282" fill="#022851" font-size="12" font-weight="bold">Where the prescribed dose leaks away</text>
<g text-anchor="middle">
  <rect x="56" y="292" width="124" height="42" rx="8" fill="#eef4f8" stroke="#e3e8ee"/>
  <text x="118" y="300" fill="#022851" font-size="9" font-weight="bold">Filter clotting</text>
  <text x="118" y="312" fill="#5b6b7a" font-size="7.5">circuit swapped mid-day</text>
  <rect x="192" y="296" width="124" height="42" rx="8" fill="#eef4f8" stroke="#e3e8ee"/>
  <text x="254" y="304" fill="#022851" font-size="9" font-weight="bold">Circuit changes</text>
  <text x="254" y="316" fill="#5b6b7a" font-size="7.5">every swap pauses therapy</text>
  <rect x="328" y="296" width="124" height="42" rx="8" fill="#eef4f8" stroke="#e3e8ee"/>
  <text x="390" y="304" fill="#022851" font-size="9" font-weight="bold">Procedures</text>
  <text x="390" y="316" fill="#5b6b7a" font-size="7.5">OR trips, imaging, line care</text>
  <rect x="464" y="296" width="124" height="42" rx="8" fill="#eef4f8" stroke="#e3e8ee"/>
  <text x="526" y="304" fill="#022851" font-size="9" font-weight="bold">Transport off unit</text>
  <text x="526" y="316" fill="#5b6b7a" font-size="7.5">machines don't travel well</text>
</g>
<text x="320" y="352" fill="#c10230" font-size="9" text-anchor="middle" font-weight="bold">delivered dose is always less than prescribed — that gap is why we order +25%</text>

<text x="320" y="378" fill="#022851" font-size="11" text-anchor="middle" font-weight="bold">Hitting 20–25 mL/kg/hr consistently beats prescribing a big number and delivering a small one</text>
<text x="616" y="410" fill="#9aa7b4" font-size="9" text-anchor="end">CNN Exam Prep · Acute Therapies</text>
</svg>