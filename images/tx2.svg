<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="tx2Head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#022851"/><stop offset="1" stop-color="#003a6b"/></linearGradient>
  <linearGradient id="tx2Kidney" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a34d5e"/><stop offset="1" stop-color="#7a3344"/></linearGradient>
  <marker id="tx2Arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#022851"/></marker>
  <marker id="tx2ArrCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0090b8"/></marker>
  <filter id="tx2Sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#022851" flood-opacity="0.18"/></filter>
</defs>
<rect width="640" height="420" fill="#f7fafc"/>
<rect width="640" height="56" fill="url(#tx2Head)"/>
<rect y="56" width="640" height="4" fill="#ffbf00"/>
<text x="24" y="27" fill="#ffffff" font-size="17" font-weight="bold">Organ Preservation &amp; Recovery</text>
<text x="24" y="45" fill="#ffbf00" font-size="11" letter-spacing="0.5">Warm ischemia · cold storage · pulsatile perfusion</text>

<!-- ============ procurement order (top) ============ -->
<rect x="36" y="74" width="568" height="96" rx="12" fill="#ffffff" stroke="#e3e8ee" filter="url(#tx2Sh)"/>
<text x="52" y="96" fill="#022851" font-size="12" font-weight="bold">Multi-organ procurement — the order matters</text>
<g font-size="9.5" text-anchor="middle">
  <rect x="60" y="110" width="120" height="34" rx="8" fill="#ffe3e6" stroke="#c10230" stroke-width="1.5"/>
  <text x="120" y="124" fill="#c10230" font-weight="bold">1 · Heart &amp; lungs</text>
  <text x="120" y="138" fill="#c10230" font-size="8">removed first</text>
  <rect x="200" y="110" width="120" height="34" rx="8" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.5"/>
  <text x="260" y="124" fill="#8a6d1b" font-weight="bold">2 · Pancreas, liver</text>
  <text x="260" y="138" fill="#8a6d1b" font-size="8">next</text>
  <rect x="340" y="110" width="120" height="34" rx="8" fill="#e2f2e6" stroke="#00573f" stroke-width="1.5"/>
  <text x="400" y="124" fill="#00573f" font-weight="bold">3 · Kidneys last</text>
  <text x="400" y="138" fill="#00573f" font-size="8">then in-situ cold flush</text>
</g>
<line x1="180" y1="127" x2="198" y2="127" stroke="#5b6b7a" stroke-width="1.5" marker-end="url(#tx2Arr)"/>
<line x1="320" y1="127" x2="338" y2="127" stroke="#5b6b7a" stroke-width="1.5" marker-end="url(#tx2Arr)"/>
<text x="476" y="128" fill="#5b6b7a" font-size="8.5">cold flush starts</text>
<text x="476" y="140" fill="#5b6b7a" font-size="8.5">preservation</text>
<!-- WIT badge -->
<g filter="url(#tx2Sh)">
  <rect x="470" y="86" width="120" height="40" rx="8" fill="#022851"/>
</g>
<text x="530" y="103" fill="#ffbf00" font-size="9.5" text-anchor="middle" font-weight="bold">WARM ISCHEMIA TIME</text>
<text x="530" y="118" fill="#ffffff" font-size="9.5" text-anchor="middle" font-weight="bold">keep &lt; 20 minutes</text>
<text x="530" y="190" fill="#5b6b7a" font-size="8" text-anchor="middle">longer WIT → delayed graft function</text>

<!-- ============ two preservation methods (middle) ============ -->
<!-- cold storage -->
<g filter="url(#tx2Sh)">
  <rect x="36" y="186" width="280" height="130" rx="12" fill="#ffffff" stroke="#0090b8" stroke-width="1.5"/>
</g>
<rect x="36" y="186" width="280" height="26" rx="12" fill="#0090b8"/><rect x="36" y="200" width="280" height="12" fill="#0090b8"/>
<text x="176" y="204" fill="#ffffff" font-size="11" text-anchor="middle" font-weight="bold">COLD STORAGE — most common</text>
<!-- cooler -->
<g filter="url(#tx2Sh)">
  <rect x="56" y="226" width="110" height="66" rx="8" fill="#e9f1f8" stroke="#5b6b7a" stroke-width="1.5"/>
</g>
<rect x="64" y="218" width="94" height="10" rx="4" fill="#5b6b7a"/>
<path d="M68 252 q-4 -22 12 -22 h40 q16 0 12 22 q-2 12 -18 12 h-24 q-16 0 -18 -12 z" fill="url(#tx2Kidney)" stroke="#5b2233" stroke-width="1" transform="translate(0,-14)"/>
<path d="M76 236 q8 -6 16 0 M92 240 q8 -6 16 0" stroke="#c9eefc" stroke-width="2" fill="none" opacity="0.8"/>
<text x="111" y="282" fill="#5b6b7a" font-size="8" text-anchor="middle">static ice-cold solution</text>
<g font-size="9.5" fill="#1c2b39">
  <text x="180" y="243">· simple vessel, ~250 mL cold flush</text>
  <text x="180" y="262">· cheapest, most widely used</text>
<text x="180" y="281" font-weight="bold" fill="#c10230">· shortest safe window</text>
</g>
<!-- pulsatile -->
<g filter="url(#tx2Sh)">
  <rect x="324" y="186" width="280" height="130" rx="12" fill="#ffffff" stroke="#00573f" stroke-width="1.5"/>
</g>
<rect x="324" y="186" width="280" height="26" rx="12" fill="#00573f"/><rect x="324" y="200" width="280" height="12" fill="#00573f"/>
<text x="464" y="204" fill="#ffffff" font-size="11" text-anchor="middle" font-weight="bold">HYPOTHERMIC PULSATILE PERFUSION</text>
<!-- pump machine -->
<g filter="url(#tx2Sh)">
  <rect x="344" y="226" width="110" height="66" rx="8" fill="#e2f2e6" stroke="#5b6b7a" stroke-width="1.5"/>
</g>
<rect x="356" y="238" width="56" height="20" rx="4" fill="#022851"/>
<path d="M366 244 h4 l3 -6 l4 12 l3 -6 h4" fill="none" stroke="#ffbf00" stroke-width="1.8"/>
<circle cx="424" cy="248" r="12" fill="none" stroke="#00573f" stroke-width="2"/>
<circle cx="344" cy="248" r="3" fill="#c10230"/>
<circle cx="454" cy="248" r="3" fill="#c10230"/>
<text x="399" y="282" fill="#5b6b7a" font-size="8" text-anchor="middle">machine pumps cold perfusate</text>
<g font-size="9.5" fill="#1c2b39">
  <text x="468" y="243">· keeps kidney oxygenated</text>
  <text x="468" y="262">· allows longer storage</text>
  <text x="468" y="281" font-weight="bold" fill="#00573f">· also measures viability</text>
</g>

<!-- ============ timeline (bottom) ============ -->
<rect x="36" y="330" width="568" height="56" rx="12" fill="#022851" filter="url(#tx2Sh)"/>
<line x1="70" y1="358" x2="580" y2="358" stroke="#ffbf00" stroke-width="2.5"/>
<circle cx="120" cy="358" r="6" fill="#2e7d32"/>
<circle cx="330" cy="358" r="6" fill="#ffbf00"/>
<circle cx="520" cy="358" r="6" fill="#c10230"/>
<text x="120" y="346" fill="#ffffff" font-size="9" text-anchor="middle" font-weight="bold">GOAL: transplant ≤ 24 h</text>
<text x="330" y="346" fill="#ffffff" font-size="9" text-anchor="middle" font-weight="bold">most centers accept to 24 h</text>
<text x="520" y="346" fill="#ff8a93" text-anchor="middle" font-weight="bold">avoid use &gt; 36 h cold time</text>
<text x="616" y="410" fill="#9aa7b4" font-size="9" text-anchor="end">CNN Exam Prep · Transplant</text>
</svg>