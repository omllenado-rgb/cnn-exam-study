<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="pd1Head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#022851"/><stop offset="1" stop-color="#003a6b"/></linearGradient>
  <linearGradient id="pd1Body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4d5bc"/><stop offset="1" stop-color="#e8b894"/></linearGradient>
  <marker id="pd1Arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#022851"/></marker>
  <filter id="pd1Sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#022851" flood-opacity="0.18"/></filter>
</defs>
<rect width="640" height="420" fill="#f7fafc"/>
<rect width="640" height="56" fill="url(#pd1Head)"/>
<rect y="56" width="640" height="4" fill="#ffbf00"/>
<text x="24" y="27" fill="#ffffff" font-size="17" font-weight="bold">PD Catheter Types &amp; Placement</text>
<text x="24" y="45" fill="#ffbf00" font-size="11" letter-spacing="0.5">Tenckhoff design · cuffs · exit site · insertion techniques</text>

<!-- ============ catheter anatomy (left) ============ -->
<rect x="36" y="70" width="284" height="182" rx="12" fill="#ffffff" stroke="#e3e8ee" filter="url(#pd1Sh)"/>
<text x="52" y="92" fill="#022851" font-size="12.5" font-weight="bold">Tenckhoff catheter design</text>
<!-- body: skin + peritoneum -->
<rect x="52" y="168" width="252" height="66" fill="url(#pd1Body)" opacity="0.55"/>
<line x1="52" y1="168" x2="304" y2="168" stroke="#c98850" stroke-width="2"/>
<text x="304" y="163" fill="#c98850" font-size="8" text-anchor="end">skin</text>
<line x1="52" y1="216" x2="304" y2="216" stroke="#b0526b" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="56" y="213" fill="#b0526b" font-size="8" text-anchor="start">peritoneum</text>
<!-- catheter: external limb -->
<path d="M250 100 V144" fill="none" stroke="#022851" stroke-width="7" stroke-linecap="round"/>
<path d="M250 100 V144" fill="none" stroke="#7fb2d9" stroke-width="1.2" stroke-dasharray="3 4"/>
<!-- radiopaque stripes -->
<g stroke="#ffbf00" stroke-width="1.4">
  <line x1="246" y1="108" x2="254" y2="108"/><line x1="246" y1="116" x2="246" y2="116" opacity="0"/>
  <line x1="246" y1="124" x2="246" y2="124" opacity="0"/>
  <line x1="246" y1="116" x2="254" y2="116"/><line x1="246" y1="124" x2="254" y2="124"/>
</g>
<line x1="254" y1="104" x2="262" y2="98" stroke="#8a6d1b" stroke-width="1" marker-end="url(#pd1Arr)"/>
<text x="306" y="96" fill="#8a6d1b" font-size="7.5" text-anchor="end">radiopaque stripes (X-ray)</text>
<!-- swan-neck tunnel: bend downward, then horizontal to deep cuff -->
<path d="M250 144 C250 162 244 170 230 170 H212 C198 170 190 178 190 194 V246" fill="none" stroke="#022851" stroke-width="7" stroke-linecap="round"/>
<path d="M250 144 C250 162 244 170 230 170 H212 C198 170 190 178 190 194 V246" fill="none" stroke="#7fb2d9" stroke-width="1.2" stroke-dasharray="3 4"/>
<!-- superficial cuff -->
<rect x="240" y="160" width="9" height="15" rx="2" fill="#e8e3d5" stroke="#8a6d1b" stroke-width="1.5" transform="rotate(78 244.5 167.5)"/>
<line x1="168" y1="158" x2="234" y2="164" stroke="#8a6d1b" stroke-width="1" marker-end="url(#pd1Arr)"/>
<text x="164" y="161" fill="#8a6d1b" font-size="8" text-anchor="end">superficial cuff</text>
<!-- deep cuff -->
<rect x="203" y="163" width="15" height="9" rx="2" fill="#e8e3d5" stroke="#8a6d1b" stroke-width="1.5"/>
<line x1="156" y1="190" x2="202" y2="173" stroke="#8a6d1b" stroke-width="1" marker-end="url(#pd1Arr)"/>
<text x="152" y="193" fill="#8a6d1b" font-size="8" text-anchor="end">deep cuff</text>
<!-- side holes -->
<g stroke="#f7fafc" stroke-width="1.6">
  <line x1="186" y1="224" x2="194" y2="224"/><line x1="186" y1="232" x2="194" y2="232"/>
  <line x1="186" y1="240" x2="194" y2="240"/>
</g>
<line x1="184" y1="236" x2="132" y2="232" stroke="#022851" stroke-width="1" marker-end="url(#pd1Arr)"/>
<text x="128" y="229" fill="#022851" font-size="8" text-anchor="end">intraperitoneal</text>
<text x="128" y="239" fill="#022851" font-size="8" text-anchor="end">side holes</text>
<!-- swan neck label -->
<line x1="300" y1="212" x2="242" y2="176" stroke="#5b6b7a" stroke-width="1" marker-end="url(#pd1Arr)"/>
<text x="302" y="220" fill="#5b6b7a" font-size="8.5" text-anchor="end">swan-neck bend</text>
<text x="302" y="230" fill="#5b6b7a" font-size="8.5" text-anchor="end">150–180° downward</text>
<text x="302" y="244" fill="#5b6b7a" font-size="8" text-anchor="end">silicone rubber body</text>
<text x="52" y="112" fill="#022851" font-size="10" font-weight="bold">Dacron cuffs grow tissue in,</text>
<text x="52" y="126" fill="#022851" font-size="10" font-weight="bold">sealing the tunnel against bacteria</text>
<text x="52" y="146" fill="#00573f" font-size="9" font-weight="bold">ISPD: double-cuff is preferred</text>

<!-- ============ variants (right) ============ -->
<rect x="332" y="70" width="272" height="182" rx="12" fill="#ffffff" stroke="#e3e8ee" filter="url(#pd1Sh)"/>
<text x="348" y="92" fill="#022851" font-size="12.5" font-weight="bold">Choosing a configuration</text>
<!-- double cuff -->
<rect x="348" y="102" width="240" height="44" rx="8" fill="#e2f2e6"/>
<circle cx="366" cy="117" r="5" fill="#00573f"/><circle cx="380" cy="117" r="5" fill="#00573f" opacity="0.55"/>
<text x="396" y="120" fill="#00573f" font-size="10" font-weight="bold">Double cuff (ISPD preferred)</text>
<text x="396" y="136" fill="#5b6b7a" font-size="8.5">fewer infections, less cuff extrusion</text>
<!-- swan neck -->
<rect x="348" y="152" width="240" height="44" rx="8" fill="#e9f1f8"/>
<path d="M354 174 C354 186 368 186 368 176" fill="none" stroke="#022851" stroke-width="5" stroke-linecap="round"/>
<path d="M370 178 C370 168 372 164 380 164" fill="none" stroke="#022851" stroke-width="5" stroke-linecap="round"/>
<text x="396" y="170" fill="#022851" font-size="10" font-weight="bold">Swan-neck (preformed bend)</text>
<text x="396" y="186" fill="#5b6b7a" font-size="8.5">less catheter tip migration &amp; extrusion</text>
<!-- presternal -->
<rect x="348" y="202" width="240" height="44" rx="8" fill="#fdf3d1"/>
<path d="M354 216 V236 M354 216 l-5 -5 M354 216 l5 -5 M354 236 l-5 5 M354 236 l5 5" fill="none" stroke="#8a6d1b" stroke-width="2"/>
<text x="396" y="220" fill="#8a6d1b" font-size="10" font-weight="bold">Presternal catheter</text>
<text x="396" y="236" fill="#5b6b7a" font-size="8.5">chest exit site — ostomies, incontinence,</text>
<text x="396" y="246" fill="#5b6b7a" font-size="8.5">morbid obesity (longest tunnel)</text>

<!-- ============ placement techniques (bottom) ============ -->
<g font-size="10.5" font-weight="bold" fill="#022851">
  <rect x="36" y="266" width="138" height="108" rx="10" fill="#ffffff" stroke="#e3e8ee" filter="url(#pd1Sh)"/>
  <rect x="181" y="266" width="138" height="108" rx="10" fill="#ffffff" stroke="#e3e8ee" filter="url(#pd1Sh)"/>
  <rect x="326" y="266" width="138" height="108" rx="10" fill="#ffffff" stroke="#e3e8ee" filter="url(#pd1Sh)"/>
  <rect x="471" y="266" width="138" height="108" rx="10" fill="#ffffff" stroke="#e3e8ee" filter="url(#pd1Sh)"/>
</g>
<text x="52" y="286" fill="#022851" font-size="10.5" font-weight="bold">Surgical dissection</text>
<text x="52" y="304" fill="#5b6b7a" font-size="8.5">direct view of the track</text>
<text x="52" y="316" fill="#5b6b7a" font-size="8.5">and rectus muscle</text>
<rect x="52" y="326" width="106" height="26" rx="6" fill="#e2f2e6"/>
<text x="105" y="343" fill="#00573f" font-size="8" text-anchor="middle" font-weight="bold">low bleeding risk</text>
<text x="52" y="366" fill="#1c2b39" font-size="8.5">classic open approach</text>

<text x="197" y="286" fill="#022851" font-size="10.5" font-weight="bold">Laparoscopic</text>
<text x="197" y="304" fill="#5b6b7a" font-size="8.5">visual placement + can</text>
<text x="197" y="316" fill="#5b6b7a" font-size="8.5">lyse adhesions on the spot</text>
<rect x="197" y="326" width="106" height="26" rx="6" fill="#e2f2fb"/>
<text x="250" y="343" fill="#0090b8" font-size="8" text-anchor="middle" font-weight="bold">verifies position</text>
<text x="197" y="366" fill="#1c2b39" font-size="8.5">needs OR + scope</text>

<text x="342" y="286" fill="#022851" font-size="10.5" font-weight="bold">Percutaneous</text>
<text x="342" y="300" fill="#5b6b7a" font-size="8.5">Seldinger guidewire</text>
<text x="342" y="312" fill="#5b6b7a" font-size="8.5">technique, can be bedside</text>
<rect x="342" y="326" width="106" height="26" rx="6" fill="#ffe3e6"/>
<text x="395" y="343" fill="#c10230" font-size="8" text-anchor="middle" font-weight="bold">blind — ↑ injury risk</text>
<text x="342" y="366" fill="#1c2b39" font-size="8.5">fast, no OR time</text>

<text x="487" y="286" fill="#022851" font-size="10.5" font-weight="bold">Moncrief-Popovich</text>
<text x="487" y="304" fill="#5b6b7a" font-size="8.5">catheter embedded</text>
<text x="487" y="316" fill="#5b6b7a" font-size="8.5">subcutaneously at placement</text>
<rect x="487" y="326" width="106" height="26" rx="6" fill="#fdf3d1"/>
<text x="540" y="343" fill="#8a6d1b" font-size="8" text-anchor="middle" font-weight="bold">delayed start</text>
<text x="487" y="366" fill="#1c2b39" font-size="8.5">heals before first use</text>

<text x="320" y="394" fill="#022851" font-size="10.5" text-anchor="middle" font-weight="bold">Every method should leave the exit site away from belts, skin folds and stool contamination</text>
<text x="616" y="412" fill="#9aa7b4" font-size="9" text-anchor="end">CNN Exam Prep · Peritoneal Dialysis</text>
</svg>