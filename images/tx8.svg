<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="tx8Head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#022851"/><stop offset="1" stop-color="#003a6b"/></linearGradient>
  <filter id="tx8Sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#022851" flood-opacity="0.18"/></filter>
</defs>
<rect width="640" height="420" fill="#f7fafc"/>
<rect width="640" height="56" fill="url(#tx8Head)"/>
<rect y="56" width="640" height="4" fill="#ffbf00"/>
<text x="24" y="27" fill="#ffffff" font-size="17" font-weight="bold">Post-Transplant Complications</text>
<text x="24" y="45" fill="#ffbf00" font-size="11" letter-spacing="0.5">The graft works — now guard the heart, metabolism, bone and skin</text>

<!-- ============ CVD stat (left) ============ -->
<g filter="url(#tx8Sh)">
  <rect x="36" y="74" width="160" height="118" rx="12" fill="#022851"/>
</g>
<text x="116" y="96" fill="#ffbf00" font-size="10" text-anchor="middle" font-weight="bold">LEADING CAUSE OF DEATH</text>
<text x="116" y="140" fill="#ffffff" font-size="34" text-anchor="middle" font-weight="bold">#1</text>
<text x="116" y="164" fill="#cfe0f2" font-size="9" text-anchor="middle">cardiovascular disease,</text>
<text x="116" y="178" fill="#cfe0f2" font-size="9" text-anchor="middle">with a functioning graft</text>

<!-- ============ dyslipidemia ============ -->
<g filter="url(#tx8Sh)">
  <rect x="212" y="74" width="196" height="118" rx="12" fill="#ffffff" stroke="#00573f" stroke-width="1.5"/>
</g>
<rect x="212" y="74" width="196" height="24" rx="12" fill="#00573f"/><rect x="212" y="86" width="196" height="12" fill="#00573f"/>
<text x="310" y="91" fill="#ffffff" font-size="10" text-anchor="middle" font-weight="bold">DYSLIPIDEMIA</text>
<text x="310" y="122" fill="#00573f" font-size="19" text-anchor="middle" font-weight="bold">60–80%</text>
<text x="310" y="142" fill="#1c2b39" font-size="9" text-anchor="middle">of transplant recipients</text>
<text x="310" y="158" fill="#5b6b7a" font-size="8.5" text-anchor="middle">statins are first-line therapy</text>

<!-- ============ PTDM ============ -->
<g filter="url(#tx8Sh)">
  <rect x="424" y="74" width="180" height="118" rx="12" fill="#ffffff" stroke="#0090b8" stroke-width="1.5"/>
</g>
<rect x="424" y="74" width="180" height="24" rx="12" fill="#0090b8"/><rect x="424" y="86" width="180" height="12" fill="#0090b8"/>
<text x="514" y="91" fill="#ffffff" font-size="10" text-anchor="middle" font-weight="bold">PTDM — POST-TX DIABETES</text>
<text x="514" y="122" fill="#0090b8" font-size="19" text-anchor="middle" font-weight="bold">7–30%</text>
<text x="514" y="142" fill="#1c2b39" font-size="9" text-anchor="middle">new-onset diabetes after tx</text>
<text x="514" y="158" fill="#5b6b7a" font-size="8.5" text-anchor="middle">tacrolimus + steroids contribute</text>

<!-- ============ weight gain ============ -->
<g filter="url(#tx8Sh)">
  <rect x="36" y="208" width="160" height="112" rx="12" fill="#ffffff" stroke="#b8860b" stroke-width="1.5"/>
</g>
<rect x="36" y="208" width="160" height="24" rx="12" fill="#b8860b"/><rect x="36" y="220" width="160" height="12" fill="#b8860b"/>
<text x="116" y="225" fill="#ffffff" font-size="10" text-anchor="middle" font-weight="bold">WEIGHT GAIN</text>
<!-- scale icon -->
<rect x="86" y="244" width="60" height="22" rx="6" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.2"/>
<path d="M104 252 h6 l2 -4 l4 6 l2 -4 h6" fill="none" stroke="#b8860b" stroke-width="1.5"/>
<text x="116" y="284" fill="#1c2b39" font-size="9" text-anchor="middle">⅔ of recipients gain</text>
<text x="116" y="298" fill="#1c2b39" font-size="9" text-anchor="middle">~10% weight in year 1</text>

<!-- ============ bone ============ -->
<g filter="url(#tx8Sh)">
  <rect x="212" y="208" width="196" height="112" rx="12" fill="#ffffff" stroke="#7a3b8f" stroke-width="1.5"/>
</g>
<rect x="212" y="208" width="196" height="24" rx="12" fill="#7a3b8f"/><rect x="212" y="220" width="196" height="12" fill="#7a3b8f"/>
<text x="310" y="225" fill="#ffffff" font-size="10" text-anchor="middle" font-weight="bold">BONE DISEASE</text>
<!-- bone icon -->
<path d="M282 258 q-8 -8 0 -14 q8 -6 14 2 q6 -8 14 -2 q8 6 0 14 q-8 8 -14 2 q-6 8 -14 0 q-8 -6 -14 -4 z" fill="#e8d5f0" stroke="#7a3b8f" stroke-width="1.2" transform="rotate(20 296 254)"/>
<text x="310" y="272" fill="#1c2b39" font-size="9" text-anchor="middle">BMD falls most in the first</text>
<text x="310" y="286" fill="#1c2b39" font-size="9" text-anchor="middle">6–12 months after transplant</text>
<text x="310" y="304" fill="#5b6b7a" font-size="8.5" text-anchor="middle">steroids accelerate bone loss</text>

<!-- ============ malignancy ============ -->
<g filter="url(#tx8Sh)">
  <rect x="424" y="208" width="180" height="112" rx="12" fill="#ffffff" stroke="#c10230" stroke-width="1.5"/>
</g>
<rect x="424" y="208" width="180" height="24" rx="12" fill="#c10230"/><rect x="424" y="220" width="180" height="12" fill="#c10230"/>
<text x="514" y="225" fill="#ffffff" font-size="10" text-anchor="middle" font-weight="bold">MALIGNANCY</text>
<text x="514" y="252" fill="#c10230" font-size="16" text-anchor="middle" font-weight="bold">2–4× cancer risk</text>
<text x="514" y="274" fill="#1c2b39" font-size="9" text-anchor="middle">skin cancer is the most common —</text>
<text x="514" y="288" fill="#5b6b7a" font-size="8.5" text-anchor="middle">sun protection + routine screening</text>

<!-- ============ UTI ============ -->
<g filter="url(#tx8Sh)">
  <rect x="36" y="336" width="280" height="58" rx="12" fill="#ffffff" stroke="#0090b8" stroke-width="1.5"/>
</g>
<text x="52" y="356" fill="#0090b8" font-size="10.5" font-weight="bold">UTIs — the most common infection</text>
<text x="52" y="374" fill="#5b6b7a" font-size="9">presentation can be atypical — treat promptly</text>
<text x="52" y="387" fill="#5b6b7a" font-size="9">to protect the graft</text>

<!-- ============ vascular thrombosis ============ -->
<g filter="url(#tx8Sh)">
  <rect x="332" y="336" width="272" height="58" rx="12" fill="#022851"/>
</g>
<text x="348" y="356" fill="#ffbf00" font-size="10.5" font-weight="bold">Vascular thrombosis — early, surgical</text>
<g font-size="9" fill="#cfe0f2">
  <text x="348" y="374">renal artery thrombosis: days 2–3 post-op</text>
  <text x="348" y="387">renal vein thrombosis: first 2 weeks (3.4%)</text>
</g>

<text x="616" y="410" fill="#9aa7b4" font-size="9" text-anchor="end">CNN Exam Prep · Transplant</text>
</svg>