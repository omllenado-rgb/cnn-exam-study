<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="hd9Head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#022851"/><stop offset="1" stop-color="#003a6b"/></linearGradient>
  <marker id="hd9Arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#022851"/></marker>
  <filter id="hd9Sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#022851" flood-opacity="0.18"/></filter>
</defs>
<rect width="640" height="420" fill="#f7fafc"/>
<rect width="640" height="56" fill="url(#hd9Head)"/>
<rect y="56" width="640" height="4" fill="#ffbf00"/>
<text x="24" y="27" fill="#ffffff" font-size="17" font-weight="bold">Emergency Complications</text>
<text x="24" y="45" fill="#ffbf00" font-size="11" letter-spacing="0.5">Cardiac · air embolism · dialysis disequilibrium · exsanguination</text>

<!-- ============ quadrant 1: cardiac (top-left) ============ -->
<g filter="url(#hd9Sh)">
  <rect x="36" y="74" width="280" height="150" rx="12" fill="#ffffff" stroke="#c10230" stroke-width="1.5"/>
</g>
<rect x="36" y="74" width="280" height="26" rx="12" fill="#c10230"/><rect x="36" y="88" width="280" height="12" fill="#c10230"/>
<text x="176" y="92" fill="#ffffff" font-size="11" text-anchor="middle" font-weight="bold">CARDIAC EVENTS</text>
<!-- heart -->
<path d="M72 132 c-8 -10 -22 -4 -22 8 c0 12 14 20 22 28 c8 -8 22 -16 22 -28 c0 -12 -14 -18 -22 -8 z" fill="#c10230" stroke="#8d1f33" stroke-width="1.5"/>
<path d="M62 128 l8 10 l14 -14" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
<g stroke="#c10230" stroke-width="1.8" fill="none" stroke-linecap="round">
  <path d="M112 126 h18 l4 -8 l6 18 l5 -10 h16"/>
</g>
<text x="180" y="126" fill="#1c2b39" font-size="9.5" font-weight="bold">Myocardial stunning</text>
<text x="180" y="140" fill="#5b6b7a" font-size="8.5">ischemic wall-motion dip during UF</text>
<text x="180" y="158" fill="#1c2b39" font-size="9" font-weight="bold">Prevention: UF &lt; 13 mL/kg/hr</text>
<text x="180" y="180" fill="#1c2b39" font-size="9" font-weight="bold">Sudden cardiac death</text>
<text x="180" y="194" fill="#5b6b7a" font-size="8.5">peaks at the first treatment after</text>
<text x="180" y="206" fill="#5b6b7a" font-size="8.5">the long weekend interval</text>

<!-- ============ quadrant 2: air embolism (top-right) ============ -->
<g filter="url(#hd9Sh)">
  <rect x="324" y="74" width="280" height="150" rx="12" fill="#ffffff" stroke="#0a4f88" stroke-width="1.5"/>
</g>
<rect x="324" y="74" width="280" height="26" rx="12" fill="#0a4f88"/><rect x="324" y="88" width="280" height="12" fill="#0a4f88"/>
<text x="464" y="92" fill="#ffffff" font-size="11" text-anchor="middle" font-weight="bold">AIR EMBOLISM</text>
<!-- venous chamber with air -->
<g filter="url(#hd9Sh)">
  <rect x="344" y="108" width="34" height="60" rx="17" fill="#ffffff" stroke="#022851" stroke-width="2"/>
</g>
<rect x="347" y="132" width="28" height="33" rx="14" fill="#c10230"/>
<circle cx="361" cy="121" r="6" fill="#9fc9e8"/>
<circle cx="358" cy="116" r="3.5" fill="#cfe0f2"/>
<line x1="382" y1="138" x2="416" y2="138" stroke="#022851" stroke-width="2" marker-end="url(#hd9Arr)"/>
<!-- patient tilted head-down -->
<circle cx="510" cy="150" r="11" fill="#f4d5bc"/>
<path d="M494 162 h48 l18 16 h-66 z" fill="#4d7fa8"/>
<rect x="478" y="178" width="110" height="8" rx="4" fill="#2c4a68"/>
<rect x="472" y="178" width="12" height="26" fill="#2c4a68"/>
<text x="540" y="198" fill="#5b6b7a" font-size="7.5" text-anchor="middle">head lower than heart</text>
<text x="340" y="196" fill="#0a4f88" font-size="8.5" font-weight="bold">Action: stop pump, clamp</text>
<text x="340" y="208" fill="#0a4f88" font-size="8.5" font-weight="bold">venous line, left-lateral</text>
<text x="340" y="220" fill="#0a4f88" font-size="8.5" font-weight="bold">Trendelenburg, give O₂</text>

<!-- ============ quadrant 3: DDS (bottom-left) ============ -->
<g filter="url(#hd9Sh)">
  <rect x="36" y="238" width="280" height="150" rx="12" fill="#ffffff" stroke="#7a3b8f" stroke-width="1.5"/>
</g>
<rect x="36" y="238" width="280" height="26" rx="12" fill="#7a3b8f"/><rect x="36" y="252" width="280" height="12" fill="#7a3b8f"/>
<text x="176" y="256" fill="#ffffff" font-size="11" text-anchor="middle" font-weight="bold">DIALYSIS DISEQUILIBRIUM (DDS)</text>
<!-- brain -->
<g filter="url(#hd9Sh)">
  <path d="M84 292 q-16 8 -8 24 q-10 14 6 22 q4 14 20 12 q12 10 24 0 q16 2 20 -12 q14 -10 6 -24 q8 -16 -8 -22 q-6 -14 -22 -12 q-12 -8 -38 10 z" transform="translate(24,16)" fill="#e8d5f0" stroke="#7a3b8f" stroke-width="1.5"/>
</g>
<path d="M120 296 q10 14 0 26 M108 288 q-8 12 -2 22" fill="none" stroke="#7a3b8f" stroke-width="1.2"/>
<circle cx="106" cy="300" r="3" fill="#7a3b8f" opacity="0.5"/>
<circle cx="112" cy="316" r="3" fill="#7a3b8f" opacity="0.5"/>
<circle cx="100" cy="330" r="3" fill="#7a3b8f" opacity="0.5"/>
<circle cx="124" cy="332" r="3" fill="#7a3b8f" opacity="0.5"/>
<text x="106" y="376" fill="#7a3b8f" font-size="8.5" text-anchor="middle" font-weight="bold">cerebral edema</text>
<text x="196" y="290" fill="#1c2b39" font-size="8.5" font-weight="bold">Rapid urea removal pulls</text>
<text x="196" y="302" fill="#1c2b39" font-size="8.5" font-weight="bold">water into the brain</text>
<text x="196" y="318" fill="#5b6b7a" font-size="8">headache → confusion</text>
<text x="196" y="330" fill="#5b6b7a" font-size="8">→ seizures (first tx)</text>
<rect x="190" y="338" width="118" height="40" rx="8" fill="#f3ecf8" stroke="#7a3b8f" stroke-width="1"/>
<text x="249" y="352" fill="#5a2f73" font-size="8" text-anchor="middle" font-weight="bold">PREVENT</text>
<text x="249" y="364" fill="#5a2f73" font-size="7.5" text-anchor="middle">2–2.5 hr initial treatments,</text>
<text x="249" y="374" fill="#5a2f73" font-size="7.5" text-anchor="middle">blood flow 200–250 mL/min</text>

<!-- ============ quadrant 4: exsanguination / leak (bottom-right) ============ -->
<g filter="url(#hd9Sh)">
  <rect x="324" y="238" width="280" height="150" rx="12" fill="#ffffff" stroke="#8d1f33" stroke-width="1.5"/>
</g>
<rect x="324" y="238" width="280" height="26" rx="12" fill="#8d1f33"/><rect x="324" y="252" width="280" height="12" fill="#8d1f33"/>
<text x="464" y="256" fill="#ffffff" font-size="11" text-anchor="middle" font-weight="bold">EXSANGUINATION &amp; BLOOD LEAK</text>
<!-- leak detector -->
<g filter="url(#hd9Sh)">
  <rect x="340" y="278" width="110" height="56" rx="10" fill="#e9f1f8" stroke="#5b6b7a" stroke-width="1.5"/>
</g>
<rect x="352" y="290" width="40" height="32" rx="6" fill="#00b2e3" opacity="0.4"/>
<rect x="352" y="290" width="40" height="32" rx="6" fill="none" stroke="#0090b8" stroke-width="1"/>
<circle cx="404" cy="306" r="7" fill="#ffbf00"/>
<circle cx="404" cy="306" r="2" fill="#8a6d1b"/>
<text x="502" y="300" fill="#5b6b7a" font-size="7.5" text-anchor="middle">photoelectric cell detects</text>
<text x="502" y="310" fill="#5b6b7a" font-size="7.5" text-anchor="middle">blood leaking into dialysate</text>
<text x="340" y="352" fill="#c10230" font-size="8.5" font-weight="bold">cause: fiber tear or hemolysis</text>
<text x="340" y="368" fill="#1c2b39" font-size="9" font-weight="bold">&gt; 40% blood loss = exsanguination</text>
<g font-size="8.5" fill="#5b6b7a">
  <text x="340" y="384">→ stop pump · clamp lines · direct pressure</text>
</g>
<text x="616" y="414" fill="#9aa7b4" font-size="9" text-anchor="end">CNN Exam Prep · Hemodialysis</text>
</svg>