<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="ac2Head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#022851"/><stop offset="1" stop-color="#003a6b"/></linearGradient>
  <marker id="ac2Arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#022851"/></marker>
  <marker id="ac2ArrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c10230"/></marker>
  <marker id="ac2ArrCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0090b8"/></marker>
  <marker id="ac2ArrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00573f"/></marker>
  <filter id="ac2Sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#022851" flood-opacity="0.18"/></filter>
</defs>
<rect width="640" height="420" fill="#f7fafc"/>
<rect width="640" height="56" fill="url(#ac2Head)"/>
<rect y="56" width="640" height="4" fill="#ffbf00"/>
<text x="24" y="27" fill="#ffffff" font-size="17" font-weight="bold">CRRT Modalities &amp; Their Differences</text>
<text x="24" y="45" fill="#ffbf00" font-size="11" letter-spacing="0.5">SCUF · CVVH · CVVHD · CVVHDF</text>

<!-- legend chips -->
<g font-size="8.5" font-weight="bold">
  <text x="46" y="76" fill="#c10230">— blood</text>
  <text x="106" y="76" fill="#0090b8">— dialysate</text>
  <text x="186" y="76" fill="#00573f">— replacement</text>
  <text x="286" y="76" fill="#b8860b">— effluent (waste)</text>
</g>

<!-- ============ CVVH (top-left) ============ -->
<g>
  <rect x="36" y="88" width="286" height="150" rx="12" fill="#ffffff" stroke="#00573f" stroke-width="1.5" filter="url(#ac2Sh)"/>
  <text x="50" y="108" fill="#022851" font-size="13" font-weight="bold">CVVH — hemofiltration</text>
  <path d="M56 150 H120 V150 H160" fill="none" stroke="#c10230" stroke-width="4.5" stroke-linecap="round"/>
  <g filter="url(#ac2Sh)"><rect x="160" y="134" width="52" height="52" rx="9" fill="#e9f1f8" stroke="#5b6b7a" stroke-width="1.5"/></g>
  <g stroke="#ffbf00" stroke-width="2"><line x1="170" y1="140" x2="170" y2="180"/><line x1="180" y1="140" x2="180" y2="180"/><line x1="190" y1="140" x2="190" y2="180"/><line x1="200" y1="140" x2="200" y2="180"/></g>
  <path d="M212 150 H272" fill="none" stroke="#c10230" stroke-width="4.5" stroke-linecap="round"/>
  <!-- replacement pre-filter -->
  <path d="M92 122 V142" fill="none" stroke="#00573f" stroke-width="4"/>
  <text x="100" y="130" fill="#00573f" font-size="7.5" font-weight="bold">replacement (pre/post)</text>
  <!-- effluent -->
  <path d="M186 186 V210" fill="none" stroke="#b8860b" stroke-width="4"/>
  <text x="196" y="208" fill="#b8860b" font-size="7.5" font-weight="bold">effluent</text>
  <text x="50" y="224" fill="#5b6b7a" font-size="9">convection only — solute drag; ↑ clotting risk</text>
  <text x="50" y="235" fill="#5b6b7a" font-size="9">from hemoconcentration in the filter</text>
</g>

<!-- ============ CVVHD (top-right) ============ -->
<g>
  <rect x="338" y="88" width="286" height="150" rx="12" fill="#ffffff" stroke="#0090b8" stroke-width="1.5" filter="url(#ac2Sh)"/>
  <text x="352" y="108" fill="#022851" font-size="13" font-weight="bold">CVVHD — hemodialysis</text>
  <path d="M356 150 H420 V150 H460" fill="none" stroke="#c10230" stroke-width="4.5" stroke-linecap="round"/>
  <g filter="url(#ac2Sh)"><rect x="460" y="134" width="52" height="52" rx="9" fill="#e9f1f8" stroke="#5b6b7a" stroke-width="1.5"/></g>
  <g stroke="#ffbf00" stroke-width="2"><line x1="470" y1="140" x2="470" y2="180"/><line x1="480" y1="140" x2="480" y2="180"/><line x1="490" y1="140" x2="490" y2="180"/><line x1="500" y1="140" x2="500" y2="180"/></g>
  <path d="M512 150 H572" fill="none" stroke="#c10230" stroke-width="4.5" stroke-linecap="round"/>
  <!-- dialysate counter-current -->
  <path d="M574 126 H458" fill="none" stroke="#0090b8" stroke-width="4"/>
  <text x="574" y="119" fill="#0090b8" font-size="7.5" text-anchor="end" font-weight="bold">dialysate → (counter-current)</text>
  <path d="M486 186 V210" fill="none" stroke="#b8860b" stroke-width="4"/>
  <text x="496" y="208" fill="#b8860b" font-size="7.5" font-weight="bold">effluent</text>
  <text x="352" y="224" fill="#5b6b7a" font-size="9">diffusion with less UF — no replacement fluid,</text>
  <text x="352" y="235" fill="#5b6b7a" font-size="9">so fluid balance can run negative on its own</text>
</g>

<!-- ============ CVVHDF (bottom-left) ============ -->
<g>
  <rect x="36" y="252" width="286" height="150" rx="12" fill="#ffffff" stroke="#022851" stroke-width="1.5" filter="url(#ac2Sh)"/>
  <text x="76" y="274" fill="#022851" font-size="13" font-weight="bold">CVVHDF</text>
  <path d="M56 292 H120 V292 H160" fill="none" stroke="#c10230" stroke-width="4.5" stroke-linecap="round"/>
  <g filter="url(#ac2Sh)"><rect x="160" y="276" width="52" height="52" rx="9" fill="#e9f1f8" stroke="#5b6b7a" stroke-width="1.5"/></g>
  <g stroke="#ffbf00" stroke-width="2"><line x1="170" y1="282" x2="170" y2="322"/><line x1="180" y1="282" x2="180" y2="322"/><line x1="190" y1="282" x2="190" y2="322"/><line x1="200" y1="282" x2="200" y2="322"/></g>
  <path d="M212 292 H272" fill="none" stroke="#c10230" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M64 262 V288" fill="none" stroke="#00573f" stroke-width="4"/>
  <text x="50" y="312" fill="#00573f" font-size="7.5" font-weight="bold">sterile replacement</text>
  <path d="M318 312 H214" fill="none" stroke="#0090b8" stroke-width="4"/>
  <text x="318" y="306" fill="#0090b8" font-size="7.5" text-anchor="end" font-weight="bold">dialysate →</text>
  <path d="M186 328 V352" fill="none" stroke="#b8860b" stroke-width="4"/>
  <text x="196" y="350" fill="#b8860b" font-size="7.5" font-weight="bold">effluent</text>
  <text x="50" y="368" fill="#5b6b7a" font-size="9">the hybrid — CVVHD + replacement clears small</text>
  <text x="50" y="378" fill="#5b6b7a" font-size="9">AND middle molecules (diffusion + convection)</text>
</g>

<!-- ============ SCUF (bottom-right) ============ -->
<g>
  <rect x="338" y="252" width="286" height="150" rx="12" fill="#ffffff" stroke="#b8860b" stroke-width="1.5" filter="url(#ac2Sh)"/>
  <text x="352" y="274" fill="#022851" font-size="13" font-weight="bold">SCUF — slow continuous UF</text>
  <path d="M356 292 H420 V292 H460" fill="none" stroke="#c10230" stroke-width="4.5" stroke-linecap="round"/>
  <g filter="url(#ac2Sh)"><rect x="460" y="276" width="52" height="52" rx="9" fill="#e9f1f8" stroke="#5b6b7a" stroke-width="1.5"/></g>
  <g stroke="#ffbf00" stroke-width="2"><line x1="470" y1="282" x2="470" y2="322"/><line x1="480" y1="282" x2="480" y2="322"/><line x1="490" y1="282" x2="490" y2="322"/><line x1="500" y1="282" x2="500" y2="322"/></g>
  <path d="M512 292 H572" fill="none" stroke="#c10230" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M486 328 V352" fill="none" stroke="#b8860b" stroke-width="4"/>
  <text x="496" y="350" fill="#b8860b" font-size="7.5" font-weight="bold">UF only &lt; 10 mL/min</text>
  <g font-size="8.5" fill="#5b6b7a">
    <text x="352" y="368">· no dialysate, no replacement — volume</text>
    <text x="352" y="378">  control only, minimal solute clearance</text>
  </g>
</g>

<text x="616" y="410" fill="#9aa7b4" font-size="9" text-anchor="end">CNN Exam Prep · Acute Therapies</text>
</svg>