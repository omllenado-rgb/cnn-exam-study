<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="pd4Head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#022851"/><stop offset="1" stop-color="#003a6b"/></linearGradient>
  <marker id="pd4Arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#022851"/></marker>
  <filter id="pd4Sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#022851" flood-opacity="0.18"/></filter>
</defs>
<rect width="640" height="420" fill="#f7fafc"/>
<rect width="640" height="56" fill="url(#pd4Head)"/>
<rect y="56" width="640" height="4" fill="#ffbf00"/>
<text x="24" y="27" fill="#ffffff" font-size="17" font-weight="bold">Dialysate Solutions &amp; Osmotic Agents</text>
<text x="24" y="45" fill="#ffbf00" font-size="11" letter-spacing="0.5">Dextrose ladder · glucose load · icodextrin · amino acids</text>

<!-- ============ dextrose ladder (top) ============ -->
<rect x="36" y="70" width="568" height="158" rx="12" fill="#ffffff" stroke="#e3e8ee" filter="url(#pd4Sh)"/>
<text x="52" y="92" fill="#022851" font-size="12.5" font-weight="bold">Dextrose — the osmotic engine of PD</text>
<!-- bag 1.5 -->
<g filter="url(#pd4Sh)">
  <path d="M92 118 h58 v34 q0 12 -29 12 t-29 -12 z" fill="#e2f2fb" stroke="#0090b8" stroke-width="2"/>
</g>
<rect x="98" y="112" width="46" height="8" rx="2" fill="#022851"/>
<text x="121" y="150" fill="#0090b8" font-size="10" text-anchor="middle" font-weight="bold">1.5%</text>
<text x="121" y="186" fill="#5b6b7a" font-size="8.5" text-anchor="middle">maintenance,</text>
<text x="121" y="197" fill="#5b6b7a" font-size="8.5" text-anchor="middle">long dwells</text>
<rect x="100" y="206" width="42" height="6" rx="3" fill="#eef4f8"/>
<rect x="100" y="206" width="14" height="6" rx="3" fill="#00b2e3"/>
<!-- bag 2.5 -->
<g filter="url(#pd4Sh)">
  <path d="M286 108 h62 v40 q0 12 -31 12 t-31 -12 z" fill="#d8edf8" stroke="#0090b8" stroke-width="2"/>
</g>
<rect x="292" y="112" width="50" height="8" rx="2" fill="#022851"/>
<text x="317" y="150" fill="#0090b8" font-size="10" text-anchor="middle" font-weight="bold">2.5%</text>
<text x="317" y="186" fill="#5b6b7a" font-size="8.5" text-anchor="middle">the workhorse —</text>
<text x="317" y="197" fill="#5b6b7a" font-size="8.5" text-anchor="middle">standard PET fill</text>
<rect x="296" y="206" width="42" height="6" rx="3" fill="#eef4f8"/>
<rect x="292" y="206" width="30" height="6" rx="3" fill="#00b2e3"/>
<!-- bag 4.25 -->
<g filter="url(#pd4Sh)">
  <path d="M490 104 h68 v48 q0 14 -34 14 t-34 -14 z" fill="#bfe2f2" stroke="#0090b8" stroke-width="2"/>
</g>
<rect x="498" y="108" width="52" height="8" rx="2" fill="#022851"/>
<text x="524" y="150" fill="#0090b8" font-size="10" text-anchor="middle" font-weight="bold">4.25%</text>
<text x="524" y="186" fill="#5b6b7a" font-size="8.5" text-anchor="middle">max UF — pulls fluid</text>
<text x="524" y="197" fill="#5b6b7a" font-size="8.5" text-anchor="middle">hard; use for volume</text>
<rect x="486" y="206" width="76" height="6" rx="3" fill="#eef4f8"/>
<rect x="486" y="206" width="64" height="6" rx="3" fill="#00b2e3"/>
<text x="216" y="128" fill="#5b6b7a" font-size="8" text-anchor="middle">↑ dextrose =</text>
<text x="216" y="140" fill="#5b6b7a" font-size="8" text-anchor="middle">↑ osmotic pull</text>
<text x="216" y="152" fill="#5b6b7a" font-size="8" text-anchor="middle">= ↑ ultrafiltration</text>
<text x="216" y="176" fill="#8a6d1b" font-size="8.5" text-anchor="middle">UF bar grows with</text>
<text x="216" y="187" fill="#8a6d1b" font-size="8.5" text-anchor="middle">concentration</text>
<text x="412" y="122" fill="#022851" font-size="9" text-anchor="middle" font-weight="bold">Standard calcium</text>
<text x="412" y="134" fill="#022851" font-size="9" text-anchor="middle" font-weight="bold">2.5 mEq/L</text>
<text x="412" y="152" fill="#5b6b7a" font-size="8" text-anchor="middle">baths customized</text>
<text x="412" y="162" fill="#5b6b7a" font-size="8" text-anchor="middle">to the patient</text>
<text x="412" y="180" fill="#5b6b7a" font-size="8" text-anchor="middle">buffer: lactate /</text>
<text x="412" y="190" fill="#5b6b7a" font-size="8" text-anchor="middle">bicarbonate</text>

<!-- ============ glucose tax (bottom left) ============ -->
<rect x="36" y="240" width="300" height="146" rx="12" fill="#ffffff" stroke="#e3e8ee" filter="url(#pd4Sh)"/>
<text x="52" y="262" fill="#022851" font-size="12.5" font-weight="bold">The glucose tax — every day</text>
<g filter="url(#pd4Sh)">
  <rect x="52" y="276" width="130" height="52" rx="10" fill="#022851"/>
</g>
<text x="117" y="300" fill="#ffbf00" font-size="15" text-anchor="middle" font-weight="bold">100–200 g</text>
<text x="117" y="316" fill="#cfe0f2" font-size="8" text-anchor="middle">glucose absorbed daily</text>
<!-- sugar cubes -->
<g>
  <rect x="200" y="282" width="16" height="16" rx="2" fill="#ffffff" stroke="#c9d4de" stroke-width="1.2"/>
  <rect x="218" y="292" width="16" height="16" rx="2" fill="#ffffff" stroke="#c9d4de" stroke-width="1.2"/>
  <rect x="206" y="304" width="16" height="16" rx="2" fill="#ffffff" stroke="#c9d4de" stroke-width="1.2"/>
  <rect x="228" y="308" width="16" height="16" rx="2" fill="#ffffff" stroke="#c9d4de" stroke-width="1.2"/>
</g>
<text x="52" y="352" fill="#c10230" font-size="9.5" font-weight="bold">→ hyperglycemia &amp; hyperinsulinemia</text>
<text x="52" y="368" fill="#1c2b39" font-size="9">weight gain · appetite suppression</text>
<text x="52" y="382" fill="#5b6b7a" font-size="8.5">a special problem in diabetic patients</text>

<!-- ============ icodextrin + amino acids (bottom right) ============ -->
<rect x="348" y="240" width="256" height="146" rx="12" fill="#ffffff" stroke="#e3e8ee" filter="url(#pd4Sh)"/>
<text x="364" y="262" fill="#022851" font-size="12.5" font-weight="bold">Icodextrin 7.5% — the alternative</text>
<rect x="364" y="272" width="224" height="30" rx="6" fill="#e9f1f8"/>
<text x="500" y="278" fill="#022851" font-size="8.5" text-anchor="middle" font-weight="bold">nonglucose colloid osmotic agent</text>
<text x="500" y="290" fill="#5b6b7a" font-size="8" text-anchor="middle">long dwells of 8–16 h · high transporters</text>
<text x="364" y="312" fill="#1c2b39" font-size="8.5" font-weight="bold">Know its three quirks:</text>
<g font-size="8.5" fill="#5b6b7a">
  <text x="364" y="327" font-weight="bold" fill="#1c2b39">1.</text>
  <text x="378" y="327">maltose metabolites → falsely high</text>
  <text x="378" y="338">glucose readings on some strips</text>
  <text x="364" y="353" font-weight="bold" fill="#1c2b39">2.</text>
  <text x="378" y="353">interferes with serum amylase — use lipase</text>
</g>
<text x="364" y="374" fill="#00573f" font-size="8.5" font-weight="bold">Amino acid baths: once daily, for malnutrition</text>

<text x="616" y="412" fill="#9aa7b4" font-size="9" text-anchor="end">CNN Exam Prep · Peritoneal Dialysis</text>
</svg>