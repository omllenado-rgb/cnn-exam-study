<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="ck8Head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#022851"/><stop offset="1" stop-color="#003a6b"/></linearGradient>
  <linearGradient id="ck8Ladder" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e2f2e6"/><stop offset="1" stop-color="#c10230"/></linearGradient>
  <marker id="ck8Arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#022851"/></marker>
  <filter id="ck8Sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#022851" flood-opacity="0.18"/></filter>
</defs>
<rect width="640" height="420" fill="#f7fafc"/>
<rect width="640" height="56" fill="url(#ck8Head)"/>
<rect y="56" width="640" height="4" fill="#ffbf00"/>
<text x="24" y="27" fill="#ffffff" font-size="17" font-weight="bold">Diabetic Nephropathy &amp; Dyslipidemia</text>
<text x="24" y="45" fill="#ffbf00" font-size="11" letter-spacing="0.5">#1 cause of adult kidney failure — 38% of US dialysis patients</text>

<!-- ============ left: 5-stage ladder ============ -->
<rect x="24" y="76" width="300" height="272" rx="12" fill="#ffffff" stroke="#e3e8ee" filter="url(#ck8Sh)"/>
<text x="40" y="98" fill="#022851" font-size="12" font-weight="bold">Five stages of diabetic nephropathy</text>
<!-- stage bars (widening + darkening = progression) -->
<g font-size="9.5">
  <rect x="40" y="110" width="90" height="36" rx="6" fill="#e2f2e6" stroke="#00573f" stroke-width="1"/>
  <text x="48" y="126" fill="#00573f" font-weight="bold">1 · Hyperfiltration</text>
  <text x="48" y="140" fill="#5b6b7a" font-size="8">GFR &gt; 90</text>

  <rect x="140" y="150" width="110" height="32" rx="6" fill="#fdf6e3" stroke="#b8860b" stroke-width="1"/>
  <text x="148" y="164" fill="#8a6d1b" font-weight="bold">2 · Silent</text>
  <text x="148" y="177" fill="#5b6b7a" font-size="8">no symptoms yet</text>

  <rect x="60" y="190" width="190" height="36" rx="6" fill="#e2f2fb" stroke="#0090b8" stroke-width="1"/>
  <text x="68" y="208" fill="#0090b8" font-weight="bold">3 · Microalbuminuria</text>
  <text x="68" y="222" fill="#5b6b7a" font-size="8">GFR 30–59 · ACEi/ARB + nephrology referral</text>

  <rect x="80" y="234" width="220" height="36" rx="6" fill="#fdf0f0" stroke="#c10230" stroke-width="1"/>
  <text x="88" y="252" fill="#c10230" font-weight="bold">4 · Overt nephropathy</text>
  <text x="88" y="266" fill="#5b6b7a" font-size="8">GFR 15–29 · proteinuria · monitor K⁺, Cr, albumin</text>

  <rect x="100" y="278" width="200" height="36" rx="6" fill="#c10230"/>
  <text x="108" y="294" fill="#ffffff" font-weight="bold">5 · ESRD</text>
  <text x="160" y="292" fill="#ffffff" font-size="8">GFR &lt; 15 · dialysis or transplant</text>
</g>
<text x="40" y="332" fill="#5b6b7a" font-size="8.5">Stage 3 is the action point — protect the kidney, refer, watch K⁺ &amp; creatinine</text>

<!-- progression arrow -->
<line x1="336" y1="212" x2="336" y2="212" stroke="#022851" stroke-width="2" marker-end="url(#ck8Arr)"/>

<!-- ============ right: statins ============ -->
<rect x="344" y="76" width="272" height="200" rx="12" fill="#ffffff" stroke="#e3e8ee" filter="url(#ck8Sh)"/>
<rect x="344" y="76" width="272" height="30" rx="12" fill="#022851"/>
<rect x="344" y="94" width="272" height="12" fill="#022851"/>
<text x="480" y="97" fill="#ffbf00" font-size="10.5" text-anchor="middle" font-weight="bold">DYSLIPIDEMIA — STATINS ARE ESSENTIAL</text>
<g font-size="9" fill="#1c2b39">
  <text x="360" y="126" font-weight="bold" fill="#022851">Who gets a statin?</text>
  <text x="360" y="146" font-weight="bold" fill="#00573f">Ages 18–49</text>
  <text x="360" y="162">· known CAD, diabetes, or prior stroke</text>
  <text x="360" y="184" font-weight="bold" fill="#00573f">Ages 50+</text>
  <text x="360" y="200">· GFR &lt; 60 → statin, or statin + ezetimibe</text>
  <text x="360" y="222" fill="#c10230" font-weight="bold">10-year MI / coronary death risk &gt; 10%</text>
</g>
<rect x="360" y="234" width="240" height="28" rx="6" fill="#e2f2e6"/>
<text x="480" y="252" fill="#00573f" font-size="9" text-anchor="middle" font-weight="bold">Statins show the greatest CV event reduction</text>

<!-- lipid chip visual -->
<g filter="url(#ck8Sh)">
  <rect x="344" y="292" width="272" height="56" rx="12" fill="#022851"/>
</g>
<text x="360" y="314" fill="#ffbf00" font-size="10" font-weight="bold">Dyslipidemia appears early in CKD</text>
<text x="360" y="332" fill="#cfe0f2" font-size="8.5">screen at diagnosis and recheck as GFR falls</text>

<!-- caption -->
<text x="320" y="392" fill="#022851" font-size="10.5" text-anchor="middle" font-weight="bold">Microalbuminuria (stage 3) is the checkpoint — ACEi/ARB and referral change the trajectory</text>
<text x="616" y="410" fill="#9aa7b4" font-size="9" text-anchor="end">CNN Exam Prep · CKD Complications</text>
</svg>