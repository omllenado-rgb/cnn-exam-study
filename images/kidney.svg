<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="kidHead" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#022851"/><stop offset="1" stop-color="#003a6b"/></linearGradient>
  <linearGradient id="kidBody" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c96a72"/><stop offset="0.5" stop-color="#a83a48"/><stop offset="1" stop-color="#8d1f33"/></linearGradient>
  <linearGradient id="kidInner" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0dde0"/><stop offset="1" stop-color="#e0c2c8"/></linearGradient>
  <linearGradient id="kidUreter" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0dde0"/><stop offset="1" stop-color="#d8b8c0"/></linearGradient>
  <filter id="kidSh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#022851" flood-opacity="0.2"/></filter>
</defs>
<rect width="640" height="420" fill="#f7fafc"/>
<rect width="640" height="56" fill="url(#kidHead)"/>
<rect y="56" width="640" height="4" fill="#ffbf00"/>
<text x="24" y="27" fill="#ffffff" font-size="17" font-weight="bold">The Kidneys</text>
<text x="24" y="45" fill="#ffbf00" font-size="11" letter-spacing="0.5">Anatomy · blood supply · urine outflow</text>

<!-- ============ kidney with cutaway (center-left) ============ -->
<g filter="url(#kidSh)">
  <!-- whole kidney silhouette -->
  <path d="M250 130 C210 120 172 148 168 196 C164 246 198 292 244 296 C258 293 266 284 268 270 L268 152 C266 140 260 132 250 130 Z" fill="url(#kidBody)" stroke="#7a1c2e" stroke-width="2"/>
</g>
<!-- hilum (medial side) -->
<path d="M268 180 q26 -6 30 8 q-4 14 -30 10 z" fill="#5e1622"/>
<!-- renal artery / vein / ureter -->
<path d="M300 176 H352" stroke="#c10230" stroke-width="7" stroke-linecap="round"/>
<path d="M300 196 H358" stroke="#0090b8" stroke-width="8" stroke-linecap="round"/>
<path d="M296 214 q40 10 60 44 q14 26 14 52" fill="none" stroke="url(#kidUreter)" stroke-width="8" stroke-linecap="round"/>
<text x="358" y="176" fill="#c10230" font-size="9.5" font-weight="bold">renal artery</text>
<text x="372" y="200" fill="#0090b8" font-size="9.5" font-weight="bold">renal vein</text>
<text x="378" y="272" fill="#8a5a66" font-size="9.5" font-weight="bold">ureter</text>

<!-- cutaway: cortex/medulla bands -->
<path d="M250 130 C210 120 172 148 168 196 C164 246 198 292 244 292 C254 289 260 282 262 270 L262 152 C260 140 258 132 250 130 Z" fill="url(#kidBody)"/>
<!-- cortex band (outer rim of cut face) -->
<path d="M244 138 C208 130 178 152 175 194 C172 238 202 278 242 282 C250 279 254 274 255 266 L255 144 C253 138 250 136 244 138 Z" fill="url(#kidBody)"/>
<rect x="175" y="130" width="0" height="0"/>
<!-- medulla pyramids -->
<g fill="#e8cdd3" stroke="#c9a0aa" stroke-width="1">
  <path d="M196 160 L232 168 L232 190 L200 196 Z"/>
  <path d="M192 202 L232 196 L232 224 L196 226 Z"/>
  <path d="M196 236 L232 230 L232 258 L202 254 Z"/>
  <path d="M206 264 L232 264 L230 280 L212 276 Z"/>
</g>
<!-- renal pelvis -->
<path d="M236 176 q14 -4 18 8 q-2 22 -18 30 q-14 -10 -16 -30 q4 -10 16 -8 z" fill="#fff" stroke="#c9a0aa" stroke-width="1.2"/>
<text x="330" y="130" fill="#8d1f33" font-size="10" font-weight="bold">cutaway</text>
<line x1="292" y1="134" x2="252" y2="150" stroke="#8d1f33" stroke-width="1" stroke-dasharray="3 2"/>

<!-- labels on kidney -->
<line x1="200" y1="145" x2="150" y2="122" stroke="#022851" stroke-width="1.2"/>
<text x="66" y="118" fill="#022851" font-size="10" font-weight="bold">Cortex — filters blood</text>
<line x1="214" y1="210" x2="140" y2="210" stroke="#022851" stroke-width="1.2"/>
<text x="60" y="206" fill="#022851" font-size="10" font-weight="bold">Medulla (pyramids) —</text>
<text x="60" y="218" fill="#022851" font-size="10" font-weight="bold">concentrates urine</text>
<line x1="242" y1="196" x2="140" y2="252" stroke="#022851" stroke-width="1.2"/>
<text x="52" y="266" fill="#022851" font-size="10" font-weight="bold">Renal pelvis — collects</text>
<text x="52" y="278" fill="#022851" font-size="10" font-weight="bold">urine → ureter</text>

<!-- ============ right: function facts ============ -->
<g filter="url(#kidSh)">
  <rect x="418" y="86" width="198" height="130" rx="12" fill="#ffffff" stroke="#e3e8ee"/>
</g>
<text x="434" y="108" fill="#022851" font-size="12" font-weight="bold">What healthy kidneys do</text>
<g font-size="9.5" fill="#1c2b39">
  <text x="434" y="130">· Filter ~180 L of plasma a day</text>
  <text x="434" y="148">· Clear wastes (urea, creatinine)</text>
  <text x="434" y="166">· Balance water &amp; electrolytes</text>
  <text x="434" y="184">· Make erythropoietin (RBCs)</text>
  <text x="434" y="202">· Activate vitamin D; regulate BP</text>
</g>

<!-- GFR chip -->
<g filter="url(#kidSh)">
  <rect x="418" y="228" width="198" height="66" rx="12" fill="#022851"/>
</g>
<text x="434" y="250" fill="#ffbf00" font-size="10.5" font-weight="bold">GFR — the kidney's report card</text>
<text x="434" y="268" fill="#cfe0f2" font-size="9">normal ≈ ≥ 90 mL/min; it falls as</text>
<text x="434" y="282" fill="#cfe0f2" font-size="9">kidney disease progresses (CKD 1→5)</text>

<!-- nephron count -->
<g filter="url(#kidSh)">
  <rect x="418" y="306" width="198" height="58" rx="12" fill="#e2f2fb" stroke="#0090b8" stroke-width="1.2"/>
</g>
<text x="434" y="328" fill="#00573f" font-size="10" font-weight="bold">≈ 1 million nephrons each</text>
<text x="434" y="344" fill="#1c2b39" font-size="9">tiny filters that do all the work —</text>
<text x="434" y="357" fill="#1c2b39" font-size="9">lost ones never grow back</text>

<!-- blood flow ribbon -->
<path d="M352 176 q40 -14 66 0" fill="none" stroke="#c10230" stroke-width="2" opacity="0"/>
<text x="320" y="392" fill="#022851" font-size="10.5" text-anchor="middle" font-weight="bold">~20% of cardiac output flows through the kidneys at all times</text>
<text x="616" y="412" fill="#9aa7b4" font-size="9" text-anchor="end">CNN Exam Prep</text>
</svg>