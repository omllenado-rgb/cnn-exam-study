<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="ac1Head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#022851"/><stop offset="1" stop-color="#003a6b"/></linearGradient>
  <linearGradient id="ac1Blood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e25563"/><stop offset="1" stop-color="#c10230"/></linearGradient>
  <linearGradient id="ac1Eff" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9eefc"/><stop offset="1" stop-color="#8fdcf5"/></linearGradient>
  <marker id="ac1Arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#022851"/></marker>
  <marker id="ac1ArrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c10230"/></marker>
  <marker id="ac1ArrCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0090b8"/></marker>
  <marker id="ac1ArrGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d99a00"/></marker>
  <filter id="ac1Sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#022851" flood-opacity="0.18"/></filter>
</defs>
<rect width="640" height="420" fill="#f7fafc"/>
<rect width="640" height="56" fill="url(#ac1Head)"/>
<rect y="56" width="640" height="4" fill="#ffbf00"/>
<text x="24" y="27" fill="#ffffff" font-size="17" font-weight="bold">Solute Removal Mechanisms in CRRT</text>
<text x="24" y="45" fill="#ffbf00" font-size="11" letter-spacing="0.5">convection · diffusion · adsorption</text>

<!-- center hemofilter cross-section -->
<g filter="url(#ac1Sh)">
  <rect x="256" y="96" width="128" height="228" rx="14" fill="#ffffff" stroke="#5b6b7a" stroke-width="2"/>
</g>
<rect x="264" y="106" width="48" height="208" rx="8" fill="url(#ac1Blood)"/>
<rect x="328" y="106" width="48" height="208" rx="8" fill="url(#ac1Eff)"/>
<rect x="314" y="104" width="12" height="212" fill="#e8eef4" stroke="#022851" stroke-width="1"/>
<text x="288" y="330" fill="#c10230" font-size="10" text-anchor="middle" font-weight="bold">BLOOD</text>
<text x="352" y="330" fill="#0090b8" font-size="10" text-anchor="middle" font-weight="bold">EFFLUENT</text>
<text x="320" y="345" fill="#5b6b7a" font-size="9" text-anchor="middle">CRRT hemofilter membrane</text>
<!-- protein clog on membrane (adsorption motif) -->
<g fill="#7a3b8f">
  <circle cx="320" cy="118" r="2.2"/><circle cx="321" cy="128" r="2"/><circle cx="319" cy="138" r="2.4"/>
  <circle cx="320" cy="140" r="2"/><circle cx="321" cy="150" r="2.2"/>
</g>

<!-- CONVECTION (top-left) -->
<g>
  <rect x="24" y="76" width="196" height="86" rx="10" fill="#ffffff" stroke="#0090b8" stroke-width="1.5" filter="url(#ac1Sh)"/>
  <text x="38" y="96" fill="#0090b8" font-size="12.5" font-weight="bold">1 · Convection</text>
  <line x1="40" y1="124" x2="72" y2="112" stroke="#0090b8" stroke-width="2" marker-end="url(#ac1ArrCyan)"/>
  <line x1="40" y1="132" x2="72" y2="132" stroke="#0090b8" stroke-width="2" marker-end="url(#ac1ArrCyan)"/>
  <text x="80" y="120" fill="#5b6b7a" font-size="9.5">TMP drags plasma water,</text>
  <text x="80" y="132" fill="#5b6b7a" font-size="9.5">solutes go along (solvent drag)</text>
  <text x="38" y="154" fill="#0090b8" font-size="8" font-weight="bold">midsized–large molecules (β₂-microglobulin)</text>
</g>

<!-- DIFFUSION (top-right) -->
<g>
  <rect x="420" y="76" width="196" height="86" rx="10" fill="#ffffff" stroke="#c10230" stroke-width="1.5" filter="url(#ac1Sh)"/>
  <text x="434" y="96" fill="#c10230" font-size="12.5" font-weight="bold">2 · Diffusion</text>
  <circle cx="444" cy="124" r="4" fill="#c10230"/><circle cx="454" cy="132" r="4" fill="#c10230"/>
  <line x1="462" y1="128" x2="512" y2="128" stroke="#c10230" stroke-width="2" marker-end="url(#ac1ArrRed)"/>
  <circle cx="526" cy="124" r="2.5" fill="#c10230" opacity="0.45"/><circle cx="534" cy="132" r="2.5" fill="#c10230" opacity="0.45"/>
  <text x="434" y="148" fill="#5b6b7a" font-size="9">high → low gradient; dialysate flows</text>
  <text x="434" y="159" fill="#5b6b7a" font-size="9">counter-current to blood</text>
  <text x="602" y="108" fill="#c10230" font-size="8" font-weight="bold" text-anchor="end">small molecules (urea)</text>
</g>

<!-- ADSORPTION (bottom-left) -->
<g>
  <rect x="24" y="252" width="196" height="86" rx="10" fill="#ffffff" stroke="#7a3b8f" stroke-width="1.5" filter="url(#ac1Sh)"/>
  <text x="38" y="272" fill="#7a3b8f" font-size="12.5" font-weight="bold">3 · Adsorption</text>
  <line x1="46" y1="296" x2="102" y2="296" stroke="#7a3b8f" stroke-width="2.5" marker-end="url(#ac1Arr)"/>
  <rect x="104" y="282" width="30" height="34" rx="5" fill="#e8eef4" stroke="#7a3b8f" stroke-width="1.5"/>
  <circle cx="112" cy="290" r="2.5" fill="#7a3b8f"/><circle cx="122" cy="298" r="3" fill="#7a3b8f"/><circle cx="111" cy="307" r="2" fill="#7a3b8f"/>
  <text x="142" y="292" fill="#5b6b7a" font-size="8.5">molecules stick to the</text>
  <text x="142" y="303" fill="#5b6b7a" font-size="8.5">membrane itself</text>
  <text x="38" y="334" fill="#5b6b7a" font-size="9">removes protein-bound uremic toxins</text>
</g>

<!-- UF / TMP note (bottom-right) -->
<g>
  <rect x="420" y="252" width="196" height="86" rx="10" fill="#ffffff" stroke="#d99a00" stroke-width="1.5" filter="url(#ac1Sh)"/>
  <text x="434" y="272" fill="#b8860b" font-size="12.5" font-weight="bold">Driving forces</text>
  <line x1="440" y1="296" x2="472" y2="288" stroke="#d99a00" stroke-width="2" marker-end="url(#ac1ArrGold)"/>
  <line x1="440" y1="304" x2="472" y2="304" stroke="#d99a00" stroke-width="2" marker-end="url(#ac1ArrGold)"/>
  <text x="482" y="300" fill="#5b6b7a" font-size="9.5">TMP = transmembrane</text>
  <text x="482" y="312" fill="#5b6b7a" font-size="9.5">pressure → plasma water</text>
  <text x="434" y="330" fill="#5b6b7a" font-size="9">clearance falls as the membrane clogs</text>
</g>

<!-- connectors -->
<line x1="220" y1="119" x2="262" y2="140" stroke="#0090b8" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="420" y1="119" x2="378" y2="140" stroke="#c10230" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="220" y1="295" x2="262" y2="266" stroke="#7a3b8f" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="420" y1="295" x2="378" y2="266" stroke="#d99a00" stroke-width="1.5" stroke-dasharray="4 3"/>

<text x="320" y="376" fill="#022851" font-size="11.5" text-anchor="middle" font-weight="bold">Three mechanisms, one filter — know which molecule each one clears</text>
<text x="320" y="392" fill="#5b6b7a" font-size="10" text-anchor="middle">convection = middle/large · diffusion = small · adsorption = protein-bound</text>
<text x="616" y="410" fill="#9aa7b4" font-size="9" text-anchor="end">CNN Exam Prep · Acute Therapies</text>
</svg>