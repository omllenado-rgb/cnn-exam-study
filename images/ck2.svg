<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="ck2Head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#022851"/><stop offset="1" stop-color="#003a6b"/></linearGradient>
  <marker id="ck2Arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#022851"/></marker>
  <filter id="ck2Sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#022851" flood-opacity="0.18"/></filter>
</defs>
<rect width="640" height="420" fill="#f7fafc"/>
<rect width="640" height="56" fill="url(#ck2Head)"/>
<rect y="56" width="640" height="4" fill="#ffbf00"/>
<text x="24" y="27" fill="#ffffff" font-size="17" font-weight="bold">ESA Therapy &amp; Iron Supplementation</text>
<text x="24" y="45" fill="#ffbf00" font-size="11" letter-spacing="0.5">Fix iron first · lowest ESA dose · avoid transfusions</text>

<!-- ============ left: ESA decision ladder ============ -->
<rect x="24" y="76" width="286" height="200" rx="12" fill="#ffffff" stroke="#e3e8ee" filter="url(#ck2Sh)"/>
<text x="40" y="98" fill="#022851" font-size="12" font-weight="bold">When to start &amp; how to dose an ESA</text>
<!-- step 1 -->
<rect x="40" y="110" width="254" height="44" rx="8" fill="#e2f2e6" stroke="#00573f" stroke-width="1.2"/>
<text x="52" y="128" fill="#00573f" font-size="9.5" font-weight="bold">1 · Treat iron deficiency &amp; inflammation first</text>
<text x="52" y="143" fill="#5b6b7a" font-size="8.5">correct reversible causes before any ESA</text>
<!-- step 2 -->
<rect x="52" y="162" width="254" height="44" rx="8" fill="#e2f2fb" stroke="#0090b8" stroke-width="1.2"/>
<text x="64" y="180" fill="#0090b8" font-size="9.5" font-weight="bold">2 · Start ESA when Hgb ≤ 10 g/dL</text>
<text x="64" y="195" fill="#5b6b7a" font-size="8.5">lowest dose needed to avoid transfusion</text>
<!-- step 3 -->
<rect x="52" y="214" width="254" height="44" rx="8" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.2"/>
<text x="64" y="232" fill="#8a6d1b" font-size="9.5" font-weight="bold">3 · Reduce or stop at Hgb 12 g/dL</text>
<text x="64" y="247" fill="#5b6b7a" font-size="8.5">dose adjustments no more often than q4wk</text>

<!-- ============ left lower: ESA risks ============ -->
<rect x="24" y="290" width="286" height="72" rx="12" fill="#ffffff" stroke="#c10230" stroke-width="1.5" filter="url(#ck2Sh)"/>
<text x="40" y="312" fill="#c10230" font-size="12" font-weight="bold">ESA risks — target Hgb ≥ 11 g/dL</text>
<text x="40" y="332" fill="#1c2b39" font-size="9.5">tumor progression · thrombosis · MI · stroke</text>
<text x="40" y="348" fill="#5b6b7a" font-size="8.5">higher Hgb targets raise cardiovascular events</text>

<!-- ============ right: iron panel ============ -->
<rect x="330" y="76" width="286" height="172" rx="12" fill="#ffffff" stroke="#e3e8ee" filter="url(#ck2Sh)"/>
<rect x="330" y="76" width="286" height="30" rx="12" fill="#022851"/>
<rect x="330" y="94" width="286" height="12" fill="#022851"/>
<text x="473" y="96" fill="#ffbf00" font-size="10.5" text-anchor="middle" font-weight="bold">WHEN IS IRON REPLACEMENT APPROPRIATE?</text>
<!-- criteria chips -->
<g font-size="9.5" fill="#1c2b39">
  <text x="346" y="130">· Ferritin &lt; 500 ng/mL</text>
  <text x="346" y="148">· Transferrin saturation ≤ 30%</text>
</g>
<!-- route cards -->
<g filter="url(#ck2Sh)">
  <rect x="346" y="160" width="120" height="66" rx="8" fill="#e2f2fb" stroke="#0090b8" stroke-width="1.2"/>
  <rect x="486" y="160" width="120" height="66" rx="8" fill="#e2f2e6" stroke="#00573f" stroke-width="1.2"/>
</g>
<text x="406" y="180" fill="#0090b8" font-size="10" text-anchor="middle" font-weight="bold">Dialysis patients</text>
<text x="406" y="196" fill="#1c2b39" font-size="9" text-anchor="middle">IV iron preferred</text>
<text x="406" y="212" fill="#5b6b7a" font-size="8.5" text-anchor="middle">more reliable absorption</text>
<text x="546" y="180" fill="#00573f" font-size="10" text-anchor="middle" font-weight="bold">Non-dialysis</text>
<text x="546" y="196" fill="#1c2b39" font-size="9" text-anchor="middle">oral iron trial first</text>
<text x="546" y="212" fill="#5b6b7a" font-size="8.5" text-anchor="middle">1–3 months, then reassess</text>

<!-- ============ right lower: PRCA warning ============ -->
<rect x="330" y="262" width="286" height="100" rx="12" fill="#ffffff" stroke="#c10230" stroke-width="1.5" filter="url(#ck2Sh)"/>
<rect x="330" y="262" width="286" height="26" rx="12" fill="#c10230"/>
<rect x="330" y="276" width="286" height="12" fill="#c10230"/>
<text x="473" y="280" fill="#ffffff" font-size="10" text-anchor="middle" font-weight="bold">RARE BUT SERIOUS — PURE RED CELL APLASIA</text>
<text x="346" y="308" fill="#1c2b39" font-size="9.5">Sudden loss of response + reticulocytopenia</text>
<text x="346" y="326" fill="#1c2b39" font-size="9.5">with no other cause → suspect anti-EPO antibodies</text>
<text x="346" y="346" fill="#c10230" font-size="9.5" font-weight="bold">Action: stop the ESA immediately — do not switch agents</text>

<!-- caption -->
<text x="320" y="388" fill="#022851" font-size="10.5" text-anchor="middle" font-weight="bold">Iron sufficiency is the prerequisite — check ferritin and TSAT before escalating ESA dose</text>
<text x="616" y="406" fill="#9aa7b4" font-size="9" text-anchor="end">CNN Exam Prep · CKD Complications</text>
</svg>