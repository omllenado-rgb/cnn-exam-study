<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="tx7Head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#022851"/><stop offset="1" stop-color="#003a6b"/></linearGradient>
  <marker id="tx7Arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#022851"/></marker>
  <filter id="tx7Sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#022851" flood-opacity="0.18"/></filter>
</defs>
<rect width="640" height="420" fill="#f7fafc"/>
<rect width="640" height="56" fill="url(#tx7Head)"/>
<rect y="56" width="640" height="4" fill="#ffbf00"/>
<text x="24" y="27" fill="#ffffff" font-size="17" font-weight="bold">Infectious Complications — CMV, BK, PJP</text>
<text x="24" y="45" fill="#ffbf00" font-size="11" letter-spacing="0.5">Immunosuppression opens the door — timing tells you which bug</text>

<!-- risk timeline -->
<line x1="60" y1="92" x2="600" y2="92" stroke="#5b6b7a" stroke-width="2" marker-end="url(#tx7Arr)"/>
<circle cx="150" cy="92" r="6" fill="#c10230"/>
<circle cx="380" cy="92" r="6" fill="#7a3b8f"/>
<circle cx="520" cy="92" r="6" fill="#0090b8"/>
<text x="150" y="80" fill="#c10230" font-size="9" text-anchor="middle" font-weight="bold">first month</text>
<text x="380" y="80" fill="#7a3b8f" font-size="9" text-anchor="middle" font-weight="bold">1 – 6 months</text>
<text x="520" y="80" fill="#0090b8" font-size="9" text-anchor="middle" font-weight="bold">late / reactivation</text>
<text x="612" y="106" fill="#5b6b7a" font-size="9" text-anchor="end">months post-transplant →</text>

<!-- ============ CMV ============ -->
<g filter="url(#tx7Sh)">
  <rect x="36" y="120" width="272" height="128" rx="12" fill="#ffffff" stroke="#c10230" stroke-width="1.5"/>
</g>
<rect x="36" y="120" width="272" height="26" rx="12" fill="#c10230"/><rect x="36" y="134" width="272" height="12" fill="#c10230"/>
<text x="172" y="138" fill="#ffffff" font-size="10.5" text-anchor="middle" font-weight="bold">CMV — most serious opportunistic</text>
<!-- virus icon -->
<circle cx="62" cy="182" r="12" fill="none" stroke="#c10230" stroke-width="2"/>
<line x1="62" y1="170" x2="62" y2="166" stroke="#c10230" stroke-width="2"/><line x1="62" y1="194" x2="62" y2="198" stroke="#c10230" stroke-width="2"/>
<line x1="52" y1="175" x2="49" y2="172" stroke="#c10230" stroke-width="2"/><line x1="72" y1="175" x2="75" y2="172" stroke="#c10230" stroke-width="2"/>
<line x1="52" y1="189" x2="49" y2="192" stroke="#c10230" stroke-width="2"/><line x1="72" y1="189" x2="75" y2="192" stroke="#c10230" stroke-width="2"/>
<g font-size="9" fill="#1c2b39">
  <text x="86" y="168" font-weight="bold">D⁺/R⁻ = highest danger</text>
  <text x="86" y="184">donor-positive, recipient-negative</text>
  <text x="86" y="200">→ primary infection, can become</text>
  <text x="86" y="214">tissue-invasive disease</text>
</g>
<text x="52" y="234" fill="#00573f" font-size="8.5" font-weight="bold">Rx: antivirals ± reduce immunosuppression</text>

<!-- ============ BK ============ -->
<g filter="url(#tx7Sh)">
  <rect x="324" y="120" width="280" height="128" rx="12" fill="#ffffff" stroke="#7a3b8f" stroke-width="1.5"/>
</g>
<rect x="324" y="120" width="280" height="26" rx="12" fill="#7a3b8f"/><rect x="324" y="134" width="280" height="12" fill="#7a3b8f"/>
<text x="464" y="138" fill="#ffffff" font-size="10.5" text-anchor="middle" font-weight="bold">BK VIRUS — the graft killer</text>
<!-- kidney + virus -->
<g transform="translate(-4,-18)">
  <path d="M356 210 q-10 -18 6 -26 q18 -10 30 2 q9 10 3 22 q-5 14 -20 14 q-15 0 -19 -18 z" fill="#e8d5f0" stroke="#7a3b8f" stroke-width="1.2"/>
  <circle cx="372" cy="206" r="3" fill="#7a3b8f"/><circle cx="368" cy="196" r="2.5" fill="#7a3b8f"/><circle cx="378" cy="216" r="2.5" fill="#7a3b8f"/>
</g>
<g font-size="9" fill="#1c2b39">
  <text x="404" y="168">reactivates under intense</text>
  <text x="404" y="182">immunosuppression →</text>
  <text x="404" y="196" fill="#c10230" font-weight="bold">BK nephropathy → graft loss</text>
</g>
<g font-size="8.5" fill="#5b6b7a">
  <text x="340" y="222">Dx: BKV DNA (plasma viral load)</text>
  <text x="340" y="236">Rx: leflunomide + reduce immunosuppression</text>
</g>

<!-- ============ PJP ============ -->
<g filter="url(#tx7Sh)">
  <rect x="36" y="262" width="272" height="110" rx="12" fill="#ffffff" stroke="#0090b8" stroke-width="1.5"/>
</g>
<rect x="36" y="262" width="272" height="26" rx="12" fill="#0090b8"/><rect x="36" y="276" width="272" height="12" fill="#0090b8"/>
<text x="172" y="280" fill="#ffffff" font-size="10.5" text-anchor="middle" font-weight="bold">PJP — Pneumocystis jirovecii</text>
<!-- lungs icon -->
<path d="M74 306 q-8 4 -8 16 q0 14 10 14 q8 0 8 -12 v-14 q0 -6 -10 -4 z" fill="#cfe0f2" stroke="#0090b8" stroke-width="1.2"/>
<path d="M104 306 q8 4 8 16 q0 14 -10 14 q-8 0 -8 -12 v-14 q0 -6 10 -4 z" fill="#cfe0f2" stroke="#0090b8" stroke-width="1.2"/>
<line x1="91" y1="300" x2="91" y2="316" stroke="#0090b8" stroke-width="2.5"/>
<g font-size="9" fill="#1c2b39">
  <text x="122" y="308">risk peaks 2–6 months post-tx</text>
</g>
<g font-size="8.5" fill="#5b6b7a">
  <text x="52" y="342">prophylaxis with Bactrim (TMP-SMX) is standard</text>
  <text x="52" y="356">HIV-positive recipients: lifelong PJP prophylaxis</text>
</g>

<!-- ============ HIV coordination note ============ -->
<g filter="url(#tx7Sh)">
  <rect x="324" y="262" width="280" height="110" rx="12" fill="#022851"/>
</g>
<text x="340" y="286" fill="#ffbf00" font-size="10.5" font-weight="bold">The core principle</text>
<g font-size="9" fill="#cfe0f2">
  <text x="340" y="308">infection risk tracks with immunosuppression</text>
  <text x="340" y="324">intensity — prophylaxis, monitoring (viral</text>
  <text x="340" y="340">loads), and trimming the regimen are the</text>
  <text x="340" y="356">counterweight. Coordinate ART carefully.</text>
</g>

<text x="616" y="410" fill="#9aa7b4" font-size="9" text-anchor="end">CNN Exam Prep · Transplant</text>
</svg>