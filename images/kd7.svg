<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="kd7Head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#022851"/><stop offset="1" stop-color="#003a6b"/></linearGradient>
  <linearGradient id="kd7Bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00573f"/><stop offset="0.35" stop-color="#0090b8"/><stop offset="0.65" stop-color="#d99a00"/><stop offset="1" stop-color="#c10230"/></linearGradient>
  <marker id="kd7Arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#022851"/></marker>
  <filter id="kd7Sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#022851" flood-opacity="0.18"/></filter>
</defs>
<rect width="640" height="420" fill="#f7fafc"/>
<rect width="640" height="56" fill="url(#kd7Head)"/>
<rect y="56" width="640" height="4" fill="#ffbf00"/>
<text x="24" y="27" fill="#ffffff" font-size="17" font-weight="bold">Chronic Kidney Disease: Staging</text>
<text x="24" y="45" fill="#ffbf00" font-size="11" letter-spacing="0.5">GFR defines the stage · abnormality &gt; 3 months</text>

<!-- ============ GFR staging bar ============ -->
<rect x="44" y="96" width="552" height="34" rx="17" fill="url(#kd7Bar)"/>
<g font-size="9" fill="#ffffff" font-weight="bold" text-anchor="middle">
  <text x="115" y="117">Stage 1 · GFR ≥ 90</text>
  <text x="250" y="117">Stage 2 · 60–89</text>
  <text x="382" y="117">Stage 3a · 45–59</text>
  <text x="500" y="117">Stage 3b · 30–44</text>
</g>
<g stroke="#f7fafc" stroke-width="2" opacity="0.9">
  <line x1="180" y1="98" x2="180" y2="128"/><line x1="320" y1="98" x2="320" y2="128"/><line x1="440" y1="98" x2="440" y2="128"/>
</g>
<text x="44" y="152" fill="#5b6b7a" font-size="8.5">GFR in mL/min/1.73 m²</text>
<!-- stage 4 & 5 blocks -->
<rect x="512" y="140" width="84" height="24" rx="6" fill="#d99a00"/>
<text x="554" y="156" fill="#ffffff" font-size="9" text-anchor="middle" font-weight="bold">4 · 15–29</text>
<rect x="512" y="170" width="84" height="24" rx="6" fill="#c10230"/>
<text x="554" y="186" fill="#ffffff" font-size="9" text-anchor="middle" font-weight="bold">5 · &lt;15 ESRD</text>

<!-- kidney icons shrinking -->
<g>
  <path d="M100 176 C86 170 70 180 70 198 C70 214 80 224 94 226 C104 224 110 218 108 212 C114 214 116 200 108 198 C112 188 110 178 100 176 Z" fill="#00573f" opacity="0.85"/>
  <path d="M240 180 C230 176 216 184 216 198 C216 210 230 220 242 220 C250 218 254 214 252 210 C258 216 258 204 252 202 C254 194 250 182 240 180 Z" fill="#0090b8" opacity="0.85"/>
  <path d="M380 184 C372 182 362 188 362 198 C362 208 372 214 382 214 C388 212 392 210 390 206 C394 208 394 200 390 198 C392 192 388 186 380 184 Z" fill="#d99a00" opacity="0.9"/>
  <path d="M500 188 C494 186 486 190 486 198 C486 206 492 210 500 210 C506 208 508 206 506 204 C510 204 510 198 506 198 C510 194 506 188 500 198 Z" fill="#d99a00" opacity="0.9"/>
</g>

<!-- stage captions -->
<text x="115" y="238" fill="#5b6b7a" font-size="9" text-anchor="middle">damage markers, normal GFR</text>
<text x="250" y="236" fill="#5b6b7a" font-size="9" text-anchor="middle">mild reduction</text>
<text x="430" y="236" fill="#5b6b7a" font-size="9" text-anchor="middle">moderate — symptoms begin</text>
<text x="548" y="236" fill="#5b6b7a" font-size="9" text-anchor="middle">prepare for RRT</text>

<!-- ============ epidemiology stat cards ============ -->
<g filter="url(#kd7Sh)">
  <rect x="44" y="262" width="176" height="96" rx="12" fill="#022851"/>
</g>
<text x="132" y="304" fill="#ffbf00" font-size="26" text-anchor="middle" font-weight="bold">14.9%</text>
<text x="132" y="326" fill="#cfe0f2" font-size="9.5" text-anchor="middle">of US adults have CKD</text>
<text x="132" y="342" fill="#cfe0f2" font-size="8.5" text-anchor="middle">diabetes + hypertension lead causes</text>
<g filter="url(#kd7Sh)">
  <rect x="232" y="262" width="176" height="96" rx="12" fill="#c10230"/>
</g>
<text x="320" y="304" fill="#ffffff" font-size="26" text-anchor="middle" font-weight="bold">9 in 10</text>
<text x="320" y="324" fill="#ffd9dd" font-size="9.5" text-anchor="middle">with stage 3 CKD don't know</text>
<text x="320" y="340" fill="#ffd9dd" font-size="9.5" text-anchor="middle">they have it</text>
<g filter="url(#kd7Sh)">
  <rect x="420" y="262" width="176" height="96" rx="12" fill="#00573f"/>
</g>
<text x="508" y="304" fill="#ffbf00" font-size="26" text-anchor="middle" font-weight="bold">4×</text>
<text x="508" y="324" fill="#cfe8d8" font-size="9.5" text-anchor="middle">higher risk in African Americans</text>
<text x="508" y="340" fill="#cfe8d8" font-size="8.5" text-anchor="middle">highest rates in the southern US</text>
<!-- CVD note -->
<text x="320" y="386" fill="#022851" font-size="10.5" text-anchor="middle" font-weight="bold">Cardiovascular disease — the leading cause of death in CKD</text>
<text x="616" y="414" fill="#9aa7b4" font-size="9" text-anchor="end">CNN Exam Prep · Kidney Disease</text>
</svg>