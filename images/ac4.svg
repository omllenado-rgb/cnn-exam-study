<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="ac4Head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#022851"/><stop offset="1" stop-color="#003a6b"/></linearGradient>
  <marker id="ac4ArrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c10230"/></marker>
  <marker id="ac4ArrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00573f"/></marker>
  <filter id="ac4Sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#022851" flood-opacity="0.18"/></filter>
</defs>
<rect width="640" height="420" fill="#f7fafc"/>
<rect width="640" height="56" fill="url(#ac4Head)"/>
<rect y="56" width="640" height="4" fill="#ffbf00"/>
<text x="24" y="27" fill="#ffffff" font-size="17" font-weight="bold">Electrolyte Management in CRRT</text>
<text x="24" y="45" fill="#ffbf00" font-size="11" letter-spacing="0.5">sodium pacing · potassium control · frequent labs</text>

<!-- ============ sodium pacing (navy panel) ============ -->
<g filter="url(#ac4Sh)">
  <rect x="40" y="76" width="576" height="106" rx="12" fill="#022851"/>
</g>
<rect x="40" y="76" width="576" height="28" rx="12" fill="#0c3a63"/>
<rect x="40" y="92" width="576" height="12" fill="#0c3a63"/>
<text x="328" y="95" fill="#ffbf00" font-size="11.5" text-anchor="middle" font-weight="bold">Sodium — go slow</text>
<text x="64" y="134" fill="#ffffff" font-size="21" font-weight="bold">&lt; 0.5</text>
<text x="64" y="150" fill="#cfe0f2" font-size="8.5">mEq/L/hr — max safe correction rate</text>
<text x="230" y="134" fill="#ffffff" font-size="21" font-weight="bold">&lt; 12</text>
<text x="230" y="150" fill="#cfe0f2" font-size="8.5">mEq/L — max change per 24 hours</text>
<rect x="420" y="112" width="180" height="50" rx="9" fill="#c10230"/>
<text x="510" y="132" fill="#ffffff" font-size="9.5" text-anchor="middle" font-weight="bold">too fast → cerebral edema</text>
<text x="510" y="146" fill="#ffd9de" font-size="7.5" text-anchor="middle">rapid osmotic shifts pull water into brain cells</text>
<text x="64" y="172" fill="#cfe0f2" font-size="8.5">continuous, low-intensity clearance makes CRRT gentler on sodium than standard HD</text>

<!-- ============ hyperkalemia card ============ -->
<rect x="40" y="200" width="280" height="126" rx="12" fill="#ffffff" stroke="#c10230" stroke-width="1.5" filter="url(#ac4Sh)"/>
<text x="56" y="222" fill="#c10230" font-size="12.5" font-weight="bold">Hyperkalemia — pull K⁺ down</text>
<text x="64" y="260" fill="#c10230" font-size="18" font-weight="bold">K⁺</text>
<line x1="94" y1="244" x2="94" y2="266" stroke="#c10230" stroke-width="3" marker-end="url(#ac4ArrRed)"/>
<text x="116" y="248" fill="#1c2b39" font-size="9.5">dialysate K⁺ 2 mEq/L (or K-free)</text>
<text x="116" y="262" fill="#5b6b7a" font-size="9">raise dialysate volume/flow to</text>
<text x="116" y="273" fill="#5b6b7a" font-size="9">sharpen the potassium gradient</text>
<rect x="56" y="292" width="248" height="20" rx="6" fill="#fbeaea"/>
<text x="180" y="305" fill="#c10230" font-size="8.5" text-anchor="middle" font-weight="bold">K-free bath for emergency hyperkalemia</text>

<!-- ============ hypokalemia card ============ -->
<rect x="338" y="200" width="278" height="126" rx="12" fill="#ffffff" stroke="#00573f" stroke-width="1.5" filter="url(#ac4Sh)"/>
<text x="354" y="222" fill="#00573f" font-size="12.5" font-weight="bold">Hypokalemia — put K⁺ back</text>
<text x="362" y="260" fill="#00573f" font-size="18" font-weight="bold">K⁺</text>
<line x1="392" y1="266" x2="392" y2="244" stroke="#00573f" stroke-width="3" marker-end="url(#ac4ArrGreen)"/>
<text x="414" y="248" fill="#1c2b39" font-size="9.5">bath K⁺ 3–4 mEq/L</text>
<text x="414" y="262" fill="#5b6b7a" font-size="9">continuous clearance can drift K⁺</text>
<text x="414" y="273" fill="#5b6b7a" font-size="9">down fast — replete and recheck</text>
<rect x="354" y="292" width="246" height="20" rx="6" fill="#e7f2ec"/>
<text x="477" y="305" fill="#00573f" font-size="8.5" text-anchor="middle" font-weight="bold">add K⁺ to the replacement fluid if needed</text>

<!-- ============ monitoring strip ============ -->
<rect x="40" y="342" width="576" height="40" rx="10" fill="#ffffff" stroke="#e3e8ee" filter="url(#ac4Sh)"/>
<circle cx="68" cy="362" r="11" fill="none" stroke="#022851" stroke-width="2"/>
<line x1="68" y1="362" x2="68" y2="355" stroke="#022851" stroke-width="2"/>
<line x1="68" y1="362" x2="73" y2="364" stroke="#022851" stroke-width="2"/>
<text x="88" y="359" fill="#022851" font-size="10" font-weight="bold">Recheck potassium every 2–4 hours on CRRT</text>
<text x="88" y="372" fill="#5b6b7a" font-size="8.5">trend the labs — don't react to a single value</text>
<text x="600" y="366" fill="#022851" font-size="9" text-anchor="end" font-weight="bold">gradual Na⁺ correction beats rapid HD-speed shifts</text>

<text x="616" y="410" fill="#9aa7b4" font-size="9" text-anchor="end">CNN Exam Prep · Acute Therapies</text>
</svg>