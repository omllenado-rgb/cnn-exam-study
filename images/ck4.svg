<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="ck4Head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#022851"/><stop offset="1" stop-color="#003a6b"/></linearGradient>
  <marker id="ck4Arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#022851"/></marker>
  <marker id="ck4ArrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c10230"/></marker>
  <filter id="ck4Sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#022851" flood-opacity="0.18"/></filter>
</defs>
<rect width="640" height="420" fill="#f7fafc"/>
<rect width="640" height="56" fill="url(#ck4Head)"/>
<rect y="56" width="640" height="4" fill="#ffbf00"/>
<text x="24" y="27" fill="#ffffff" font-size="17" font-weight="bold">High vs. Low Bone Turnover Disease</text>
<text x="24" y="45" fill="#ffbf00" font-size="11" letter-spacing="0.5">Two ends of the renal osteodystrophy spectrum</text>

<!-- ============ left: high turnover ============ -->
<rect x="24" y="76" width="286" height="222" rx="12" fill="#ffffff" stroke="#c10230" stroke-width="1.5" filter="url(#ck4Sh)"/>
<rect x="24" y="76" width="286" height="30" rx="12" fill="#c10230"/>
<rect x="24" y="94" width="286" height="12" fill="#c10230"/>
<text x="167" y="97" fill="#ffffff" font-size="11" text-anchor="middle" font-weight="bold">HIGH TURNOVER — Osteitis fibrosa</text>
<text x="40" y="126" fill="#c10230" font-size="9.5" font-weight="bold">Driven by secondary hyperparathyroidism</text>
<!-- mini cascade -->
<rect x="40" y="138" width="254" height="22" rx="6" fill="#fdf0f0"/>
<text x="167" y="153" fill="#8d1f33" font-size="9" text-anchor="middle" font-weight="bold">PO₄ ↑ → Ca ↓ → PTH ↑↑</text>
<!-- bone with busy cells -->
<g filter="url(#ck4Sh)">
  <rect x="40" y="170" width="120" height="76" rx="8" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.2"/>
</g>
<g fill="#c10230">
  <circle cx="56" cy="188" r="4"/><circle cx="70" cy="204" r="4"/><circle cx="62" cy="222" r="4"/>
</g>
<g fill="#00b2e3">
  <circle cx="112" cy="190" r="4"/><circle cx="124" cy="208" r="4"/><circle cx="114" cy="226" r="4"/>
</g>
<text x="100" y="262" fill="#5b6b7a" font-size="7.5" text-anchor="middle">osteoclasts (red) · osteoblasts (blue) — overactive</text>
<!-- effect text -->
<g font-size="9.5" fill="#1c2b39">
  <text x="176" y="188">Cells remodel bone too fast</text>
  <text x="176" y="204">Minerals leach from bone</text>
  <text x="188" y="218">into soft tissue</text>
  <text x="176" y="234">Peritrabecular fibrosis</text>
  <text x="176" y="250">Weak, painful bones</text>
</g>

<!-- ============ right: low turnover ============ -->
<rect x="330" y="76" width="286" height="222" rx="12" fill="#ffffff" stroke="#0090b8" stroke-width="1.5" filter="url(#ck4Sh)"/>
<rect x="330" y="76" width="286" height="30" rx="12" fill="#0c5a80"/>
<rect x="330" y="94" width="286" height="12" fill="#0c5a80"/>
<text x="473" y="97" fill="#ffffff" font-size="11" text-anchor="middle" font-weight="bold">LOW TURNOVER — Adynamic bone</text>
<text x="346" y="126" fill="#0c5a80" font-size="9.5" font-weight="bold">Oversuppressed PTH — mainly ESRD dialysis</text>
<!-- quiet bone -->
<g filter="url(#ck4Sh)">
  <rect x="346" y="170" width="120" height="76" rx="8" fill="#eef4f8" stroke="#8fa8ba" stroke-width="1.2"/>
</g>
<g fill="#8fa8ba">
  <circle cx="362" cy="188" r="3"/><circle cx="376" cy="204" r="3.5"/>
</g>
<text x="410" y="254" fill="#5b6b7a" font-size="8" text-anchor="middle">few osteoclasts · osteoblasts</text>
<g font-size="9.5" fill="#1c2b39">
  <text x="482" y="188">Very low bone formation</text>
  <text x="482" y="204">Bone can't buffer Ca / PO₄</text>
  <text x="482" y="220">→ hypercalcemia risk</text>
  <text x="482" y="238">Caused by: high-Ca binders,</text>
  <text x="482" y="252">vitamin D sterols, age, steroids</text>
</g>

<!-- ============ shared bottom ============ -->
<rect x="24" y="312" width="592" height="56" rx="12" fill="#022851" filter="url(#ck4Sh)"/>
<text x="320" y="334" fill="#ffbf00" font-size="10.5" text-anchor="middle" font-weight="bold">Both increase fracture risk</text>
<text x="320" y="354" fill="#cfe0f2" font-size="9.5" text-anchor="middle">high turnover: too much PTH · low turnover: too little — the balance is the PTH level</text>

<!-- caption -->
<text x="320" y="390" fill="#5b6b7a" font-size="9.5" text-anchor="middle">Also linked: uremic toxins · metabolic acidosis · malnutrition · low PTH receptor expression</text>
<text x="616" y="406" fill="#9aa7b4" font-size="9" text-anchor="end">CNN Exam Prep · CKD Complications</text>
</svg>