<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="nephHead" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#022851"/><stop offset="1" stop-color="#003a6b"/></linearGradient>
  <linearGradient id="nephTube" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9b8"/><stop offset="1" stop-color="#f5c96a"/></linearGradient>
  <linearGradient id="nephBowl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dfe8f0"/></linearGradient>
  <marker id="nephArr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#022851"/></marker>
  <marker id="nephArrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c10230"/></marker>
  <marker id="nephArrCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0090b8"/></marker>
  <filter id="nephSh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#022851" flood-opacity="0.18"/></filter>
</defs>
<rect width="640" height="420" fill="#f7fafc"/>
<rect width="640" height="56" fill="url(#nephHead)"/>
<rect y="56" width="640" height="4" fill="#ffbf00"/>
<text x="24" y="27" fill="#ffffff" font-size="17" font-weight="bold">The Nephron</text>
<text x="24" y="45" fill="#ffbf00" font-size="11" letter-spacing="0.5">The kidney's functional unit — follow the filtrate</text>

<!-- ============ nephron path ============ -->
<!-- afferent arteriole in -->
<path d="M60 150 H128" fill="none" stroke="#c10230" stroke-width="7" stroke-linecap="round"/>
<text x="52" y="136" fill="#c10230" font-size="9.5" font-weight="bold">afferent arteriole</text>
<text x="52" y="166" fill="#5b6b7a" font-size="8.5">blood in</text>

<!-- glomerulus + Bowman's capsule -->
<g filter="url(#nephSh)">
  <circle cx="168" cy="150" r="44" fill="url(#nephBowl)" stroke="#5b6b7a" stroke-width="2"/>
</g>
<g stroke="#c10230" stroke-width="4" fill="none" stroke-linecap="round">
  <path d="M150 138 q10 -12 22 -4 q12 -10 20 2 q12 2 8 14 q8 10 -2 18 q-4 12 -18 8 q-12 6 -18 -6 q-12 -4 -8 -16 q-6 -10 6 -16" transform="translate(-6,-4)"/>
</g>
<g fill="#e25563">
  <circle cx="160" cy="142" r="3"/><circle cx="176" cy="140" r="3"/><circle cx="186" cy="152" r="3"/>
  <circle cx="182" cy="166" r="3"/><circle cx="166" cy="170" r="3"/><circle cx="156" cy="158" r="3"/>
  <circle cx="170" cy="156" r="3"/>
</g>
<text x="168" y="216" fill="#022851" font-size="10.5" text-anchor="middle" font-weight="bold">Glomerulus</text>
<text x="168" y="230" fill="#5b6b7a" font-size="9" text-anchor="middle">filters plasma → filtrate</text>

<!-- efferent out -->
<path d="M210 122 H262" fill="none" stroke="#8d1f33" stroke-width="6" stroke-linecap="round"/>
<text x="222" y="108" fill="#8d1f33" font-size="9.5" font-weight="bold">efferent arteriole</text>
<text x="262" y="122" fill="#5b6b7a" font-size="8.5">→ peritubular caps.</text>

<!-- PCT (coiled) -->
<path d="M208 168 q20 16 6 30 q-14 14 4 26 q16 10 2 24" fill="none" stroke="url(#nephTube)" stroke-width="9" stroke-linecap="round"/>
<text x="238" y="250" fill="#8a6d1b" font-size="9.5" font-weight="bold">PCT</text>
<text x="238" y="262" fill="#5b6b7a" font-size="8">reabsorbs ~65%</text>

<!-- descending / ascending loop -->
<path d="M220 252 q-4 22 -22 28 q-18 6 -20 26 q-2 18 14 22 q16 4 24 -12" fill="none" stroke="url(#nephTube)" stroke-width="9" stroke-linecap="round"/>
<line x1="186" y1="290" x2="150" y2="290" stroke="#0090b8" stroke-width="1.5"/>
<text x="96" y="286" fill="#0090b8" font-size="9" font-weight="bold">descending limb</text>
<text x="96" y="298" fill="#0090b8" font-size="8">water leaves</text>
<line x1="184" y1="330" x2="130" y2="352" stroke="#00573f" stroke-width="1.5"/>
<text x="62" y="360" fill="#00573f" font-size="9" font-weight="bold">ascending limb</text>
<text x="62" y="372" fill="#00573f" font-size="8">salts leave (NKCC2)</text>

<!-- DCT -->
<path d="M182 338 q26 6 34 24 q6 14 24 16" fill="none" stroke="url(#nephTube)" stroke-width="9" stroke-linecap="round"/>
<path d="M240 378 q18 2 22 18" fill="none" stroke="url(#nephTube)" stroke-width="9" stroke-linecap="round"/>
<text x="254" y="366" fill="#8a6d1b" font-size="9.5" font-weight="bold">DCT · collecting duct</text>
<text x="254" y="378" fill="#5b6b7a" font-size="8">fine-tune Na⁺ · K⁺ · water</text>

<!-- urine out -->
<line x1="268" y1="398" x2="298" y2="398" stroke="#f5c96a" stroke-width="7"/>
<text x="304" y="401" fill="#8a6d1b" font-size="9.5" font-weight="bold">urine →</text>

<!-- ============ right panel: the big numbers ============ -->
<g filter="url(#nephSh)">
  <rect x="352" y="86" width="264" height="150" rx="12" fill="#ffffff" stroke="#e3e8ee"/>
</g>
<text x="368" y="108" fill="#022851" font-size="12" font-weight="bold">One nephron's day at work</text>
<g font-size="9.5" fill="#1c2b39">
  <text x="368" y="132">· ~180 L filtered into Bowman's capsule</text>
  <text x="368" y="150">· &gt; 99% reabsorbed along the tubules</text>
  <text x="368" y="168">· ~1.5 L leaves as urine</text>
  <text x="368" y="190">· glucose &amp; amino acids fully reclaimed</text>
  <text x="368" y="208">· creatinine &amp; urea are left behind to clear</text>
  <text x="368" y="226">· each nephron works independently</text>
</g>

<!-- GFR chip -->
<g filter="url(#nephSh)">
  <rect x="352" y="250" width="264" height="64" rx="12" fill="#022851"/>
</g>
<text x="368" y="272" fill="#ffbf00" font-size="10.5" font-weight="bold">Why dialysis nurses care</text>
<text x="368" y="290" fill="#cfe0f2" font-size="9">every clearance concept (Kt/V, URR, peritoneal</text>
<text x="368" y="304" fill="#cfe0f2" font-size="9">transport) mirrors what the nephron normally does</text>

<!-- ADH/aldosterone chip -->
<g filter="url(#nephSh)">
  <rect x="352" y="326" width="264" height="58" rx="12" fill="#e2f2fb" stroke="#0090b8" stroke-width="1.2"/>
</g>
<text x="368" y="348" fill="#00573f" font-size="10" font-weight="bold">Hormones acting here</text>
<text x="368" y="364" fill="#1c2b39" font-size="9">ADH (water) · aldosterone (Na⁺) · PTH (Ca²⁺)</text>
<text x="368" y="377" fill="#1c2b39" font-size="9">erythropoietin is made next door in the cortex</text>
<text x="616" y="412" fill="#9aa7b4" font-size="9" text-anchor="end">CNN Exam Prep · Kidney Disease</text>
</svg>