<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="hd3Head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#022851"/><stop offset="1" stop-color="#003a6b"/></linearGradient>
  <linearGradient id="hd3Tank" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9eefc"/><stop offset="1" stop-color="#7ed4f2"/></linearGradient>
  <marker id="hd3Arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#022851"/></marker>
  <filter id="hd3Sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#022851" flood-opacity="0.18"/></filter>
</defs>
<rect width="640" height="420" fill="#f7fafc"/>
<rect width="640" height="56" fill="url(#hd3Head)"/>
<rect y="56" width="640" height="4" fill="#ffbf00"/>
<text x="24" y="27" fill="#ffffff" font-size="17" font-weight="bold">Dialysate Composition &amp; Monitoring</text>
<text x="24" y="45" fill="#ffbf00" font-size="11" letter-spacing="0.5">pH · temperature · conductivity · electrolytes</text>

<!-- ============ proportioning system (left) ============ -->
<!-- acid jug -->
<g filter="url(#hd3Sh)">
  <path d="M52 150 h64 l8 60 v62 a6 6 0 0 1 -6 6 h-68 a6 6 0 0 1 -6 -6 v-62 z" fill="#ffffff" stroke="#c10230" stroke-width="2"/>
</g>
<rect x="62" y="228" width="46" height="40" rx="4" fill="#c10230" opacity="0.55"/>
<rect x="70" y="140" width="28" height="12" rx="2" fill="#5b6b7a"/>
<text x="80" y="300" fill="#c10230" font-size="10.5" text-anchor="middle" font-weight="bold">Acid concentrate</text>
<text x="80" y="314" fill="#5b6b7a" font-size="9" text-anchor="middle">Na · K · Ca · Mg</text>
<text x="80" y="326" fill="#5b6b7a" font-size="9" text-anchor="middle">Cl · dextrose</text>
<!-- bicarb jug -->
<g filter="url(#hd3Sh)">
  <path d="M148 150 h64 l8 60 v62 a6 6 0 0 1 -6 6 h-68 a6 6 0 0 1 -6 -6 v-62 z" fill="#ffffff" stroke="#00573f" stroke-width="2"/>
</g>
<rect x="158" y="228" width="46" height="40" rx="4" fill="#00573f" opacity="0.55"/>
<rect x="166" y="140" width="28" height="12" rx="2" fill="#5b6b7a"/>
<text x="182" y="300" fill="#00573f" font-size="10.5" text-anchor="middle" font-weight="bold">Bicarbonate</text>
<text x="182" y="314" fill="#5b6b7a" font-size="9" text-anchor="middle">HCO₃⁻ 20–40 mEq/L</text>
<text x="182" y="326" fill="#5b6b7a" font-size="9" text-anchor="middle">primary buffer (US)</text>
<!-- mix lines into machine -->
<line x1="104" y1="196" x2="262" y2="176" stroke="#c10230" stroke-width="3"/>
<line x1="200" y1="196" x2="262" y2="200" stroke="#00573f" stroke-width="3"/>
<!-- machine -->
<g filter="url(#hd3Sh)">
  <rect x="262" y="150" width="96" height="110" rx="12" fill="#022851"/>
</g>
<rect x="272" y="162" width="76" height="34" rx="5" fill="#0c3a63"/>
<text x="310" y="183" fill="#ffbf00" font-size="9.5" text-anchor="middle" font-weight="bold">PROPORTIONING</text>
<circle cx="290" cy="220" r="12" fill="none" stroke="#ffbf00" stroke-width="2"/>
<circle cx="332" cy="220" r="12" fill="none" stroke="#ffbf00" stroke-width="2"/>
<text x="310" y="248" fill="#cfe0f2" font-size="8.5" text-anchor="middle">mixes to final bath</text>
<!-- dialysate out -->
<line x1="358" y1="205" x2="400" y2="205" stroke="#0090b8" stroke-width="3" marker-end="url(#hd3Arr)"/>
<g filter="url(#hd3Sh)">
  <rect x="402" y="172" width="70" height="66" rx="10" fill="url(#hd3Tank)" stroke="#0090b8" stroke-width="2"/>
</g>
<text x="437" y="198" fill="#022851" font-size="10" text-anchor="middle" font-weight="bold">DIALYSATE</text>
<text x="437" y="212" fill="#022851" font-size="9" text-anchor="middle">12–16 mS/cm</text>
<text x="437" y="226" fill="#022851" font-size="9" text-anchor="middle">35–42 °C</text>
<!-- delivery systems note -->
<g filter="url(#hd3Sh)">
  <rect x="40" y="336" width="432" height="40" rx="8" fill="#ffffff" stroke="#e3e8ee"/>
</g>
<circle cx="58" cy="356" r="8" fill="#022851"/><text x="58" y="359" fill="#ffbf00" font-size="9" text-anchor="middle" font-weight="bold">1</text>
<text x="72" y="353" fill="#1c2b39" font-size="9.5" font-weight="bold">Individual proportioning</text>
<text x="72" y="366" fill="#5b6b7a" font-size="8.5">one machine mixes its own bath</text>
<circle cx="242" cy="356" r="8" fill="#022851"/><text x="242" y="359" fill="#ffbf00" font-size="9" text-anchor="middle" font-weight="bold">2</text>
<text x="256" y="353" fill="#1c2b39" font-size="9.5" font-weight="bold">Central proportioning</text>
<text x="256" y="366" fill="#5b6b7a" font-size="8.5">one tank feeds many machines</text>

<!-- ============ monitoring panel (right) ============ -->
<rect x="490" y="80" width="126" height="296" rx="12" fill="#ffffff" stroke="#e3e8ee" filter="url(#hd3Sh)"/>
<rect x="490" y="80" width="126" height="30" rx="12" fill="#022851"/>
<rect x="490" y="98" width="126" height="12" fill="#022851"/>
<text x="553" y="100" fill="#ffbf00" font-size="10.5" text-anchor="middle" font-weight="bold">MONITOR RANGES</text>
<!-- gauges -->
<g>
  <path d="M517 130 a22 22 0 1 1 44 0" fill="none" stroke="#e3e8ee" stroke-width="8" stroke-linecap="round"/>
  <path d="M517 130 a22 22 0 0 1 18 -20" fill="none" stroke="#00b2e3" stroke-width="8" stroke-linecap="round"/>
  <text x="553" y="140" fill="#1c2b39" font-size="10" text-anchor="middle" font-weight="bold">pH 6.9–7.6</text>
</g>
<g>
  <path d="M517 190 a22 22 0 1 1 44 0" fill="none" stroke="#e3e8ee" stroke-width="8" stroke-linecap="round"/>
  <path d="M517 190 a22 22 0 0 1 31 -31" fill="none" stroke="#c10230" stroke-width="8" stroke-linecap="round"/>
  <text x="553" y="200" fill="#1c2b39" font-size="10" text-anchor="middle" font-weight="bold">35–42 °C</text>
</g>
<g>
  <path d="M517 250 a22 22 0 1 1 44 0" fill="none" stroke="#e3e8ee" stroke-width="8" stroke-linecap="round"/>
  <path d="M517 250 a22 22 0 0 1 40 -40" fill="none" stroke="#00573f" stroke-width="8" stroke-linecap="round"/>
  <text x="553" y="260" fill="#1c2b39" font-size="10" text-anchor="middle" font-weight="bold">12–16 mS/cm</text>
  <text x="553" y="272" fill="#5b6b7a" font-size="8" text-anchor="middle">conductivity</text>
</g>
<!-- electrolytes -->
<text x="500" y="296" fill="#022851" font-size="9" font-weight="bold">Na 135–145</text>
<text x="584" y="296" fill="#5b6b7a" font-size="8">mEq/L</text>
<text x="500" y="314" fill="#022851" font-size="9" font-weight="bold">K 2–3</text>
<text x="612" y="314" fill="#c10230" font-size="7" text-anchor="end">0–1 → cardiac monitor</text>
<text x="500" y="332" fill="#022851" font-size="9" font-weight="bold">Ca 2–3</text>
<text x="500" y="350" fill="#022851" font-size="9" font-weight="bold">Mg 0.5–1.0</text>
<text x="500" y="368" fill="#022851" font-size="9" font-weight="bold">HCO₃ 20–40</text>

<!-- safety callout -->
<text x="320" y="400" fill="#c10230" font-size="10" text-anchor="middle" font-weight="bold">High Na → thirst &amp; interdialytic weight gain · very low K requires continuous cardiac monitoring</text>
<text x="616" y="414" fill="#9aa7b4" font-size="9" text-anchor="end">CNN Exam Prep · Hemodialysis</text>
</svg>