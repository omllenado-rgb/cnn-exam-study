<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="ac7Head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#022851"/><stop offset="1" stop-color="#003a6b"/></linearGradient>
  <filter id="ac7Sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#022851" flood-opacity="0.18"/></filter>
</defs>
<rect width="640" height="420" fill="#f7fafc"/>
<rect width="640" height="56" fill="url(#ac7Head)"/>
<rect y="56" width="640" height="4" fill="#ffbf00"/>
<text x="24" y="27" fill="#ffffff" font-size="17" font-weight="bold">Vascular Access for CRRT</text>
<text x="24" y="45" fill="#ffbf00" font-size="11" letter-spacing="0.5">big enough for continuous flow — placed with the future in mind</text>

<!-- ============ torso schematic (left) ============ -->
<rect x="40" y="76" width="300" height="224" rx="12" fill="#ffffff" stroke="#e3e8ee" filter="url(#ac7Sh)"/>
<text x="56" y="98" fill="#022851" font-size="12" font-weight="bold">Where the catheter goes</text>
<!-- head + neck -->
<circle cx="206" cy="136" r="26" fill="#f0d9c8" stroke="#c8a284" stroke-width="1.5"/>
<rect x="194" y="158" width="24" height="14" fill="#f0d9c8" stroke="#c8a284" stroke-width="1"/>
<!-- torso -->
<path d="M146 262 Q158 178 206 172 Q254 178 266 262 Z" fill="#dce8f2" stroke="#9db4c8" stroke-width="1.5"/>
<!-- clavicle hints -->
<path d="M172 192 Q190 186 204 190" fill="none" stroke="#9db4c8" stroke-width="2"/>
<path d="M208 186 Q226 186 240 192" fill="none" stroke="#9db4c8" stroke-width="2"/>
<!-- catheter: right IJ (viewer left) down to cavoatrial junction -->
<circle cx="186" cy="168" r="4" fill="#c10230"/>
<path d="M186 172 C186 200 202 214 208 248" fill="none" stroke="#c10230" stroke-width="4.5" stroke-linecap="round"/>
<circle cx="208" cy="250" r="6" fill="none" stroke="#ffbf00" stroke-width="2.5"/>
<!-- labels -->
<text x="52" y="150" fill="#00573f" font-size="8.5" font-weight="bold">right IJ vein —</text>
<text x="52" y="161" fill="#00573f" font-size="8.5" font-weight="bold">first choice</text>
<line x1="120" y1="156" x2="180" y2="166" stroke="#00573f" stroke-width="1.2" stroke-dasharray="3 2"/>
<text x="232" y="252" fill="#022851" font-size="8.5" font-weight="bold">tip at the</text>
<text x="232" y="263" fill="#022851" font-size="8.5" font-weight="bold">SVC–RA junction</text>
<line x1="212" y1="246" x2="228" y2="250" stroke="#022851" stroke-width="1.2" stroke-dasharray="3 2"/>
<text x="56" y="288" fill="#5b6b7a" font-size="8.5">confirm tip position on imaging before starting</text>

<!-- ============ duration card (right top) ============ -->
<rect x="356" y="76" width="260" height="102" rx="12" fill="#ffffff" stroke="#022851" stroke-width="1.5" filter="url(#ac7Sh)"/>
<text x="372" y="98" fill="#022851" font-size="12" font-weight="bold">How long will it stay in?</text>
<text x="372" y="122" fill="#c10230" font-size="15" font-weight="bold">Non-tunneled ≤ 3 weeks</text>
<text x="372" y="142" fill="#5b6b7a" font-size="9">beyond that, switch to a cuffed,</text>
<text x="372" y="153" fill="#5b6b7a" font-size="9">tunneled catheter — lower infection,</text>
<text x="372" y="164" fill="#5b6b7a" font-size="9">more secure for longer CRRT runs</text>

<!-- ============ AVF card (right bottom) ============ -->
<rect x="356" y="192" width="260" height="108" rx="12" fill="#ffffff" stroke="#c10230" stroke-width="1.5" filter="url(#ac7Sh)"/>
<text x="372" y="214" fill="#c10230" font-size="12.5" font-weight="bold">AVF / grafts: wrong tool for CRRT</text>
<g font-size="9" fill="#1c2b39">
  <text x="372" y="234">· needle access can't sustain 24/7 flow</text>
  <text x="372" y="248">· awkward positioning for days at a time</text>
</g>
<rect x="372" y="256" width="228" height="32" rx="6" fill="#e7f2ec"/>
<text x="486" y="269" fill="#00573f" font-size="8.5" text-anchor="middle" font-weight="bold">Exception: SLED (≤ 12 h) can use an AVF</text>
<text x="486" y="280" fill="#00573f" font-size="8" text-anchor="middle">when no catheter is available and it's truly necessary</text>

<!-- ============ site compare chips (bottom) ============ -->
<rect x="40" y="314" width="184" height="58" rx="10" fill="#ffffff" stroke="#00573f" stroke-width="1.5" filter="url(#ac7Sh)"/>
<text x="132" y="336" fill="#00573f" font-size="10" text-anchor="middle" font-weight="bold">✓ Right IJ — first choice</text>
<text x="132" y="350" fill="#5b6b7a" font-size="8" text-anchor="middle">straight path to the cavoatrial</text>
<text x="132" y="361" fill="#5b6b7a" font-size="8">junction — avoids kinking</text>

<rect x="232" y="314" width="184" height="58" rx="10" fill="#ffffff" stroke="#d99a00" stroke-width="1.5" filter="url(#ac7Sh)"/>
<text x="324" y="336" fill="#8a6a00" font-size="10" text-anchor="middle" font-weight="bold">Subclavian — think twice</text>
<text x="324" y="350" fill="#5b6b7a" font-size="8" text-anchor="middle">fewer infections, but stenosis risk</text>
<text x="324" y="362" fill="#5b6b7a" font-size="8">stenosis threatens an AVF</text>

<rect x="424" y="314" width="192" height="58" rx="10" fill="#ffffff" stroke="#c10230" stroke-width="1.5" filter="url(#ac7Sh)"/>
<text x="520" y="336" fill="#c10230" font-size="10" text-anchor="middle" font-weight="bold">Femoral — short term only</text>
<text x="520" y="350" fill="#5b6b7a" font-size="8" text-anchor="middle">remove within 1 week,</text>
<text x="520" y="362" fill="#5b6b7a" font-size="8" text-anchor="middle">sooner in obese or bedbound patients</text>

<text x="616" y="410" fill="#9aa7b4" font-size="9" text-anchor="end">CNN Exam Prep · Acute Therapies</text>
</svg>