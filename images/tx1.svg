<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="tx1Head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#022851"/><stop offset="1" stop-color="#003a6b"/></linearGradient>
  <linearGradient id="tx1Kidney" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a34d5e"/><stop offset="1" stop-color="#7a3344"/></linearGradient>
  <marker id="tx1Arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#022851"/></marker>
  <filter id="tx1Sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#022851" flood-opacity="0.18"/></filter>
</defs>
<rect width="640" height="420" fill="#f7fafc"/>
<rect width="640" height="56" fill="url(#tx1Head)"/>
<rect y="56" width="640" height="4" fill="#ffbf00"/>
<text x="24" y="27" fill="#ffffff" font-size="17" font-weight="bold">Donor Types &amp; Evaluation</text>
<text x="24" y="45" fill="#ffbf00" font-size="11" letter-spacing="0.5">Living · deceased · KDPI donor quality</text>

<!-- ============ donor tree (left) ============ -->
<g filter="url(#tx1Sh)">
  <rect x="36" y="74" width="292" height="150" rx="12" fill="#ffffff" stroke="#00573f" stroke-width="1.5"/>
</g>
<!-- kidney icon -->
<path d="M60 132 q-12 -20 8 -30 q22 -12 36 4 q10 12 4 26 q-6 16 -24 16 q-20 0 -24 -22 z" fill="url(#tx1Kidney)" stroke="#5b2233" stroke-width="1.2"/>
<circle cx="86" cy="140" r="3" fill="#e8c9d2"/>
<text x="44" y="166" fill="#7a3344" font-size="8.5" font-weight="bold">donor kidney</text>
<!-- root -->
<rect x="108" y="120" width="80" height="30" rx="8" fill="#022851"/>
<text x="148" y="139" fill="#ffbf00" font-size="10.5" text-anchor="middle" font-weight="bold">DONOR</text>
<!-- branches -->
<line x1="148" y1="150" x2="148" y2="164" stroke="#022851" stroke-width="1.5"/>
<line x1="110" y1="164" x2="262" y2="164" stroke="#022851" stroke-width="1.5"/>
<line x1="110" y1="164" x2="110" y2="176" stroke="#022851" stroke-width="1.5"/>
<line x1="262" y1="164" x2="262" y2="176" stroke="#022851" stroke-width="1.5"/>
<rect x="76" y="176" width="70" height="20" rx="6" fill="#e2f2e6" stroke="#00573f" stroke-width="1"/>
<text x="111" y="190" fill="#00573f" font-size="9" text-anchor="middle" font-weight="bold">Living</text>
<rect x="226" y="176" width="72" height="20" rx="6" fill="#e2f2fb" stroke="#0090b8" stroke-width="1"/>
<text x="262" y="190" fill="#0090b8" font-size="9" text-anchor="middle" font-weight="bold">Deceased</text>
<text x="76" y="212" fill="#5b6b7a" font-size="8.5">relative · unrelated ·</text>
<text x="76" y="222" fill="#5b6b7a" font-size="8.5">anonymous (nondirected)</text>
<text x="226" y="212" fill="#5b6b7a" font-size="8.5">brain-dead (heart-beating)</text>
<text x="226" y="222" fill="#5b6b7a" font-size="8.5">· DCD (circulatory death)</text>

<!-- living donor requirements -->
<g filter="url(#tx1Sh)">
  <rect x="36" y="238" width="292" height="86" rx="12" fill="#ffffff" stroke="#00573f" stroke-width="1.5"/>
</g>
<rect x="36" y="238" width="292" height="24" rx="12" fill="#00573f"/><rect x="36" y="252" width="292" height="10" fill="#00573f"/>
<text x="182" y="255" fill="#ffffff" font-size="10" text-anchor="middle" font-weight="bold">LIVING DONORS MUST BE</text>
<text x="52" y="280" fill="#1c2b39" font-size="9.5">✓ competent (able to consent)</text>
<text x="52" y="296" fill="#1c2b39" font-size="9.5">✓ willing — voluntary, no coercion</text>
<text x="52" y="312" fill="#1c2b39" font-size="9.5">✓ medically &amp; psychologically suitable</text>

<!-- KDPI panel (right) -->
<g filter="url(#tx1Sh)">
  <rect x="348" y="74" width="268" height="250" rx="12" fill="#022851"/>
</g>
<rect x="348" y="74" width="268" height="30" rx="12" fill="#0c3a63"/><rect x="348" y="92" width="268" height="12" fill="#0c3a63"/>
<text x="482" y="94" fill="#ffbf00" font-size="11.5" text-anchor="middle" font-weight="bold">KDPI — Kidney Donor Profile Index</text>
<!-- gauge -->
<rect x="368" y="120" width="228" height="16" rx="8" fill="#0c3a63"/>
<rect x="368" y="120" width="80" height="16" rx="8" fill="#2e7d32"/>
<rect x="448" y="120" width="70" height="16" fill="#ffbf00"/>
<rect x="518" y="120" width="78" height="16" rx="8" fill="#c10230"/>
<text x="408" y="132" fill="#ffffff" font-size="7.5" text-anchor="middle">lower risk</text>
<text x="556" y="132" fill="#ffffff" font-size="7.5" text-anchor="middle">higher risk</text>
<text x="368" y="152" fill="#cfe0f2" font-size="8.5">scores deceased-donor kidney quality on:</text>
<g font-size="9" fill="#ffffff">
  <text x="380" y="172">· donor age</text>
  <text x="380" y="186">· terminal creatinine</text>
  <text x="380" y="200">· medical history</text>
  <text x="380" y="214">· cause of death &amp; other factors</text>
</g>
<g filter="url(#tx1Sh)">
  <rect x="368" y="220" width="228" height="88" rx="10" fill="#ffffff"/>
</g>
<text x="382" y="242" fill="#c10230" font-size="10.5" font-weight="bold">Higher KDPI = lower quality</text>
<g font-size="9" fill="#5b6b7a">
  <text x="382" y="260">→ higher risk of graft failure</text>
  <text x="382" y="276">→ may pair with recipients who accept</text>
  <text x="382" y="290">more risk (longer waitlist time)</text>
</g>
<text x="382" y="303" fill="#022851" font-size="9" font-weight="bold">used for informed consent &amp; matching</text>

<!-- footer takeaway -->
<text x="320" y="366" fill="#022851" font-size="11" text-anchor="middle" font-weight="bold">Living donor organs generally outlast deceased-donor organs</text>
<text x="320" y="382" fill="#5b6b7a" font-size="10" text-anchor="middle">KDPI turns donor characteristics into a 0–100% risk percentile for matching decisions</text>
<text x="616" y="410" fill="#9aa7b4" font-size="9" text-anchor="end">CNN Exam Prep · Transplant</text>
</svg>