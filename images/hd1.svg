<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="hd1Head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#022851"/><stop offset="1" stop-color="#003a6b"/></linearGradient>
  <linearGradient id="hd1Blood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e25563"/><stop offset="1" stop-color="#c10230"/></linearGradient>
  <linearGradient id="hd1Dial" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9eefc"/><stop offset="1" stop-color="#8fdcf5"/></linearGradient>
  <linearGradient id="hd1Membrane" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b8c6d4"/><stop offset="0.5" stop-color="#e8eef4"/><stop offset="1" stop-color="#b8c6d4"/></linearGradient>
  <marker id="hd1Arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#022851"/></marker>
  <marker id="hd1ArrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c10230"/></marker>
  <marker id="hd1ArrCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0090b8"/></marker>
  <marker id="hd1ArrGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d99a00"/></marker>
  <marker id="hd1ArrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00573f"/></marker>
  <filter id="hd1Sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#022851" flood-opacity="0.18"/></filter>
</defs>
<rect width="640" height="420" fill="#f7fafc"/>
<rect width="640" height="56" fill="url(#hd1Head)"/>
<rect y="56" width="640" height="4" fill="#ffbf00"/>
<text x="24" y="27" fill="#ffffff" font-size="17" font-weight="bold">Principles of Hemodialysis</text>
<text x="24" y="45" fill="#ffbf00" font-size="11" letter-spacing="0.5">Diffusion · convection · osmosis · ultrafiltration</text>

<!-- center dialyzer cross-section -->
<g filter="url(#hd1Sh)">
  <rect x="256" y="96" width="128" height="228" rx="14" fill="#ffffff" stroke="#5b6b7a" stroke-width="2"/>
</g>
<rect x="264" y="106" width="48" height="208" rx="8" fill="url(#hd1Blood)"/>
<rect x="328" y="106" width="48" height="208" rx="8" fill="url(#hd1Dial)"/>
<rect x="314" y="104" width="12" height="212" fill="url(#hd1Membrane)" stroke="#022851" stroke-width="1"/>
<text x="288" y="330" fill="#c10230" font-size="10" text-anchor="middle" font-weight="bold">BLOOD</text>
<text x="352" y="330" fill="#0090b8" font-size="10" text-anchor="middle" font-weight="bold">DIALYSATE</text>
<text x="320" y="345" fill="#5b6b7a" font-size="9" text-anchor="middle">semipermeable membrane</text>

<!-- pores in membrane -->
<g fill="#022851" opacity="0.55">
  <circle cx="320" cy="130" r="1.8"/><circle cx="320" cy="152" r="1.8"/><circle cx="320" cy="176" r="1.8"/>
  <circle cx="320" cy="200" r="1.8"/><circle cx="320" cy="226" r="1.8"/><circle cx="320" cy="250" r="1.8"/>
  <circle cx="320" cy="274" r="1.8"/><circle cx="320" cy="296" r="1.8"/>
</g>

<!-- DIFFUSION (top-left) -->
<g>
  <rect x="24" y="76" width="196" height="86" rx="10" fill="#ffffff" stroke="#c10230" stroke-width="1.5" filter="url(#hd1Sh)"/>
  <text x="38" y="96" fill="#c10230" font-size="12.5" font-weight="bold">1 · Diffusion</text>
  <circle cx="52" cy="122" r="5" fill="#c10230"/><circle cx="66" cy="132" r="5" fill="#c10230"/><circle cx="58" cy="145" r="5" fill="#c10230"/>
  <line x1="76" y1="128" x2="150" y2="128" stroke="#c10230" stroke-width="2" marker-end="url(#hd1ArrRed)"/>
  <circle cx="168" cy="122" r="3.5" fill="#c10230" opacity="0.45"/><circle cx="180" cy="133" r="3.5" fill="#c10230" opacity="0.45"/><circle cx="172" cy="145" r="3.5" fill="#c10230" opacity="0.45"/>
  <text x="38" y="158" fill="#5b6b7a" font-size="9.5">high → low concentration; small solutes</text>
</g>

<!-- CONVECTION (top-right) -->
<g>
  <rect x="420" y="76" width="196" height="86" rx="10" fill="#ffffff" stroke="#0090b8" stroke-width="1.5" filter="url(#hd1Sh)"/>
  <text x="434" y="96" fill="#0090b8" font-size="12.5" font-weight="bold">2 · Convection</text>
  <path d="M434 128 q10 -14 22 0 t22 0 t22 0 t22 0 t22 0" fill="none" stroke="#00b2e3" stroke-width="3" marker-end="url(#hd1ArrCyan)"/>
  <circle cx="500" cy="112" r="6" fill="#7a3b8f"/>
  <text x="434" y="158" fill="#5b6b7a" font-size="9.5">solvent drag carries larger molecules</text>
</g>

<!-- OSMOSIS (bottom-left) -->
<g>
  <rect x="24" y="252" width="196" height="86" rx="10" fill="#ffffff" stroke="#00573f" stroke-width="1.5" filter="url(#hd1Sh)"/>
  <text x="38" y="272" fill="#00573f" font-size="12.5" font-weight="bold">3 · Osmosis</text>
  <rect x="44" y="288" width="70" height="36" rx="6" fill="#d8ecdc"/>
  <rect x="122" y="288" width="70" height="36" rx="6" fill="#00573f"/>
  <line x1="106" y1="306" x2="136" y2="306" stroke="#00573f" stroke-width="2.5" marker-end="url(#hd1ArrGreen)"/>
  <text x="79" y="308" fill="#2f6b4a" font-size="9" text-anchor="middle">low solute</text>
  <text x="157" y="308" fill="#ffffff" font-size="9" text-anchor="middle">high solute</text>
  <text x="38" y="334" fill="#5b6b7a" font-size="9.5">water follows the solute gradient</text>
</g>

<!-- ULTRAFILATION (bottom-right) -->
<g>
  <rect x="420" y="252" width="196" height="86" rx="10" fill="#ffffff" stroke="#d99a00" stroke-width="1.5" filter="url(#hd1Sh)"/>
  <text x="434" y="272" fill="#b8860b" font-size="12.5" font-weight="bold">4 · Ultrafiltration (UF)</text>
  <line x1="440" y1="300" x2="472" y2="288" stroke="#d99a00" stroke-width="2" marker-end="url(#hd1ArrGold)"/>
  <line x1="440" y1="308" x2="472" y2="308" stroke="#d99a00" stroke-width="2" marker-end="url(#hd1ArrGold)"/>
  <line x1="440" y1="316" x2="472" y2="328" stroke="#d99a00" stroke-width="2" marker-end="url(#hd1ArrGold)"/>
  <text x="482" y="306" fill="#5b6b7a" font-size="9.5">hydrostatic pressure</text>
  <text x="482" y="320" fill="#5b6b7a" font-size="9.5">(TMP) gradient</text>
  <text x="434" y="334" fill="#5b6b7a" font-size="9.5">removes excess fluid</text>
</g>

<!-- connectors to dialyzer -->
<line x1="220" y1="119" x2="262" y2="140" stroke="#c10230" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="420" y1="119" x2="378" y2="140" stroke="#0090b8" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="220" y1="295" x2="262" y2="266" stroke="#00573f" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="420" y1="295" x2="378" y2="266" stroke="#d99a00" stroke-width="1.5" stroke-dasharray="4 3"/>

<text x="320" y="376" fill="#022851" font-size="11.5" text-anchor="middle" font-weight="bold">Together these four principles define the dialysis prescription</text>
<text x="320" y="392" fill="#5b6b7a" font-size="10" text-anchor="middle">optimize solute clearance · control fluid removal · troubleshoot treatment issues</text>
<text x="616" y="410" fill="#9aa7b4" font-size="9" text-anchor="end">CNN Exam Prep · Hemodialysis</text>
</svg>