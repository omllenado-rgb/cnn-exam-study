<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="ac3Head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#022851"/><stop offset="1" stop-color="#003a6b"/></linearGradient>
  <marker id="ac3Arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#022851"/></marker>
  <marker id="ac3ArrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c10230"/></marker>
  <marker id="ac3ArrCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0090b8"/></marker>
  <filter id="ac3Sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#022851" flood-opacity="0.18"/></filter>
</defs>
<rect width="640" height="420" fill="#f7fafc"/>
<rect width="640" height="56" fill="url(#ac3Head)"/>
<rect y="56" width="640" height="4" fill="#ffbf00"/>
<text x="24" y="27" fill="#ffffff" font-size="17" font-weight="bold">SLED Therapy in Acute Care</text>
<text x="24" y="45" fill="#ffbf00" letter-spacing="0.5" font-size="11">Slow Low-Efficiency Daily Dialysis — gentler than standard HD</text>

<!-- ============ treatment timeline (top) ============ -->
<rect x="40" y="76" width="576" height="88" rx="12" fill="#ffffff" stroke="#e3e8ee" filter="url(#ac3Sh)"/>
<text x="56" y="98" fill="#022851" font-size="12.5" font-weight="bold">The prescription in one timeline</text>
<!-- timeline axis -->
<line x1="70" y1="146" x2="580" y2="146" stroke="#5b6b7a" stroke-width="2" marker-end="url(#ac3Arr)"/>
<!-- standard HD block -->
<rect x="70" y="120" width="96" height="14" rx="4" fill="#c10230"/>
<text x="172" y="131" fill="#c10230" font-size="8.5" font-weight="bold">standard HD ≈ 4 h</text>
<!-- SLED block -->
<rect x="70" y="138" width="480" height="16" rx="4" fill="#022851" opacity="0.92"/>
<text x="310" y="150" fill="#ffbf00" font-size="9" text-anchor="middle" font-weight="bold">SLED — daily, up to 12 hours · low blood flow · low hourly UF</text>
<g font-size="8" fill="#9aa7b4" text-anchor="middle">
  <text x="70" y="164">0 h</text><text x="230" y="164">4 h</text><text x="390" y="164">8 h</text><text x="550" y="164">12 h</text>
</g>
<text x="56" y="112" fill="#5b6b7a" font-size="9">designed for hemodynamically unstable patients who can't tolerate rapid fluid shifts</text>

<!-- ============ SLED vs standard HD compare (left) ============ -->
<rect x="40" y="178" width="286" height="150" rx="12" fill="#ffffff" stroke="#e3e8ee" filter="url(#ac3Sh)"/>
<text x="56" y="200" fill="#022851" font-size="12" font-weight="bold">Why it's gentler</text>
<g font-size="9.5" fill="#1c2b39">
  <text x="56" y="222">· mostly diffusion (low-efficiency)</text>
  <text x="56" y="242">· low blood-flow rates</text>
  <text x="56" y="262">· extended time → tiny hourly UF rates</text>
  <text x="56" y="282">· custom: remove the volume given</text>
  <text x="68" y="294" fill="#5b6b7a" font-size="9">over the previous 24 hours</text>
</g>
<rect x="56" y="302" width="254" height="18" rx="6" fill="#e2f2fb"/>
<text x="183" y="315" fill="#0090b8" font-size="8.5" text-anchor="middle" font-weight="bold">fewer hypotensive dips, better tolerated</text>

<!-- ============ machine schematic (right) ============ -->
<rect x="338" y="178" width="278" height="150" rx="12" fill="#ffffff" stroke="#e3e8ee" filter="url(#ac3Sh)"/>
<text x="354" y="200" fill="#022851" font-size="12" font-weight="bold">SLED circuit</text>
<!-- circuit -->
<path d="M360 254 H416 V254 H452" fill="none" stroke="#c10230" stroke-width="4.5" stroke-linecap="round"/>
<!-- high-flux dialyzer -->
<g filter="url(#ac3Sh)">
  <rect x="458" y="232" width="46" height="66" rx="9" fill="#e9f1f8" stroke="#5b6b7a" stroke-width="1.5"/>
</g>
<g stroke="#ffbf00" stroke-width="2"><line x1="466" y1="238" x2="466" y2="292"/><line x1="474" y1="238" x2="474" y2="292"/><line x1="482" y1="238" x2="482" y2="292"/><line x1="492" y1="238" x2="492" y2="292"/></g>
<path d="M504 254 H556" fill="none" stroke="#c10230" stroke-width="4.5" stroke-linecap="round"/>
<path d="M566 230 H458" fill="none" stroke="#0090b8" stroke-width="4"/>
<text x="516" y="224" fill="#0090b8" font-size="7.5" text-anchor="middle" font-weight="bold">dialysate (counter-current)</text>
<!-- labels -->
<circle cx="416" cy="254" r="13" fill="#022851"/>
<circle cx="416" cy="254" r="6" fill="none" stroke="#ffbf00" stroke-width="2"/>
<text x="416" y="282" fill="#5b6b7a" font-size="7.5" text-anchor="middle">low blood flow</text>
<text x="481" y="312" fill="#5b6b7a" font-size="7.5" text-anchor="middle">HIGH-FLUX dialyzer</text>
<text x="566" y="278" fill="#5b6b7a" font-size="7.5" text-anchor="end">to patient</text>
<rect x="354" y="308" width="90" height="14" rx="4" fill="#e2f2fb"/>
<text x="399" y="318" fill="#0090b8" font-size="7.5" text-anchor="middle" font-weight="bold">maximizes clearance</text>

<text x="320" y="360" fill="#022851" font-size="11" text-anchor="middle" font-weight="bold">Think of SLED as intermittent HD slowed down: same machine logic, gentler shifts</text>
<text x="320" y="376" fill="#5b6b7a" font-size="9.5" text-anchor="middle">bridge therapy for the unstable ICU patient — daily, long, slow, and steady</text>
<text x="616" y="410" fill="#9aa7b4" font-size="9" text-anchor="end">CNN Exam Prep · Acute Therapies</text>
</svg>