<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="pd7Head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#022851"/><stop offset="1" stop-color="#003a6b"/></linearGradient>
  <filter id="pd7Sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#022851" flood-opacity="0.18"/></filter>
</defs>
<rect width="640" height="420" fill="#f7fafc"/>
<rect width="640" height="56" fill="url(#pd7Head)"/>
<rect y="56" width="640" height="4" fill="#ffbf00"/>
<text x="24" y="27" fill="#ffffff" font-size="17" font-weight="bold">Ultrafiltration Failure</text>
<text x="24" y="45" fill="#ffbf00" font-size="11" letter-spacing="0.5">Rule of four · four failure types · EPS</text>

<!-- ============ rule of four banner ============ -->
<g filter="url(#pd7Sh)">
  <rect x="36" y="70" width="568" height="60" rx="12" fill="#022851"/>
</g>
<text x="52" y="95" fill="#ffbf00" font-size="13" font-weight="bold">THE RULE OF FOUR</text>
<text x="52" y="112" fill="#cfe0f2" font-size="8.5">UF failure means: after a 4-hour dwell with 4.25% dextrose, you removed</text>
<g fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">
  <text x="410" y="110">4</text><text x="466" y="110">4.25%</text><text x="526" y="110">&lt; 400</text><text x="582" y="110">mL</text>
</g>
<text x="410" y="122" fill="#cfe0f2" font-size="6.5" text-anchor="middle">hours</text>
<text x="466" y="122" fill="#cfe0f2" font-size="6.5" text-anchor="middle">dextrose</text>
<text x="526" y="122" fill="#cfe0f2" font-size="6.5" text-anchor="middle">UF — then</text>
<text x="582" y="122" fill="#cfe0f2" font-size="6.5" text-anchor="middle">it is failure</text>

<!-- ============ type table ============ -->
<!-- Type 1 -->
<rect x="36" y="142" width="138" height="150" rx="10" fill="#ffffff" stroke="#c10230" stroke-width="1.5" filter="url(#pd7Sh)"/>
<rect x="36" y="142" width="138" height="24" rx="10" fill="#c10230"/><rect x="36" y="154" width="138" height="12" fill="#c10230"/>
<text x="105" y="159" fill="#ffffff" font-size="10" text-anchor="middle" font-weight="bold">TYPE 1 — most common</text>
<text x="52" y="184" fill="#1c2b39" font-size="8.5" font-weight="bold">High transport state</text>
<text x="52" y="196" fill="#5b6b7a" font-size="8">big surface area, glucose</text>
<text x="52" y="207" fill="#5b6b7a" font-size="8">absorbed fast, gradient dies</text>
<rect x="52" y="216" width="106" height="30" rx="6" fill="#ffe3e6"/>
<text x="105" y="229" fill="#c10230" font-size="8" text-anchor="middle" font-weight="bold">Rest the membrane</text>
<text x="105" y="240" fill="#c10230" font-size="8" text-anchor="middle" font-weight="bold">≈ 4 weeks (HD bridge)</text>
<text x="52" y="262" fill="#5b6b7a" font-size="7.5">often recovers; seen after</text>
<text x="52" y="272" fill="#5b6b7a" font-size="7.5">peritonitis episodes</text>
<!-- Type 2 -->
<rect x="181" y="142" width="138" height="150" rx="10" fill="#ffffff" stroke="#022851" stroke-width="1.5" filter="url(#pd7Sh)"/>
<rect x="181" y="142" width="138" height="24" rx="10" fill="#022851"/><rect x="181" y="154" width="138" height="12" fill="#022851"/>
<text x="250" y="159" fill="#ffffff" font-size="10" text-anchor="middle" font-weight="bold">TYPE 2</text>
<text x="197" y="184" fill="#1c2b39" font-size="8.5" font-weight="bold">Aquaporin deficiency</text>
<text x="197" y="196" fill="#5b6b7a" font-size="8">water channels missing —</text>
<text x="197" y="207" fill="#5b6b7a" font-size="8">no free-water sieving</text>
<rect x="197" y="216" width="106" height="30" rx="6" fill="#e9f1f8"/>
<text x="250" y="229" fill="#022851" font-size="8" text-anchor="middle" font-weight="bold">No effective</text>
<text x="250" y="240" fill="#022851" font-size="8" text-anchor="middle" font-weight="bold">treatment exists</text>
<text x="197" y="262" fill="#5b6b7a" font-size="7.5">solute transport normal,</text>
<text x="197" y="272" fill="#5b6b7a" font-size="7.5">UF still poor</text>
<!-- Type 3 -->
<rect x="326" y="142" width="138" height="150" rx="10" fill="#ffffff" stroke="#7a3b8f" stroke-width="1.5" filter="url(#pd7Sh)"/>
<rect x="326" y="142" width="138" height="24" rx="10" fill="#7a3b8f"/><rect x="326" y="154" width="138" height="12" fill="#7a3b8f"/>
<text x="395" y="159" fill="#ffffff" font-size="10" text-anchor="middle" font-weight="bold">TYPE 3</text>
<text x="342" y="184" fill="#1c2b39" font-size="8.5" font-weight="bold">Low surface area</text>
<text x="342" y="196" fill="#5b6b7a" font-size="8">small / scarred membrane</text>
<text x="342" y="207" fill="#5b6b7a" font-size="8">(fibrosis, adhesions)</text>
<rect x="342" y="216" width="106" height="30" rx="6" fill="#f3ecf8"/>
<text x="395" y="229" fill="#7a3b8f" font-size="8" text-anchor="middle" font-weight="bold">No effective</text>
<text x="395" y="240" fill="#7a3b8f" font-size="8" text-anchor="middle" font-weight="bold">treatment exists</text>
<text x="342" y="262" fill="#c10230" font-size="7.5" font-weight="bold">flags EPS risk — watch</text>
<text x="342" y="272" fill="#5b6b7a" font-size="7.5">solute clearance falls too</text>
<!-- Type 4 -->
<rect x="471" y="142" width="133" height="150" rx="10" fill="#ffffff" stroke="#8a6d1b" stroke-width="1.5" filter="url(#pd7Sh)"/>
<rect x="471" y="142" width="133" height="24" rx="10" fill="#8a6d1b"/><rect x="471" y="154" width="133" height="12" fill="#8a6d1b"/>
<text x="537" y="159" fill="#ffffff" font-size="10" text-anchor="middle" font-weight="bold">TYPE 4</text>
<text x="487" y="184" fill="#1c2b39" font-size="8.5" font-weight="bold">High lymphatic loss</text>
<text x="487" y="196" fill="#5b6b7a" font-size="8">dialysate absorbed back</text>
<text x="487" y="207" fill="#5b6b7a" font-size="8">through lymphatics</text>
<rect x="487" y="216" width="101" height="30" rx="6" fill="#fdf3d1"/>
<text x="537" y="229" fill="#8a6d1b" font-size="8" text-anchor="middle" font-weight="bold">May need to</text>
<text x="537" y="240" fill="#8a6d1b" font-size="8" text-anchor="middle" font-weight="bold">discontinue PD</text>
<text x="487" y="262" fill="#5b6b7a" font-size="7.5">membrane itself tests</text>
<text x="487" y="272" fill="#5b6b7a" font-size="7.5">normal on PET</text>

<!-- ============ EPS + effluent oddities (bottom) ============ -->
<g filter="url(#pd7Sh)">
  <rect x="36" y="304" width="346" height="86" rx="12" fill="#ffffff" stroke="#c10230" stroke-width="1.5"/>
</g>
<text x="52" y="326" fill="#c10230" font-size="12" font-weight="bold">The endpoint: EPS (encapsulating sclerosis)</text>
<text x="52" y="344" fill="#1c2b39" font-size="8.5">fibrous cocoon wraps the bowel → obstruction, malnutrition</text>
<text x="52" y="358" fill="#c10230" font-size="9" font-weight="bold">50% mortality at 12 months · risk climbs after 3–5 years on PD</text>
<text x="52" y="376" fill="#5b6b7a" font-size="8">consider switching modality as PD years accumulate</text>
<rect x="384" y="304" width="220" height="86" rx="12" fill="#ffffff" stroke="#e3e8ee" filter="url(#pd7Sh)"/>
<text x="400" y="326" fill="#022851" font-size="12" font-weight="bold">Bloody or milky effluent</text>
<text x="400" y="346" fill="#1c2b39" font-size="8.5" font-weight="bold">Hemoperitoneum</text>
<text x="400" y="357" fill="#5b6b7a" font-size="8">often benign — observe unless severe</text>
<text x="400" y="374" fill="#1c2b39" font-size="8.5" font-weight="bold">Chyloperitoneum — milky</text>
<text x="400" y="385" fill="#5b6b7a" font-size="8">stop PD + low-fat diet</text>

<text x="616" y="412" fill="#9aa7b4" font-size="9" text-anchor="end">CNN Exam Prep · Peritoneal Dialysis</text>
</svg>