<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="cvvHead" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#022851"/><stop offset="1" stop-color="#003a6b"/></linearGradient>
  <linearGradient id="cvvFilter" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f8fb"/><stop offset="1" stop-color="#c4d3e0"/></linearGradient>
  <marker id="cvvArr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#022851"/></marker>
  <filter id="cvvSh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#022851" flood-opacity="0.18"/></filter>
</defs>
<rect width="640" height="420" fill="#f7fafc"/>
<rect width="640" height="56" fill="url(#cvvHead)"/>
<rect y="56" width="640" height="4" fill="#ffbf00"/>
<text x="24" y="27" fill="#ffffff" font-size="17" font-weight="bold">CRRT — Continuous Renal Replacement Therapy</text>
<text x="24" y="45" fill="#ffbf00" font-size="11" letter-spacing="0.5">Gentle 24/7 clearance for unstable ICU patients</text>

<!-- ============ CRRT circuit (left) ============ -->
<rect x="36" y="76" width="330" height="290" rx="12" fill="#ffffff" stroke="#e3e8ee" filter="url(#cvvSh)"/>
<text x="52" y="98" fill="#022851" font-size="12" font-weight="bold">The CVVH circuit</text>
<!-- access -->
<circle cx="72" cy="130" r="9" fill="#c10230"/>
<text x="48" y="112" fill="#c10230" font-size="8.5">access</text>
<!-- arterial line to pump -->
<path d="M81 130 H150" fill="none" stroke="#c10230" stroke-width="5" stroke-linecap="round"/>
<!-- blood pump -->
<circle cx="178" cy="130" r="24" fill="#022851"/>
<circle cx="178" cy="130" r="14" fill="none" stroke="#ffbf00" stroke-width="2"/>
<circle cx="178" cy="119" r="3.5" fill="#ffbf00"/>
<circle cx="170" cy="136" r="3.5" fill="#ffbf00"/>
<circle cx="186" cy="136" r="3.5" fill="#ffbf00"/>
<text x="178" y="158" fill="#022851" font-size="8.5" text-anchor="middle" font-weight="bold">blood pump</text>
<!-- pump to filter -->
<path d="M206 130 H240" fill="none" stroke="#c10230" stroke-width="5" stroke-linecap="round"/>
<!-- filter (hemofilter) -->
<g filter="url(#cvvSh)">
  <rect x="242" y="96" width="56" height="86" rx="10" fill="url(#cvvFilter)" stroke="#5b6b7a" stroke-width="2"/>
</g>
<g stroke="#ffbf00" stroke-width="2">
  <line x1="252" y1="104" x2="252" y2="174"/><line x1="263" y1="104" x2="263" y2="174"/>
  <line x1="274" y1="104" x2="274" y2="174"/><line x1="286" y1="104" x2="286" y2="174"/>
</g>
<rect x="250" y="104" width="8" height="70" fill="#c10230" opacity="0.4"/>
<text x="270" y="194" fill="#5b6b7a" font-size="8.5" text-anchor="middle" font-weight="bold">hemofilter</text>
<!-- ultrafiltrate out bottom -->
<path d="M270 182 V216 H320" fill="none" stroke="#f5c96a" stroke-width="5" stroke-linecap="round"/>
<rect x="320" y="204" width="30" height="24" rx="5" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.2"/>
<text x="335" y="219" fill="#8a6d1b" font-size="7" text-anchor="middle">effluent</text>
<text x="335" y="242" fill="#8a6d1b" font-size="8" text-anchor="middle">waste + UF fluid</text>
<!-- return line with substitution -->
<path d="M298 120 H352" fill="none" stroke="#c10230" stroke-width="5" stroke-linecap="round"/>
<!-- replacement fluid junction -->
<circle cx="352" cy="120" r="6" fill="#00573f"/>
<path d="M352 120 H398" fill="none" stroke="#c10230" stroke-width="5" stroke-linecap="round"/>
<path d="M352 120 V96" fill="none" stroke="#00573f" stroke-width="4"/>
<rect x="326" y="68" width="52" height="22" rx="5" fill="#e2f2e6" stroke="#00573f" stroke-width="1.2"/>
<text x="352" y="82" fill="#00573f" font-size="7.5" text-anchor="middle" font-weight="bold">replacement</text>
<!-- return to patient -->
<path d="M398 120 q20 0 20 20 V300 q0 16 -16 16 H120 q-16 0 -16 -14 v-20" fill="none" stroke="#c10230" stroke-width="5" stroke-linecap="round"/>
<polygon points="104,262 96,282 114,282" fill="#c10230"/>
<text x="240" y="302" fill="#8d1f33" font-size="8.5" font-weight="bold">clean blood returned continuously</text>

<!-- pre-dilution / post-dilution chips -->
<g font-size="8.5" fill="#5b6b7a">
  <text x="396" y="86" text-anchor="start"> </text>
</g>
<rect x="52" y="324" width="140" height="30" rx="8" fill="#e2f2e6" stroke="#00573f" stroke-width="1"/>
<text x="122" y="341" fill="#00573f" font-size="8.5" text-anchor="middle" font-weight="bold">pre-dilution · post-dilution</text>
<text x="122" y="351" fill="#5b6b7a" font-size="7" text-anchor="middle">replacement before or after the filter</text>

<!-- ============ right: when & why ============ -->
<rect x="386" y="76" width="230" height="132" rx="12" fill="#ffffff" stroke="#e3e8ee" filter="url(#cvvSh)"/>
<text x="402" y="98" fill="#022851" font-size="12" font-weight="bold">Choose CRRT when…</text>
<g font-size="9.5" fill="#1c2b39">
  <text x="402" y="120">· hemodynamically unstable</text>
  <text x="402" y="138">· HD would drop the BP too far</text>
  <text x="402" y="156">· severe fluid overload, sepsis</text>
  <text x="402" y="174">· brain injury — no rapid shifts</text>
  <text x="402" y="192">· runs 24 h at ~25–35 mL/kg/hr</text>
</g>

<!-- modality strip -->
<g filter="url(#cvvSh)">
  <rect x="386" y="220" width="230" height="104" rx="12" fill="#022851"/>
</g>
<text x="402" y="246" fill="#ffbf00" font-size="10.5" font-weight="bold">The CRRT family</text>
<g font-size="9" fill="#cfe0f2">
  <text x="402" y="266" font-weight="bold" fill="#ffffff">SCUF</text>
  <text x="450" y="266">— ultrafiltration only</text>
  <text x="402" y="284" font-weight="bold" fill="#ffffff">CVVH</text>
  <text x="450" y="284">— convection</text>
  <text x="402" y="302" font-weight="bold" fill="#ffffff">CVVHD</text>
  <text x="450" y="302">— diffusion</text>
  <text x="402" y="320" font-weight="bold" fill="#ffffff">CVVHDF</text>
  <text x="460" y="320">— both + replacement</text>
</g>

<!-- citrate note -->
<g filter="url(#cvvSh)">
  <rect x="386" y="332" width="230" height="42" rx="12" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.2"/>
</g>
<text x="402" y="350" fill="#8a6d1b" font-size="9.5" font-weight="bold">Often runs citrate anticoagulation</text>
<text x="402" y="364" fill="#5b6b7a" font-size="8.5">monitor ionized calcium and acid–base</text>

<!-- caption -->
<text x="320" y="386" fill="#022851" font-size="10.5" text-anchor="middle" font-weight="bold">Slow, continuous, steady — the ICU alternative to intermittent hemodialysis</text>
<text x="616" y="406" fill="#9aa7b4" font-size="9" text-anchor="end">CNN Exam Prep · Acute Therapies</text>
</svg>