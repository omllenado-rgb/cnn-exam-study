<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="kd6Head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#022851"/><stop offset="1" stop-color="#003a6b"/></linearGradient>
  <linearGradient id="kd6Liver" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a4a3f"/><stop offset="1" stop-color="#6b332a"/></linearGradient>
  <linearGradient id="kd6Kidney" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a34a3f"/><stop offset="1" stop-color="#7a3b8f"/></linearGradient>
  <marker id="kd6Arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#022851"/></marker>
  <marker id="kd6ArrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c10230"/></marker>
  <marker id="kd6ArrCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0090b8"/></marker>
  <filter id="kd6Sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#022851" flood-opacity="0.18"/></filter>
</defs>
<rect width="640" height="420" fill="#f7fafc"/>
<rect width="640" height="56" fill="url(#kd6Head)"/>
<rect y="56" width="640" height="4" fill="#ffbf00"/>
<text x="24" y="27" fill="#ffffff" font-size="17" font-weight="bold">Hepatorenal Syndrome (HRS)</text>
<text x="24" y="45" fill="#ffbf00" font-size="11" letter-spacing="0.5">When the failing liver shuts down the kidneys</text>

<!-- ============ pathophysiology chain (center-right) ============ -->
<!-- cirrhotic liver -->
<g filter="url(#kd6Sh)">
  <path d="M300 108 C270 100 242 116 240 148 C238 176 260 194 290 192 C318 192 336 178 334 162 C346 158 346 138 332 134 C336 118 322 110 300 108 Z" fill="url(#kd6Liver)" stroke="#5a2d24" stroke-width="1.5"/>
</g>
<path d="M268 128 q14 10 34 4 M270 146 q18 8 40 -2 M274 162 q16 8 38 0" fill="none" stroke="#e8c9b8" stroke-width="1.5" opacity="0.8"/>
<text x="286" y="206" fill="#5a2d24" font-size="9.5" text-anchor="middle" font-weight="bold">cirrhotic liver</text>
<line x1="352" y1="146" x2="392" y2="146" stroke="#c10230" stroke-width="2.5" marker-end="url(#kd6Arr)"/>
<text x="372" y="136" fill="#c10230" font-size="8.5" text-anchor="middle" font-weight="bold">portal HTN</text>
<!-- splanchnic vasodilation -->
<g filter="url(#kd6Sh)">
  <rect x="396" y="112" width="150" height="70" rx="10" fill="#ffffff" stroke="#d99a00" stroke-width="1.5"/>
</g>
<text x="471" y="132" fill="#b8860b" font-size="9.5" text-anchor="middle" font-weight="bold">splanchnic vasodilation</text>
<g stroke="#d99a00" stroke-width="2" fill="none">
  <path d="M414 152 q6 -8 12 0"/><path d="M438 152 q6 -8 12 0"/><path d="M462 152 q6 -8 12 0"/><path d="M486 152 q6 -8 12 0"/><path d="M510 152 q6 -8 12 0"/>
</g>
<text x="471" y="172" fill="#5b6b7a" font-size="8.5" text-anchor="middle">vasodilation drops effective volume</text>
<!-- arrow down -->
<line x1="471" y1="186" x2="471" y2="212" stroke="#022851" stroke-width="2.5" marker-end="url(#kd6Arr)"/>
<!-- renal vasoconstriction + kidney -->
<g filter="url(#kd6Sh)">
  <path d="M418 216 C390 206 362 226 362 260 C362 290 382 310 408 312 C426 310 436 300 432 290 C446 296 450 272 436 268 C442 252 438 226 418 216 Z" fill="url(#kd6Kidney)" stroke="#5f2d5e" stroke-width="1.5" transform="translate(90,-4)"/>
</g>
<g stroke="#c10230" stroke-width="2" fill="none" stroke-linecap="round">
  <path d="M484 232 l10 8 M482 244 l12 0 M486 256 l10 -4 M496 236 l8 8"/>
</g>
<text x="494" y="318" fill="#022851" font-size="9.5" text-anchor="middle" font-weight="bold">compensatory renal vasoconstriction → GFR ↓</text>

<!-- ============ HRS-1 vs HRS-2 (left column) ============ -->
<g filter="url(#kd6Sh)">
  <rect x="28" y="72" width="196" height="120" rx="12" fill="#fff3f4" stroke="#c10230" stroke-width="1.5"/>
</g>
<text x="44" y="94" fill="#c10230" font-size="12" font-weight="bold">HRS-1 — acute</text>
<text x="44" y="112" fill="#1c2b39" font-size="9">Cr ↑ &gt; 0.3 mg/dL within 48 h,</text>
<text x="44" y="126" fill="#1c2b39" font-size="9">or 1.5× baseline within 7 days</text>
<rect x="44" y="136" width="164" height="40" rx="8" fill="#022851"/>
<text x="126" y="156" fill="#ffbf00" font-size="13" text-anchor="middle" font-weight="bold">≈ 2 weeks</text>
<text x="126" y="170" fill="#cfe0f2" font-size="8" text-anchor="middle">median survival</text>

<g filter="url(#kd6Sh)">
  <rect x="28" y="204" width="196" height="120" rx="12" fill="#ffffff" stroke="#e3e8ee"/>
</g>
<text x="44" y="226" fill="#00573f" font-size="12" font-weight="bold">HRS-2 — gradual</text>
<text x="44" y="244" fill="#1c2b39" font-size="9">slow onset, refractory ascites</text>
<text x="44" y="258" fill="#1c2b39" font-size="9">course, poor prognosis</text>
<rect x="44" y="264" width="164" height="40" rx="8" fill="#022851"/>
<text x="126" y="284" fill="#ffbf00" font-size="13" text-anchor="middle" font-weight="bold">≈ 6 months</text>
<text x="126" y="298" fill="#cfe0f2" font-size="8" text-anchor="middle">median survival</text>
<text x="44" y="316" fill="#5b6b7a" font-size="9">severe complication of liver disease</text>

<!-- ============ treatment (bottom right) ============ -->
<g filter="url(#kd6Sh)">
  <rect x="240" y="336" width="376" height="60" rx="12" fill="#022851"/>
</g>
<text x="256" y="354" fill="#ffbf00" font-size="10.5" font-weight="bold">Treatment: keep hemodynamics stable, never let BP fall</text>
<text x="256" y="372" fill="#cfe0f2" font-size="9">albumin 1 g/kg/day (max 100 g) + norepinephrine first-line</text>
<text x="256" y="386" fill="#cfe0f2" font-size="9">terlipressin if no response within 48 hours</text>
<text x="616" y="414" fill="#9aa7b4" font-size="9" text-anchor="end">CNN Exam Prep · Kidney Disease</text>
</svg>