<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="kd5Head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#022851"/><stop offset="1" stop-color="#003a6b"/></linearGradient>
  <marker id="kd5Arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#022851"/></marker>
  <marker id="kd5ArrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c10230"/></marker>
  <filter id="kd5Sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#022851" flood-opacity="0.18"/></filter>
</defs>
<rect width="640" height="420" fill="#f7fafc"/>
<rect width="640" height="56" fill="url(#kd5Head)"/>
<rect y="56" width="640" height="4" fill="#ffbf00"/>
<text x="24" y="27" fill="#ffffff" font-size="17" font-weight="bold">Salicylate &amp; Ethylene Glycol Toxicity</text>
<text x="24" y="45" fill="#ffbf00" font-size="11" letter-spacing="0.5">Toxic ingestion · charcoal · antidote · dialysis</text>

<!-- ============ SALICYLATE (left) ============ -->
<rect x="28" y="72" width="292" height="290" rx="12" fill="#ffffff" stroke="#e3e8ee" filter="url(#kd5Sh)"/>
<text x="44" y="94" fill="#c10230" font-size="13" font-weight="bold">Salicylate toxicity</text>
<!-- severity ladder -->
<rect x="44" y="104" width="240" height="24" rx="12" fill="#d99a00"/>
<text x="164" y="120" fill="#ffffff" font-size="9" text-anchor="middle" font-weight="bold">mild 40–80 mg/dL</text>
<rect x="44" y="132" width="240" height="24" rx="12" fill="#c10230"/>
<text x="164" y="148" fill="#ffffff" font-size="9" text-anchor="middle" font-weight="bold">severe &gt; 100 mg/dL</text>
<!-- acid-base course -->
<rect x="44" y="166" width="240" height="52" rx="8" fill="#eef4f8"/>
<text x="56" y="184" fill="#022851" font-size="9" font-weight="bold">Acid–base course:</text>
<text x="56" y="200" fill="#1c2b39" font-size="9">respiratory alkalosis FIRST,</text>
<text x="56" y="214" fill="#1c2b39" font-size="9">then metabolic acidosis</text>
<!-- pulmonary edema warning -->
<g filter="url(#kd5Sh)">
  <rect x="44" y="228" width="240" height="40" rx="8" fill="#ffe3e6" stroke="#c10230" stroke-width="1.5"/>
</g>
<text x="164" y="244" fill="#c10230" font-size="9" text-anchor="middle" font-weight="bold">⚠ Most dangerous: noncardiac pulmonary edema</text>
<text x="164" y="259" fill="#c10230" font-size="8.5" text-anchor="middle" font-weight="bold">— the leading cause of death</text>
<!-- treatment -->
<rect x="44" y="280" width="240" height="70" rx="8" fill="#e2f2e6" stroke="#00573f" stroke-width="1"/>
<text x="56" y="298" fill="#00573f" font-size="9.5" font-weight="bold">Treatment</text>
<text x="56" y="316" fill="#1c2b39" font-size="9">· activated charcoal within 2 hours</text>
<text x="56" y="334" fill="#1c2b39" font-size="9">· IV sodium bicarbonate (alkalinize)</text>

<!-- ============ ETHYLENE GLYCOL (right) ============ -->
<rect x="332" y="72" width="288" height="290" rx="12" fill="#ffffff" stroke="#e3e8ee" filter="url(#kd5Sh)"/>
<text x="348" y="94" fill="#7a3b8f" font-size="13" font-weight="bold">Ethylene glycol toxicity</text>
<!-- jug + kidney -->
<g filter="url(#kd5Sh)">
  <path d="M352 116 h58 l8 44 v40 a6 6 0 0 1 -6 6 h-62 a6 6 0 0 1 -6 -6 v-40 z" fill="#c9f0d8" stroke="#00573f" stroke-width="2"/>
</g>
<rect x="352" y="188" width="46" height="8" rx="3" fill="#00573f" opacity="0.5"/>
<text x="382" y="222" fill="#00573f" font-size="9" text-anchor="middle" font-weight="bold">antifreeze</text>
<!-- arrow to kidney -->
<line x1="424" y1="160" x2="464" y2="160" stroke="#7a3b8f" stroke-width="2.5" marker-end="url(#kd5Arr)"/>
<!-- kidney -->
<g filter="url(#kd5Sh)">
  <path d="M508 128 C480 118 452 138 452 172 C452 202 472 222 498 224 C516 224 526 214 522 204 C536 210 540 186 526 182 C532 162 528 136 508 128 Z" fill="#9d5545" stroke="#7a3b36" stroke-width="1.5"/>
</g>
<g fill="#c10230">
  <circle cx="480" cy="160" r="3"/><circle cx="496" cy="176" r="3"/><circle cx="488" cy="192" r="3"/>
  <circle cx="508" cy="158" r="2.5"/><circle cx="500" cy="148" r="2.5"/>
</g>
<text x="492" y="238" fill="#c10230" font-size="9" text-anchor="middle" font-weight="bold">direct tubular damage</text>
<!-- level + antidote -->
<rect x="348" y="246" width="256" height="42" rx="8" fill="#f3ecf8" stroke="#7a3b8f" stroke-width="1"/>
<text x="360" y="262" fill="#5a2f73" font-size="9" font-weight="bold">Level &gt; 20 mg/dL</text>
<text x="360" y="278" fill="#1c2b39" font-size="9">metabolites — glycolic/oxalic acid — do the harm</text>
<g filter="url(#kd5Sh)">
  <rect x="348" y="296" width="256" height="38" rx="8" fill="#e2f2fb" stroke="#0090b8" stroke-width="1.2"/>
</g>
<text x="360" y="312" fill="#0a3a55" font-size="9.5" font-weight="bold">Fomepizole = preferred antidote</text>
<text x="360" y="327" fill="#5b6b7a" font-size="8.5">(ethanol is the alternative)</text>
<text x="360" y="348" fill="#c10230" font-size="9" font-weight="bold">Hemodialysis: continue until &lt; 20 mg/dL</text>
<text x="360" y="359" fill="#5b6b7a" font-size="8">large-surface-area dialyzers · watch for rebound levels</text>

<text x="320" y="386" fill="#022851" font-size="10.5" text-anchor="middle" font-weight="bold">Both are dialysis-worthy ingestions — timing of charcoal and antidote decides outcome</text>
<text x="616" y="414" fill="#9aa7b4" font-size="9" text-anchor="end">CNN Exam Prep · Kidney Disease</text>
</svg>