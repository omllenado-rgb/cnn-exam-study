<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="hd7Head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#022851"/><stop offset="1" stop-color="#003a6b"/></linearGradient>
  <linearGradient id="hd7Chair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c4a68"/><stop offset="1" stop-color="#022851"/></linearGradient>
  <linearGradient id="hd7Skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4d5bc"/><stop offset="1" stop-color="#e8b894"/></linearGradient>
  <marker id="hd7Arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#022851"/></marker>
  <filter id="hd7Sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#022851" flood-opacity="0.18"/></filter>
</defs>
<rect width="640" height="420" fill="#f7fafc"/>
<rect width="640" height="56" fill="url(#hd7Head)"/>
<rect y="56" width="640" height="4" fill="#ffbf00"/>
<text x="24" y="27" fill="#ffffff" font-size="17" font-weight="bold">Intradialytic Hypotension &amp; Cramps</text>
<text x="24" y="45" fill="#ffbf00" font-size="11" letter-spacing="0.5">The most common complication of treatment</text>

<!-- ============ patient scene (left) ============ -->
<!-- recliner -->
<g filter="url(#hd7Sh)">
  <rect x="54" y="230" width="28" height="98" rx="10" fill="url(#hd7Chair)"/>
</g>
<rect x="54" y="314" width="132" height="14" rx="7" fill="#0a3358"/>
<rect x="86" y="294" width="88" height="10" rx="5" fill="#2c4a68"/>
<rect x="62" y="328" width="10" height="26" fill="#0a3358"/>
<rect x="168" y="328" width="10" height="26" fill="#0a3358"/>
<!-- patient -->
<circle cx="110" cy="258" r="13" fill="url(#hd7Skin)"/>
<rect x="97" y="272" width="27" height="42" rx="9" fill="#4d7fa8"/>
<line x1="106" y1="306" x2="158" y2="308" stroke="#3d5a78" stroke-width="14" stroke-linecap="round"/>
<line x1="160" y1="312" x2="155" y2="340" stroke="url(#hd7Skin)" stroke-width="9" stroke-linecap="round"/>
<!-- cramp -->
<g stroke="#c10230" stroke-width="2" stroke-linecap="round">
  <line x1="155" y1="322" x2="146" y2="316"/><line x1="155" y1="322" x2="164" y2="316"/>
  <line x1="155" y1="326" x2="145" y2="326"/>
</g>
<text x="155" y="356" fill="#c10230" font-size="9.5" font-weight="bold" text-anchor="middle">calf cramp</text>
<!-- arm with BP cuff -->
<path d="M106 282 q-10 8 -14 16" fill="none" stroke="#4d7fa8" stroke-width="8" stroke-linecap="round"/>
<rect x="86" y="288" width="24" height="11" rx="5.5" fill="#ffffff" stroke="#c10230" stroke-width="1.5"/>
<path d="M110 294 H140 V252 H168" fill="none" stroke="#c10230" stroke-width="1.5"/>
<!-- BP monitor on pole -->
<line x1="196" y1="252" x2="196" y2="340" stroke="#5b6b7a" stroke-width="3"/>
<line x1="182" y1="340" x2="210" y2="340" stroke="#5b6b7a" stroke-width="3"/>
<g filter="url(#hd7Sh)">
  <rect x="168" y="218" width="56" height="36" rx="6" fill="#022851"/>
</g>
<text x="196" y="236" fill="#ffffff" font-size="10.5" text-anchor="middle" font-weight="bold">88 syst</text>
<text x="196" y="248" fill="#ffbf00" font-size="7.5" text-anchor="middle">BP LOW</text>

<!-- definition card -->
<g filter="url(#hd7Sh)">
  <rect x="252" y="76" width="364" height="70" rx="10" fill="#fff3f4" stroke="#c10230" stroke-width="1.5"/>
</g>
<text x="268" y="98" fill="#c10230" font-size="11.5" font-weight="bold">Definition: systolic BP &lt; 90 mmHg, or a 20–30 mmHg drop</text>
<text x="268" y="116" fill="#5b6b7a" font-size="9.5">driven by ↓ peripheral vascular resistance + rapid blood-volume</text>
<text x="268" y="130" fill="#5b6b7a" font-size="9.5">loss from ultrafiltration exceeding refill from the tissues</text>

<!-- prevention -->
<g filter="url(#hd7Sh)">
  <rect x="252" y="158" width="176" height="128" rx="10" fill="#ffffff" stroke="#00573f" stroke-width="1.5"/>
</g>
<rect x="252" y="158" width="176" height="24" rx="10" fill="#00573f"/>
<rect x="252" y="172" width="176" height="10" fill="#00573f"/>
<text x="340" y="175" fill="#ffffff" font-size="10" text-anchor="middle" font-weight="bold">PREVENT</text>
<text x="264" y="200" fill="#1c2b39" font-size="9.5">· Accurate dry weight</text>
<text x="264" y="218" fill="#1c2b39" font-size="9.5">· Cool dialysate 34–36 °C</text>
<text x="264" y="236" fill="#1c2b39" font-size="9.5">· Fluid &amp; sodium limits</text>
<text x="264" y="254" fill="#1c2b39" font-size="9.5">· Avoid eating mid-treatment</text>
<text x="264" y="272" fill="#5b6b7a" font-size="8.5">(vasodilation after meals)</text>

<!-- treatment -->
<g filter="url(#hd7Sh)">
  <rect x="440" y="158" width="176" height="128" rx="10" fill="#ffffff" stroke="#0090b8" stroke-width="1.5"/>
</g>
<rect x="440" y="158" width="176" height="24" rx="10" fill="#0090b8"/>
<rect x="440" y="172" width="176" height="10" fill="#0090b8"/>
<text x="528" y="175" fill="#ffffff" font-size="10" text-anchor="middle" font-weight="bold">TREAT</text>
<text x="452" y="200" fill="#1c2b39" font-size="9.5">· Lower the UF rate</text>
<text x="452" y="218" fill="#1c2b39" font-size="9.5">· Saline bolus · feet-level</text>
<text x="452" y="236" fill="#1c2b39" font-size="9.5">· Stretch / massage cramp</text>
<text x="452" y="254" fill="#1c2b39" font-size="9.5">· Trendelenburg if severe</text>
<text x="452" y="272" fill="#5b6b7a" font-size="8.5">then reassess dry weight</text>

<!-- cramp prevention footer -->
<g filter="url(#hd7Sh)">
  <rect x="252" y="300" width="364" height="44" rx="10" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.2"/>
</g>
<text x="268" y="319" fill="#8a6d1b" font-size="10" font-weight="bold">Cramps hit &gt; 50% of patients</text>
<text x="268" y="335" fill="#5b6b7a" font-size="9">rapid UF + electrolyte shifts; nightly vitamin E 200 IU or gabapentin can prevent them</text>

<text x="320" y="376" fill="#022851" font-size="10.5" text-anchor="middle" font-weight="bold">First move at the chair: reduce UF, position safely, replace volume — then ask "was the dry weight right?"</text>
<text x="616" y="404" fill="#9aa7b4" font-size="9" text-anchor="end">CNN Exam Prep · Hemodialysis</text>
</svg>