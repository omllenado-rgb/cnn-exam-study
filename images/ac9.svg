<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="ac9Head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#022851"/><stop offset="1" stop-color="#003a6b"/></linearGradient>
  <marker id="ac9Arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d99a00"/></marker>
  <filter id="ac9Sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#022851" flood-opacity="0.18"/></filter>
</defs>
<rect width="640" height="420" fill="#f7fafc"/>
<rect width="640" height="56" fill="url(#ac9Head)"/>
<rect y="56" width="640" height="4" fill="#ffbf00"/>
<text x="24" y="27" fill="#ffffff" font-size="17" font-weight="bold">Buffer Solutions &amp; Dialysate in CRRT</text>
<text x="24" y="45" fill="#ffbf00" font-size="11" letter-spacing="0.5">what corrects the acidosis — and what to avoid</text>

<!-- ============ bicarbonate card ============ -->
<rect x="40" y="76" width="176" height="230" rx="12" fill="#ffffff" stroke="#00573f" stroke-width="1.5" filter="url(#ac9Sh)"/>
<g>
  <rect x="116" y="102" width="24" height="10" rx="2" fill="#00573f"/>
  <path d="M118 112 v18 a10 10 0 0 0 20 0 v-18 z" fill="#e7f2ec" stroke="#00573f" stroke-width="1.5"/>
  <text x="128" y="126" fill="#00573f" font-size="6.5" text-anchor="middle" font-weight="bold">HCO₃</text>
  <circle cx="124" cy="96" r="2.5" fill="#00573f" opacity="0.5"/>
  <circle cx="132" cy="90" r="2" fill="#00573f" opacity="0.35"/>
</g>
<text x="128" y="152" fill="#00573f" font-size="13" text-anchor="middle" font-weight="bold">Bicarbonate</text>
<rect x="50" y="162" width="156" height="20" rx="6" fill="#e7f2ec"/>
<text x="128" y="175" fill="#00573f" font-size="8.5" text-anchor="middle" font-weight="bold">KDIGO choice for the critically ill</text>
<g font-size="9" fill="#1c2b39" text-anchor="middle">
  <text x="128" y="202">· physiologic buffer</text>
  <text x="128" y="218">· no metabolic conversion</text>
  <text x="128" y="234">· minimal side effects</text>
  <text x="128" y="250">· the default in acute care</text>
</g>

<!-- ============ citrate card ============ -->
<rect x="232" y="76" width="176" height="230" rx="12" fill="#ffffff" stroke="#d99a00" stroke-width="1.5" filter="url(#ac9Sh)"/>
<circle cx="288" cy="108" r="11" fill="#fdf3d7" stroke="#d99a00" stroke-width="1.5"/>
<text x="288" y="112" fill="#8a6a00" font-size="8" text-anchor="middle" font-weight="bold">cit</text>
<line x1="302" y1="108" x2="330" y2="108" stroke="#d99a00" stroke-width="2" marker-end="url(#ac9Arr)"/>
<g fill="#e2f2fb" stroke="#0090b8" stroke-width="1">
  <circle cx="352" cy="96" r="8"/><circle cx="360" cy="110" r="8"/><circle cx="352" cy="124" r="8"/>
</g>
<text x="320" y="140" fill="#8a6a00" font-size="8" text-anchor="middle" font-weight="bold">1 citrate → 3 × HCO₃⁻ (liver + muscle)</text>
<text x="320" y="162" fill="#8a6a00" font-size="13" text-anchor="middle" font-weight="bold">Citrate</text>
<rect x="242" y="172" width="156" height="20" rx="6" fill="#fdf3d7"/>
<text x="320" y="185" fill="#8a6a00" font-size="8.5" text-anchor="middle" font-weight="bold">buffers AND anticoagulates</text>
<g font-size="9" fill="#1c2b39" text-anchor="middle">
  <text x="320" y="212">· regional circuit anticoagulation</text>
  <text x="320" y="228">· needs ionized-Ca monitoring</text>
  <text x="320" y="244">· compromised in liver failure</text>
  <text x="320" y="260">  and severe hypotension</text>
</g>

<!-- ============ acetate card ============ -->
<rect x="424" y="76" width="176" height="230" rx="12" fill="#ffffff" stroke="#c10230" stroke-width="1.5" filter="url(#ac9Sh)"/>
<path d="M512 92 l16 26 h-32 z" fill="none" stroke="#c10230" stroke-width="2" stroke-linejoin="round"/>
<text x="512" y="114" fill="#c10230" font-size="11" text-anchor="middle" font-weight="bold">!</text>
<text x="512" y="152" fill="#c10230" font-size="13" text-anchor="middle" font-weight="bold">Acetate</text>
<rect x="434" y="162" width="156" height="20" rx="6" fill="#fbeaea"/>
<text x="512" y="175" fill="#c10230" font-size="8.5" text-anchor="middle" font-weight="bold">historical — avoid today</text>
<g font-size="9" fill="#1c2b39" text-anchor="middle">
  <text x="512" y="204">· nausea &amp; vomiting</text>
  <text x="512" y="220">· hypotension</text>
  <text x="512" y="236">· headaches</text>
  <text x="512" y="252">· hypoxemia</text>
  <text x="512" y="268">· negative inotrope</text>
</g>
<text x="512" y="292" fill="#8a5560" font-size="8" text-anchor="middle">survives only in legacy systems</text>

<!-- ============ bottom line ============ -->
<rect x="40" y="320" width="576" height="56" rx="12" fill="#ffffff" stroke="#e3e8ee" filter="url(#ac9Sh)"/>
<text x="56" y="342" fill="#022851" font-size="11.5" font-weight="bold">Bottom line</text>
<text x="56" y="358" fill="#5b6b7a" font-size="9">bicarbonate-buffered solutions are the standard for critically ill CRRT patients — citrate only with close</text>
<text x="56" y="365" fill="#5b6b7a" font-size="9">ionized-calcium checks and good hepatic function — and acetate belongs in the history books</text>

<text x="616" y="410" fill="#9aa7b4" font-size="9" text-anchor="end">CNN Exam Prep · Acute Therapies</text>
</svg>