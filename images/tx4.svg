<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="tx4Head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#022851"/><stop offset="1" stop-color="#003a6b"/></linearGradient>
  <marker id="tx4Arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#022851"/></marker>
  <filter id="tx4Sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#022851" flood-opacity="0.18"/></filter>
</defs>
<rect width="640" height="420" fill="#f7fafc"/>
<rect width="640" height="56" fill="url(#tx4Head)"/>
<rect y="56" width="640" height="4" fill="#ffbf00"/>
<text x="24" y="27" fill="#ffffff" font-size="17" font-weight="bold">Types of Rejection</text>
<text x="24" y="45" fill="#ffbf00" font-size="11" letter-spacing="0.5">A race against the immune system — timing tells you the type</text>

<!-- ============ timeline axis ============ -->
<line x1="60" y1="94" x2="600" y2="94" stroke="#5b6b7a" stroke-width="2" marker-end="url(#tx4Arr)"/>
<text x="612" y="110" fill="#5b6b7a" font-size="9" text-anchor="end">time after transplant →</text>
<circle cx="120" cy="94" r="6" fill="#c10230"/>
<circle cx="250" cy="94" r="6" fill="#b8860b"/>
<circle cx="370" cy="94" r="6" fill="#0090b8"/>
<circle cx="520" cy="94" r="6" fill="#7a3b8f"/>
<text x="120" y="82" fill="#c10230" font-size="9" text-anchor="middle" font-weight="bold">minutes–hours</text>
<text x="250" y="82" fill="#b8860b" font-size="9" text-anchor="middle" font-weight="bold">24 h – 7 days</text>
<text x="370" y="82" fill="#0090b8" font-size="9" text-anchor="middle" font-weight="bold">24 h – days</text>
<text x="520" y="82" fill="#7a3b8f" font-size="9" text-anchor="middle" font-weight="bold">months – years</text>

<!-- ============ HYPERACUTE ============ -->
<g filter="url(#tx4Sh)">
  <rect x="36" y="122" width="272" height="120" rx="12" fill="#ffffff" stroke="#c10230" stroke-width="1.5"/>
</g>
<rect x="36" y="122" width="272" height="26" rx="12" fill="#c10230"/><rect x="36" y="136" width="272" height="12" fill="#c10230"/>
<text x="172" y="140" fill="#ffffff" font-size="10.5" text-anchor="middle" font-weight="bold">HYPERACUTE — minutes to hours</text>
<g font-size="9.5" fill="#1c2b39">
  <text x="52" y="166">· preformed anti-donor antibodies</text>
</g>
<text x="52" y="180" fill="#5b6b7a" font-size="9">complement cascade → vessel thrombosis,</text>
<text x="52" y="194" fill="#5b6b7a" font-size="9">graft turns necrotic on the table</text>
<rect x="52" y="204" width="240" height="24" rx="6" fill="#ffe3e6"/>
<text x="172" y="220" fill="#c10230" font-size="9" text-anchor="middle" font-weight="bold">IRREVERSIBLE → nephrectomy</text>

<!-- ============ ACCELERATED ============ -->
<g filter="url(#tx4Sh)">
  <rect x="324" y="122" width="280" height="120" rx="12" fill="#ffffff" stroke="#b8860b" stroke-width="1.5"/>
</g>
<rect x="324" y="122" width="280" height="26" rx="12" fill="#b8860b"/><rect x="324" y="136" width="280" height="12" fill="#b8860b"/>
<text x="464" y="140" fill="#ffffff" font-size="10.5" text-anchor="middle" font-weight="bold">ACCELERATED — 24 h to 7 days</text>
<g font-size="9.5" fill="#1c2b39">
  <text x="340" y="166">· rapid, early rejection episode</text>
  <text x="340" y="184">· sits between hyperacute and acute</text>
  <text x="340" y="202">· treat aggressively — pulse steroids,</text>
  <text x="340" y="215">lymphocyte-depleting antibody</text>
</g>

<!-- ============ ACUTE ============ -->
<g filter="url(#tx4Sh)">
  <rect x="36" y="256" width="272" height="120" rx="12" fill="#ffffff" stroke="#0090b8" stroke-width="1.5"/>
</g>
<rect x="36" y="256" width="272" height="26" rx="12" fill="#0090b8"/><rect x="36" y="270" width="272" height="12" fill="#0090b8"/>
<text x="172" y="274" fill="#ffffff" font-size="10.5" text-anchor="middle" font-weight="bold">ACUTE — 24 h to days, most common</text>
<text x="52" y="300" fill="#1c2b39" font-size="9.5" font-weight="bold">T-cell mediated (TCMR)</text>
<text x="52" y="316" fill="#5b6b7a" font-size="9">most common — 15–25% of recipients</text>
<text x="52" y="330" fill="#5b6b7a" font-size="9">within the first 3 months</text>
<text x="52" y="350" fill="#1c2b39" font-size="9.5" font-weight="bold">Antibody-mediated (AMR)</text>
<text x="52" y="366" fill="#5b6b7a" font-size="9">donor-specific antibodies; worse prognosis</text>

<!-- ============ CHRONIC ============ -->
<g filter="url(#tx4Sh)">
  <rect x="324" y="256" width="280" height="120" rx="12" fill="#ffffff" stroke="#7a3b8f" stroke-width="1.5"/>
</g>
<rect x="324" y="256" width="280" height="26" rx="12" fill="#7a3b8f"/><rect x="324" y="270" width="280" height="12" fill="#7a3b8f"/>
<text x="464" y="274" fill="#ffffff" font-size="10.5" text-anchor="middle" font-weight="bold">CHRONIC (antibody-mediated)</text>
<text x="340" y="300" fill="#1c2b39" font-size="9.5" font-weight="bold">#1 cause of graft failure in year 1</text>
<text x="340" y="316" fill="#5b6b7a" font-size="9">interstitial fibrosis + tubular atrophy,</text>
<text x="340" y="330" fill="#5b6b7a" font-size="9">graded I – III on biopsy</text>
<text x="340" y="350" fill="#1c2b39" font-size="9.5" font-weight="bold">Long-term graft loss driver:</text>
<text x="340" y="366" fill="#5b6b7a" font-size="9">fibrosis / tubular atrophy from many causes</text>

<text x="616" y="410" fill="#9aa7b4" font-size="9" text-anchor="end">CNN Exam Prep · Transplant</text>
</svg>