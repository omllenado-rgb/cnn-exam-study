<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="kd3Head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#022851"/><stop offset="1" stop-color="#003a6b"/></linearGradient>
  <linearGradient id="kd3Muscle" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d3625c"/><stop offset="1" stop-color="#a33b38"/></linearGradient>
  <marker id="kd3Arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#022851"/></marker>
  <marker id="kd3ArrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c10230"/></marker>
  <filter id="kd3Sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#022851" flood-opacity="0.18"/></filter>
</defs>
<rect width="640" height="420" fill="#f7fafc"/>
<rect width="640" height="56" fill="url(#kd3Head)"/>
<rect y="56" width="640" height="4" fill="#ffbf00"/>
<text x="24" y="27" fill="#ffffff" font-size="17" font-weight="bold">Rhabdomyolysis &amp; Acute Interstitial Nephritis</text>
<text x="24" y="45" fill="#ffbf00" font-size="11" letter-spacing="0.5">Muscle breakdown · drug-driven inflammation</text>

<!-- ============ RHABDO (left) ============ -->
<rect x="28" y="72" width="292" height="290" rx="12" fill="#ffffff" stroke="#e3e8ee" filter="url(#kd3Sh)"/>
<text x="44" y="94" fill="#c10230" font-size="12.5" font-weight="bold">Rhabdomyolysis — 7–10% of AKIs</text>
<!-- muscle fiber breaking -->
<g filter="url(#kd3Sh)">
  <rect x="46" y="106" width="150" height="40" rx="10" fill="url(#kd3Muscle)"/>
</g>
<path d="M112 106 l14 20 l-14 8 l16 18" fill="none" stroke="#f7fafc" stroke-width="3" stroke-linecap="round"/>
<text x="121" y="162" fill="#8a2f2b" font-size="9.5" text-anchor="middle" font-weight="bold">skeletal muscle breaks down</text>
<!-- myoglobin arrow -->
<line x1="121" y1="170" x2="121" y2="192" stroke="#c10230" stroke-width="2.5" marker-end="url(#kd3ArrRed)"/>
<circle cx="108" cy="202" r="5" fill="#7a3b8f"/><circle cx="122" cy="208" r="4" fill="#7a3b8f" opacity="0.7"/><circle cx="134" cy="201" r="4.5" fill="#7a3b8f" opacity="0.85"/>
<text x="104" y="220" fill="#7a3b8f" font-size="9.5" text-anchor="middle" font-weight="bold">myoglobin → casts</text>
<text x="104" y="233" fill="#7a3b8f" font-size="9.5" text-anchor="middle" font-weight="bold">obstruct tubules</text>
<!-- tea urine vial -->
<path d="M206 196 v26 a10 10 0 0 0 20 0 v-26 z" fill="#8a5a2b" stroke="#6b451f" stroke-width="1.5"/>
<rect x="204" y="190" width="24" height="7" rx="2" fill="#6b451f"/>
<text x="216" y="240" fill="#6b451f" font-size="8.5" text-anchor="middle" font-weight="bold">tea-colored urine</text>
<!-- lab thresholds -->
<rect x="44" y="252" width="240" height="44" rx="8" fill="#fff3f4" stroke="#c10230" stroke-width="1"/>
<text x="56" y="270" fill="#c10230" font-size="9.5" font-weight="bold">Labs: myoglobin &gt; 15,000 µg/L</text>
<text x="56" y="288" fill="#c10230" font-size="9.5" font-weight="bold">CK &gt; 5,000 IU/L</text>
<!-- treatment -->
<rect x="44" y="306" width="240" height="44" rx="8" fill="#e2f2e6" stroke="#00573f" stroke-width="1"/>
<text x="56" y="324" fill="#00573f" font-size="9.5" font-weight="bold">Treat: aggressive fluids 200–300 mL/hr</text>
<text x="56" y="342" fill="#00573f" font-size="9.5" font-weight="bold">+ alkalinize urine to pH &gt; 6.5</text>

<!-- ============ AIN (right) ============ -->
<rect x="332" y="72" width="288" height="290" rx="12" fill="#ffffff" stroke="#e3e8ee" filter="url(#kd3Sh)"/>
<text x="348" y="94" fill="#7a3b8f" font-size="13" font-weight="bold">Acute Interstitial Nephritis (AIN)</text>
<!-- tubule cross-section with inflammatory cells -->
<g filter="url(#kd3Sh)">
  <rect x="348" y="106" width="256" height="120" rx="10" fill="#fdf4f0" stroke="#d9b8a8" stroke-width="1.2"/>
</g>
<!-- cross-section of tubules with inflammatory infiltrate -->
<g>
  <circle cx="392" cy="140" r="16" fill="#f7d7c4" stroke="#c97b62" stroke-width="2"/>
  <circle cx="452" cy="140" r="16" fill="#f7d7c4" stroke="#c97b62" stroke-width="2"/>
  <circle cx="512" cy="140" r="16" fill="#f7d7c4" stroke="#c97b62" stroke-width="2"/>
  <circle cx="392" cy="196" r="16" fill="#f7d7c4" stroke="#c97b62" stroke-width="2"/>
  <circle cx="452" cy="196" r="16" fill="#f7d7c4" stroke="#c97b62" stroke-width="2"/>
  <circle cx="512" cy="196" r="16" fill="#f7d7c4" stroke="#c97b62" stroke-width="2"/>
  <circle cx="392" cy="140" r="6" fill="#ffffff"/><circle cx="452" cy="140" r="6" fill="#ffffff"/><circle cx="512" cy="140" r="6" fill="#ffffff"/>
  <circle cx="392" cy="196" r="6" fill="#ffffff"/><circle cx="452" cy="196" r="6" fill="#ffffff"/><circle cx="512" cy="196" r="6" fill="#ffffff"/>
</g>
<!-- inflammatory cells between tubules -->
<g fill="#7a3b8f">
  <circle cx="422" cy="132" r="3"/><circle cx="426" cy="150" r="2.5"/><circle cx="482" cy="128" r="3"/>
  <circle cx="484" cy="152" r="2.5"/><circle cx="424" cy="188" r="3"/><circle cx="420" cy="204" r="2.5"/>
  <circle cx="482" cy="192" r="3"/><circle cx="486" cy="206" r="2.5"/><circle cx="540" cy="144" r="2.5"/>
  <circle cx="540" cy="192" r="3"/><circle cx="366" cy="168" r="2.5"/>
</g>
<text x="600" y="120" fill="#7a3b8f" font-size="8" text-anchor="end" font-weight="bold">inflammatory cells · between tubules</text>
<!-- cause -->
<rect x="348" y="240" width="256" height="42" rx="8" fill="#f3ecf8" stroke="#7a3b8f" stroke-width="1"/>
<text x="360" y="258" fill="#5a2f73" font-size="9.5" font-weight="bold">&gt; 75% = drug hypersensitivity</text>
<text x="360" y="274" fill="#5b6b7a" font-size="9">NSAIDs · antibiotics · PPIs</text>
<!-- treatment -->
<rect x="348" y="294" width="256" height="56" rx="8" fill="#fff3f4" stroke="#c10230" stroke-width="1.2"/>
<text x="360" y="314" fill="#c10230" font-size="9.5" font-weight="bold">Most important treatment:</text>
<text x="360" y="330" fill="#1c2b39" font-size="9.5" font-weight="bold">STOP the offending agent</text>
<text x="360" y="344" fill="#5b6b7a" font-size="8.5">corticosteroids sometimes used — efficacy questioned</text>

<text x="320" y="386" fill="#022851" font-size="10.5" text-anchor="middle" font-weight="bold">Both cause intrarenal AKI — but one starts in muscle, the other between the tubules</text>
<text x="616" y="414" fill="#9aa7b4" font-size="9" text-anchor="end">CNN Exam Prep · Kidney Disease</text>
</svg>