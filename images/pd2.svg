<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="pd2Head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#022851"/><stop offset="1" stop-color="#003a6b"/></linearGradient>
  <marker id="pd2Arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#022851"/></marker>
  <filter id="pd2Sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#022851" flood-opacity="0.18"/></filter>
</defs>
<rect width="640" height="420" fill="#f7fafc"/>
<rect width="640" height="56" fill="url(#pd2Head)"/>
<rect y="56" width="640" height="4" fill="#ffbf00"/>
<text x="24" y="27" fill="#ffffff" font-size="17" font-weight="bold">Exit-Site Care &amp; Infection</text>
<text x="24" y="45" fill="#ffbf00" font-size="11" letter-spacing="0.5">Daily routine · ISPD classification · S. aureus &amp; Pseudomonas</text>

<!-- ============ routine care timeline (left) ============ -->
<rect x="36" y="70" width="300" height="170" rx="12" fill="#ffffff" stroke="#e3e8ee" filter="url(#pd2Sh)"/>
<text x="52" y="92" fill="#022851" font-size="12.5" font-weight="bold">Routine exit-site care</text>
<!-- timeline -->
<line x1="60" y1="122" x2="312" y2="122" stroke="#e3e8ee" stroke-width="3"/>
<circle cx="76" cy="122" r="8" fill="#022851"/>
<text x="76" y="144" fill="#022851" font-size="8.5" text-anchor="middle" font-weight="bold">implant</text>
<circle cx="180" cy="122" r="8" fill="#ffbf00"/>
<text x="180" y="144" fill="#8a6d1b" font-size="8.5" text-anchor="middle" font-weight="bold">2–3 wks healing</text>
<circle cx="288" cy="122" r="8" fill="#00573f"/>
<text x="288" y="144" fill="#00573f" font-size="8.5" text-anchor="middle" font-weight="bold">care begins</text>
<text x="288" y="110" fill="#5b6b7a" font-size="7.5" text-anchor="middle">once the site is healed</text>
<!-- shower icon + text -->
<g transform="translate(64,166)">
  <path d="M0 14 V4 q0 -6 6 -6 t6 6" fill="none" stroke="#0090b8" stroke-width="2"/>
  <path d="M-4 6 h20" stroke="#0090b8" stroke-width="2" stroke-linecap="round"/>
  <g stroke="#0090b8" stroke-width="1.4" stroke-linecap="round">
    <line x1="-2" y1="10" x2="-4" y2="14"/><line x1="2" y1="10" x2="1" y2="15"/>
    <line x1="6" y1="10" x2="6" y2="15"/><line x1="10" y1="10" x2="11" y2="15"/><line x1="14" y1="10" x2="16" y2="14"/>
  </g>
</g>
<text x="98" y="172" fill="#1c2b39" font-size="9.5" font-weight="bold">Shower daily — cleanse around the exit site</text>
<text x="98" y="186" fill="#5b6b7a" font-size="8.5">at least 2×/week even without showering</text>
<text x="98" y="204" fill="#1c2b39" font-size="9.5" font-weight="bold">Keep the site dry; avoid soaking until healed</text>
<text x="98" y="222" fill="#5b6b7a" font-size="8.5">inspect for redness, drainage, or tenderness</text>

<!-- ============ ISPD classification scale (right) ============ -->
<rect x="348" y="70" width="256" height="170" rx="12" fill="#ffffff" stroke="#e3e8ee" filter="url(#pd2Sh)"/>
<text x="364" y="92" fill="#022851" font-size="12.5" font-weight="bold">ISPD exit-site classification</text>
<g font-size="9.5" font-weight="bold">
  <rect x="364" y="102" width="224" height="22" rx="5" fill="#00573f"/>
  <text x="376" y="117" fill="#ffffff">Perfect — no redness, no drainage</text>
  <rect x="364" y="128" width="224" height="22" rx="5" fill="#4e8a4e"/>
  <text x="376" y="143" fill="#ffffff">Good — pink, ≤2 mm halo</text>
  <rect x="364" y="154" width="224" height="22" rx="5" fill="#ffbf00"/>
  <text x="376" y="169" fill="#5c4a00">Equivocal — watch closely</text>
  <rect x="364" y="180" width="224" height="22" rx="5" fill="#e07b39"/>
  <text x="376" y="195" fill="#ffffff">Chronic — crust / granulation tissue</text>
  <rect x="364" y="206" width="224" height="22" rx="5" fill="#c10230"/>
  <text x="376" y="221" fill="#ffffff">Acute — purulent drainage</text>
</g>
<text x="376" y="234" fill="#c10230" font-size="8" font-weight="bold">+ redness with a halo &gt; 13 mm</text>

<!-- ============ prophylaxis (bottom left) ============ -->
<rect x="36" y="252" width="300" height="130" rx="12" fill="#ffffff" stroke="#e3e8ee" filter="url(#pd2Sh)"/>
<text x="52" y="274" fill="#022851" font-size="12.5" font-weight="bold">S. aureus prophylaxis</text>
<g filter="url(#pd2Sh)">
  <rect x="52" y="286" width="60" height="72" rx="8" fill="#e9f1f8" stroke="#5b6b7a"/>
</g>
<g transform="translate(62,298)">
  <ellipse cx="22" cy="18" rx="14" ry="16" fill="#c9a0e8" stroke="#7a3b8f" stroke-width="1.2"/>
  <circle cx="16" cy="12" r="3" fill="#7a3b8f"/><circle cx="27" cy="14" r="3" fill="#7a3b8f"/>
  <circle cx="19" cy="24" r="3" fill="#7a3b8f"/><circle cx="30" cy="25" r="2.5" fill="#7a3b8f"/>
</g>
<text x="124" y="304" fill="#1c2b39" font-size="9.5" font-weight="bold">Daily topical antibiotic</text>
<text x="124" y="318" fill="#5b6b7a" font-size="9">mupirocin or gentamicin</text>
<text x="124" y="332" fill="#5b6b7a" font-size="9">to the exit site nostrils/skin</text>
<rect x="52" y="348" width="268" height="26" rx="6" fill="#ffe3e6" stroke="#c10230" stroke-width="1"/>
<text x="62" y="358" fill="#c10230" font-size="8.5" font-weight="bold">⚠ Mupirocin ointment must NEVER touch a</text>
<text x="62" y="369" fill="#c10230" font-size="8.5" font-weight="bold">polyurethane catheter — it cracks the tubing</text>

<!-- ============ treatment (bottom right) ============ -->
<rect x="348" y="252" width="256" height="130" rx="12" fill="#ffffff" stroke="#e3e8ee" filter="url(#pd2Sh)"/>
<text x="364" y="274" fill="#022851" font-size="12.5" font-weight="bold">Treating an infected site</text>
<text x="364" y="294" fill="#1c2b39" font-size="9.5" font-weight="bold">Usual organisms:</text>
<text x="364" y="308" fill="#c10230" font-size="9.5" font-weight="bold">S. aureus · P. aeruginosa</text>
<rect x="364" y="318" width="104" height="30" rx="6" fill="#e2f2e6"/>
<text x="416" y="331" fill="#00573f" font-size="8.5" text-anchor="middle" font-weight="bold">non-pseudomonal</text>
<text x="416" y="341" fill="#00573f" font-size="8" text-anchor="middle">antibiotics ≥ 2 weeks</text>
<rect x="474" y="318" width="104" height="30" rx="6" fill="#fdf3d1" stroke="#8a6d1b"/>
<text x="526" y="328" fill="#8a6d1b" font-size="8.5" text-anchor="middle" font-weight="bold">pseudomonal</text>
<text x="526" y="341" fill="#8a6d1b" font-size="8" text-anchor="middle">antibiotics 3 weeks</text>
<text x="364" y="368" fill="#1c2b39" font-size="9">Chronic / refractory → unroofing +</text>
<text x="364" y="380" fill="#c10230" font-size="9.5" font-weight="bold">subcutaneous cuff removal or new site</text>

<text x="320" y="398" fill="#022851" font-size="10.5" text-anchor="middle" font-weight="bold">A tender, purulent exit site is a peritonitis risk — treat fast, culture first, never delay</text>
<text x="616" y="412" fill="#9aa7b4" font-size="9" text-anchor="end">CNN Exam Prep · Peritoneal Dialysis</text>
</svg>