<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="ac8Head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#022851"/><stop offset="1" stop-color="#003a6b"/></linearGradient>
  <marker id="ac8Arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#022851"/></marker>
  <filter id="ac8Sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#022851" flood-opacity="0.18"/></filter>
</defs>
<rect width="640" height="420" fill="#f7fafc"/>
<rect width="640" height="56" fill="url(#ac8Head)"/>
<rect y="56" width="640" height="4" fill="#ffbf00"/>
<text x="24" y="27" fill="#ffffff" font-size="17" font-weight="bold">Sepsis-Induced AKI &amp; the Role of CRRT</text>
<text x="24" y="45" fill="#ffbf00" font-size="11" letter-spacing="0.5">support, stability, and timing</text>

<!-- ============ stats row ============ -->
<g>
  <rect x="48" y="76" width="172" height="52" rx="10" fill="#ffffff" stroke="#e3e8ee" filter="url(#ac8Sh)"/>
  <text x="64" y="100" fill="#022851" font-size="17" font-weight="bold">≈ 50%</text>
  <text x="64" y="116" fill="#5b6b7a" font-size="8.5">of septic patients develop AKI</text>
  <rect x="232" y="76" width="172" height="52" rx="10" fill="#ffffff" stroke="#e3e8ee" filter="url(#ac8Sh)"/>
  <text x="248" y="100" fill="#c10230" font-size="17" font-weight="bold">15–20%</text>
  <text x="248" y="116" fill="#8a5560" font-size="8">need some form of RRT</text>
  <rect x="416" y="76" width="176" height="52" rx="10" fill="#ffffff" stroke="#e3e8ee" filter="url(#ac8Sh)"/>
  <text x="432" y="100" fill="#8a6a00" font-size="17" font-weight="bold">50–60%</text>
  <text x="432" y="116" fill="#8a6a00" font-size="8">mortality when RRT is required</text>
</g>

<!-- ============ cascade (middle) ============ -->
<rect x="40" y="142" width="576" height="118" rx="12" fill="#ffffff" stroke="#e3e8ee" filter="url(#ac8Sh)"/>
<text x="56" y="164" fill="#022851" font-size="12" font-weight="bold">The cascade — and where CRRT helps</text>
<g text-anchor="middle" font-weight="bold">
  <rect x="56" y="172" width="88" height="34" rx="8" fill="#022851"/>
  <text x="100" y="193" fill="#ffffff" font-size="10">Sepsis</text>
  <rect x="176" y="172" width="112" height="34" rx="8" fill="#c10230"/>
  <text x="232" y="187" fill="#ffffff" font-size="9">inflammatory</text>
  <text x="232" y="198" fill="#ffbf00" font-size="9">cascade · cytokines</text>
  <rect x="320" y="172" width="112" height="34" rx="8" fill="#8a6a00"/>
  <text x="376" y="187" fill="#ffffff" font-size="9">AKI + fluid</text>
  <text x="376" y="198" fill="#ffd98f" font-size="9">overload</text>
  <rect x="464" y="172" width="136" height="34" rx="8" fill="#00573f"/>
  <text x="532" y="193" fill="#ffffff" font-size="10">CRRT steps in</text>
</g>
<line x1="144" y1="189" x2="172" y2="189" stroke="#022851" stroke-width="2" marker-end="url(#ac8Arr)"/>
<line x1="292" y1="189" x2="316" y2="189" stroke="#022851" stroke-width="2" marker-end="url(#ac8Arr)"/>
<line x1="436" y1="189" x2="460" y2="189" stroke="#022851" stroke-width="2" marker-end="url(#ac8Arr)"/>
<g font-size="8.5" fill="#1c2b39">
  <text x="532" y="220" text-anchor="middle" font-weight="bold">buys time:</text>
  <text x="532" y="232" text-anchor="middle">hemodynamic stability</text>
  <text x="532" y="244" text-anchor="middle">fluid overload control</text>
  <text x="532" y="256" text-anchor="middle">may blunt inflammation</text>
</g>
<text x="56" y="228" fill="#5b6b7a" font-size="8.5">roughly half of ICU patients with sepsis</text>
<text x="56" y="240" fill="#5b6b7a" font-size="8.5">lose kidney function — the inflamed</text>
<text x="56" y="252" fill="#5b6b7a" font-size="8.5">microvasculature shuts the tubules down</text>

<!-- ============ timing card (bottom) ============ -->
<rect x="40" y="274" width="576" height="90" rx="12" fill="#ffffff" stroke="#e3e8ee" filter="url(#ac8Sh)"/>
<text x="56" y="296" fill="#022851" font-size="12" font-weight="bold">When to start? No universal trigger — clinical judgment rules</text>
<g font-size="9" fill="#1c2b39">
  <text x="56" y="318">· classic indications still apply: refractory hyperkalemia, severe</text>
  <text x="68" y="330" fill="#5b6b7a" font-size="8.5">acidosis, fluid overload unresponsive to diuretics, uremic complications</text>
  <text x="56" y="350">· follow the trajectory — worsening creatinine, oliguria, rising lactate</text>
</g>
<rect x="428" y="314" width="172" height="42" rx="8" fill="#fbeaea"/>
<text x="514" y="330" fill="#c10230" font-size="8.5" text-anchor="middle" font-weight="bold">Don't start too early:</text>
<text x="514" y="342" fill="#8a5560" font-size="7.5" text-anchor="middle">antibiotics and nutrition wash out</text>

<text x="320" y="384" fill="#022851" font-size="11" text-anchor="middle" font-weight="bold">CRRT supports the kidneys and steadies the patient — it does not cure sepsis</text>
<text x="616" y="410" fill="#9aa7b4" font-size="9" text-anchor="end">CNN Exam Prep · Acute Therapies</text>
</svg>