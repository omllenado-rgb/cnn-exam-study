<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="hd6Head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#022851"/><stop offset="1" stop-color="#003a6b"/></linearGradient>
  <linearGradient id="hd6Vial" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4d5bc"/><stop offset="1" stop-color="#e8b894"/></linearGradient>
  <marker id="hd6Arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#022851"/></marker>
  <marker id="hd6ArrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c10230"/></marker>
  <filter id="hd6Sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#022851" flood-opacity="0.18"/></filter>
</defs>
<rect width="640" height="420" fill="#f7fafc"/>
<rect width="640" height="56" fill="url(#hd6Head)"/>
<rect y="56" width="640" height="4" fill="#ffbf00"/>
<text x="24" y="27" fill="#ffffff" font-size="17" font-weight="bold">Dialysis Adequacy: Kt/V &amp; URR</text>
<text x="24" y="45" fill="#ffbf00" font-size="11" letter-spacing="0.5">Was this treatment enough?</text>

<!-- ============ pre/post dialyzer comparison (left) ============ -->
<rect x="40" y="76" width="280" height="200" rx="12" fill="#ffffff" stroke="#e3e8ee" filter="url(#hd6Sh)"/>
<text x="56" y="98" fill="#022851" font-size="12" font-weight="bold">Urea before vs. after one pass</text>
<!-- pre vial -->
<g filter="url(#hd6Sh)">
  <path d="M78 130 v78 a12 12 0 0 0 24 0 v-78 z" fill="url(#hd6Vial)" stroke="#c10230" stroke-width="2"/>
</g>
<rect x="76" y="122" width="28" height="10" rx="2" fill="#c10230"/>
<rect x="82" y="140" width="16" height="62" rx="8" fill="#c10230"/>
<circle cx="90" cy="152" r="2" fill="#ffffff" opacity="0.6"/><circle cx="90" cy="166" r="2" fill="#ffffff" opacity="0.6"/><circle cx="90" cy="180" r="2" fill="#ffffff" opacity="0.6"/>
<text x="90" y="236" fill="#c10230" font-size="10" text-anchor="middle" font-weight="bold">PRE BUN</text>
<text x="90" y="248" fill="#5b6b7a" font-size="9" text-anchor="middle">high urea</text>
<!-- arrow through dialyzer -->
<line x1="120" y1="168" x2="164" y2="168" stroke="#c10230" stroke-width="3" marker-end="url(#hd6ArrRed)"/>
<g filter="url(#hd6Sh)">
  <rect x="166" y="146" width="44" height="44" rx="8" fill="#e9f1f8" stroke="#5b6b7a" stroke-width="1.5"/>
</g>
<line x1="172" y1="152" x2="172" y2="184" stroke="#ffbf00" stroke-width="2"/>
<line x1="182" y1="152" x2="182" y2="184" stroke="#ffbf00" stroke-width="2"/>
<line x1="192" y1="152" x2="192" y2="184" stroke="#ffbf00" stroke-width="2"/>
<line x1="202" y1="152" x2="202" y2="184" stroke="#ffbf00" stroke-width="2"/>
<text x="188" y="204" fill="#5b6b7a" font-size="8" text-anchor="middle">dialyzer</text>
<!-- post vial -->
<line x1="214" y1="168" x2="242" y2="168" stroke="#c10230" stroke-width="3" marker-end="url(#hd6ArrRed)"/>
<g filter="url(#hd6Sh)">
  <path d="M244 130 v78 a12 12 0 0 0 24 0 v-78 z" fill="url(#hd6Vial)" stroke="#022851" stroke-width="2"/>
</g>
<rect x="242" y="122" width="28" height="10" rx="2" fill="#022851"/>
<rect x="250" y="176" width="12" height="26" rx="6" fill="#c10230" opacity="0.55"/>
<text x="256" y="236" fill="#022851" font-size="10" text-anchor="middle" font-weight="bold">POST BUN</text>
<text x="256" y="248" fill="#5b6b7a" font-size="9" text-anchor="middle">much lower urea</text>
<!-- percent cleared bar -->
<rect x="56" y="258" width="248" height="8" rx="4" fill="#eef4f8"/>
<rect x="56" y="258" width="180" height="8" rx="4" fill="#00573f"/>
<text x="180" y="282" fill="#00573f" font-size="10" text-anchor="middle" font-weight="bold">≈ 70% cleared — a strong URR</text>

<!-- ============ Kt/V formula (right) ============ -->
<g filter="url(#hd6Sh)">
  <rect x="348" y="76" width="268" height="124" rx="12" fill="#022851"/>
</g>
<rect x="348" y="76" width="268" height="30" rx="12" fill="#0c3a63"/>
<rect x="348" y="94" width="268" height="12" fill="#0c3a63"/>
<text x="482" y="97" fill="#ffbf00" font-size="11.5" text-anchor="middle" font-weight="bold">Kt/V — dose of dialysis</text>
<text x="364" y="140" fill="#ffffff" font-size="17" font-style="italic" font-weight="bold">K × t / V</text>
<text x="364" y="160" fill="#cfe0f2" font-size="8.5">urea cleared (mL/min × min) ÷</text>
<text x="364" y="172" fill="#cfe0f2" font-size="8.5">urea distribution volume V</text>
<circle cx="556" cy="150" r="29" fill="none" stroke="#ffbf00" stroke-width="3"/>
<text x="556" y="147" fill="#ffbf00" font-size="13" text-anchor="middle" font-weight="bold">1.4</text>
<text x="556" y="160" fill="#ffbf00" font-size="7" text-anchor="middle">KDOQI target</text>
<text x="482" y="190" fill="#cfe0f2" font-size="7.5" text-anchor="middle">1.4 per treatment (3×/week) · 2.3 for more frequent schedules</text>

<!-- ============ URR (right lower) ============ -->
<g filter="url(#hd6Sh)">
  <rect x="348" y="208" width="268" height="76" rx="12" fill="#ffffff" stroke="#e3e8ee"/>
</g>
<text x="364" y="230" fill="#022851" font-size="12" font-weight="bold">URR — urea reduction ratio</text>
<text x="364" y="254" fill="#1c2b39" font-size="11" font-style="italic">(Pre − Post) / Pre × 100%</text>
<text x="364" y="274" fill="#5b6b7a" font-size="9.5">simple bedside check of the same idea</text>

<!-- ============ what you can turn up (bottom) ============ -->
<rect x="40" y="292" width="576" height="72" rx="12" fill="#ffffff" stroke="#e3e8ee" filter="url(#hd6Sh)"/>
<text x="56" y="314" fill="#022851" font-size="12" font-weight="bold">Four dials that raise adequacy</text>
<g text-anchor="middle" font-size="9.5" fill="#1c2b39" font-weight="bold">
  <text x="110" y="340">Blood flow rate</text>
  <text x="250" y="340">Dialysate flow rate</text>
  <text x="396" y="340">Treatment time</text>
  <text x="530" y="340">Dialyzer size (KoA)</text>
</g>
<g stroke="#ffbf00" stroke-width="2">
  <line x1="80" y1="348" x2="140" y2="348"/><line x1="220" y1="348" x2="280" y2="348"/>
  <line x1="366" y1="348" x2="426" y2="348"/><line x1="500" y1="348" x2="594" y2="348"/>
</g>
<text x="110" y="356" fill="#5b6b7a" font-size="7.5" text-anchor="middle">pump speed</text>
<text x="250" y="356" fill="#5b6b7a" font-size="7.5" text-anchor="middle">Qd</text>
<text x="396" y="356" fill="#5b6b7a" font-size="7.5" text-anchor="middle">longer sessions</text>
<text x="530" y="356" fill="#5b6b7a" font-size="7.5" text-anchor="middle">bigger membrane</text>

<text x="320" y="390" fill="#c10230" font-size="10" text-anchor="middle" font-weight="bold">Watch out: very small patients can show falsely high Kt/V — less muscle mass means a smaller V</text>
<text x="616" y="412" fill="#9aa7b4" font-size="9" text-anchor="end">CNN Exam Prep · Hemodialysis</text>
</svg>