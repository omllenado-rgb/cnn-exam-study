<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="tx5Head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#022851"/><stop offset="1" stop-color="#003a6b"/></linearGradient>
  <marker id="tx5Arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#022851"/></marker>
  <filter id="tx5Sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#022851" flood-opacity="0.18"/></filter>
</defs>
<rect width="640" height="420" fill="#f7fafc"/>
<rect width="640" height="56" fill="url(#tx5Head)"/>
<rect y="56" width="640" height="4" fill="#ffbf00"/>
<text x="24" y="27" fill="#ffffff" font-size="17" font-weight="bold">Immunosuppression — Induction Agents</text>
<text x="24" y="45" fill="#ffbf00" font-size="11" letter-spacing="0.5">Given at transplant to prevent early rejection</text>

<!-- ============ big stat (left) ============ -->
<g filter="url(#tx5Sh)">
  <rect x="36" y="74" width="180" height="150" rx="12" fill="#022851"/>
</g>
<text x="126" y="98" fill="#ffbf00" font-size="10.5" text-anchor="middle" font-weight="bold">HOW COMMON?</text>
<text x="126" y="146" fill="#ffffff" font-size="42" text-anchor="middle" font-weight="bold">&gt;75%</text>
<text x="126" y="170" fill="#cfe0f2" font-size="9" text-anchor="middle">of recipients get a</text>
<text x="126" y="184" fill="#cfe0f2" font-size="9" text-anchor="middle">lymphocyte-depleting agent</text>
<rect x="52" y="188" width="148" height="6" rx="3" fill="#0c3a63"/>
<rect x="52" y="188" width="112" height="6" rx="3" fill="#ffbf00"/>

<!-- ============ agents (middle/right) ============ -->
<!-- rATG -->
<g filter="url(#tx5Sh)">
  <rect x="232" y="74" width="372" height="86" rx="12" fill="#ffffff" stroke="#00573f" stroke-width="1.5"/>
</g>
<!-- Y antibody icon -->
<path d="M256 116 l10 8 v10 M256 116 l-10 8 v10 M256 116 v-12" stroke="#00573f" stroke-width="3" fill="none" stroke-linecap="round"/>
<circle cx="246" cy="138" r="4" fill="#00573f"/><circle cx="266" cy="138" r="4" fill="#00573f"/>
<text x="280" y="96" fill="#00573f" font-size="11.5" font-weight="bold">Antithymocyte globulin (rATG)</text>
<text x="280" y="113" fill="#1c2b39" font-size="9.5">polyclonal antibody → broad T-cell depletion</text>
<text x="280" y="130" fill="#5b6b7a" font-size="9">central line only · filter through a 0.22-micron filter</text>
<text x="280" y="147" fill="#5b6b7a" font-size="9">(cytokine-release / infusion reactions)</text>
<!-- alemtuzumab -->
<g filter="url(#tx5Sh)">
  <rect x="232" y="172" width="372" height="60" rx="12" fill="#ffffff" stroke="#0090b8" stroke-width="1.5"/>
</g>
<path d="M246 200 l10 8 v10 M246 200 l-10 8 v10 M246 200 v-12" stroke="#0090b8" stroke-width="3" fill="none" stroke-linecap="round"/>
<circle cx="236" cy="222" r="4" fill="#0090b8"/><circle cx="256" cy="222" r="4" fill="#0090b8"/>
<text x="280" y="190" fill="#0090b8" font-size="11.5" font-weight="bold">Alemtuzumab (Campath)</text>
<text x="280" y="207" fill="#1c2b39" font-size="9.5">monoclonal antibody → binds CD52 on B &amp; T cells</text>
<text x="280" y="222" fill="#5b6b7a" font-size="9">profound single-dose depletion</text>
<g filter="url(#tx5Sh)">
  <rect x="516" y="198" width="80" height="26" rx="8" fill="#022851"/>
</g>
<text x="556" y="215" fill="#ffbf00" font-size="10" text-anchor="middle" font-weight="bold">one 30 mg dose</text>

<!-- ============ bottom row: steroids + risk factors ============ -->
<g filter="url(#tx5Sh)">
  <rect x="36" y="240" width="272" height="110" rx="12" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.5"/>
</g>
<rect x="36" y="240" width="272" height="24" rx="12" fill="#b8860b"/><rect x="36" y="252" width="272" height="12" fill="#b8860b"/>
<text x="172" y="257" fill="#ffffff" font-size="10" text-anchor="middle" font-weight="bold">EVERYONE GETS GLUCOCORTICOIDS</text>
<text x="52" y="298" fill="#1c2b39" font-size="9.5">high-dose steroids at induction</text>
<text x="52" y="316" fill="#5b6b7a" font-size="9">blunt the inflammatory response of</text>
<text x="52" y="330" fill="#5b6b7a" font-size="9">surgery and early allorecognition</text>
<g filter="url(#tx5Sh)">
  <rect x="324" y="240" width="280" height="110" rx="12" fill="#ffffff" stroke="#e3e8ee"/>
</g>
<text x="348" y="262" fill="#022851" font-size="10.5" font-weight="bold">What tips the choice toward depleting agents:</text>
<g font-size="9" fill="#5b6b7a">
  <text x="348" y="284">· donor-specific antibodies (DSA) present</text>
  <text x="348" y="302">· HLA mismatch burden</text>
  <text x="348" y="320">· delayed graft function expected</text>
</g>
<text x="348" y="338" fill="#00573f" font-size="8.5" font-weight="bold">low-risk patients may get non-depleting agents or none</text>

<text x="616" y="410" fill="#9aa7b4" font-size="9" text-anchor="end">CNN Exam Prep · Transplant</text>
</svg>