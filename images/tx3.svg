<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="tx3Head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#022851"/><stop offset="1" stop-color="#003a6b"/></linearGradient>
  <marker id="tx3Arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#022851"/></marker>
  <filter id="tx3Sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#022851" flood-opacity="0.18"/></filter>
</defs>
<rect width="640" height="420" fill="#f7fafc"/>
<rect width="640" height="56" fill="url(#tx3Head)"/>
<rect y="56" width="640" height="4" fill="#ffbf00"/>
<text x="24" y="27" fill="#ffffff" font-size="17" font-weight="bold">Transplant Candidate Evaluation</text>
<text x="24" y="45" fill="#ffbf00" font-size="11" letter-spacing="0.5">Whole-person workup · contraindications · psychosocial</text>

<!-- ============ workup grid (left) ============ -->
<rect x="36" y="74" width="312" height="238" rx="12" fill="#ffffff" stroke="#e3e8ee" filter="url(#tx3Sh)"/>
<text x="52" y="96" fill="#022851" font-size="12" font-weight="bold">Comprehensive evaluation</text>
<g font-size="9.5" fill="#1c2b39">
  <text x="52" y="120" font-weight="bold" fill="#c10230">❤ Cardiovascular</text>
  <text x="200" y="120" font-weight="bold" fill="#7a3b8f">🫁 Pulmonary</text>
  <text x="52" y="140" fill="#5b6b7a" font-size="8.5">leading cause of death post-tx</text>
  <text x="200" y="140" fill="#5b6b7a" font-size="8.5">incl. TB screening</text>
</g>
<g font-size="9.5" fill="#1c2b39">
  <text x="52" y="164" font-weight="bold" fill="#0090b8">🧠 Neurologic</text>
  <text x="200" y="164" font-weight="bold" fill="#00573f">🫄 GI</text>
  <text x="200" y="184" fill="#5b6b7a" font-size="8.5">incl. colonoscopy</text>
  <text x="52" y="184" fill="#5b6b7a" font-size="8.5">seizure / cognition history</text>
  <text x="52" y="208" font-weight="bold" fill="#b8860b">🧪 Endocrine</text>
  <text x="200" y="208" font-weight="bold" fill="#c10230">🎗 Cancer screening</text>
  <text x="52" y="228" fill="#5b6b7a" font-size="8.5">thyroid, glucose, etc.</text>
  <text x="200" y="228" fill="#5b6b7a" font-size="8.5">age-appropriate (PSA, mammo…)</text>
</g>
<g filter="url(#tx3Sh)">
  <rect x="52" y="244" width="280" height="52" rx="8" fill="#eef4f8"/>
</g>
<text x="66" y="266" fill="#022851" font-size="9.5" font-weight="bold">Psychosocial assessment covers:</text>
<g font-size="8.5" fill="#5b6b7a">
  <text x="66" y="282">capacity to consent · adherence history ·</text>
  <text x="66" y="292">support system · finances for lifelong meds</text>
</g>

<!-- ============ contraindications (right) ============ -->
<!-- absolute -->
<g filter="url(#tx3Sh)">
  <rect x="364" y="74" width="240" height="112" rx="12" fill="#fff3f4" stroke="#c10230" stroke-width="1.5"/>
</g>
<rect x="364" y="74" width="240" height="26" rx="12" fill="#c10230"/><rect x="364" y="88" width="240" height="12" fill="#c10230"/>
<text x="484" y="92" fill="#ffffff" font-size="10.5" text-anchor="middle" font-weight="bold">ABSOLUTE — do not transplant</text>
<g font-size="9" fill="#1c2b39">
  <text x="380" y="118">· current malignancy</text>
  <text x="380" y="132" fill="#5b6b7a" font-size="8">  (except noninvasive skin cancer)</text>
  <text x="380" y="150">· untreated infection</text>
  <text x="380" y="168">· severe irreversible disease</text>
</g>
<!-- relative -->
<g filter="url(#tx3Sh)">
  <rect x="364" y="200" width="240" height="112" rx="12" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.5"/>
</g>
<rect x="364" y="200" width="240" height="26" rx="12" fill="#b8860b"/><rect x="364" y="214" width="240" height="12" fill="#b8860b"/>
<text x="484" y="218" fill="#ffffff" font-size="10.5" text-anchor="middle" font-weight="bold">RELATIVE — weigh risks</text>
<g font-size="9" fill="#1c2b39">
  <text x="380" y="244">· lack of social support</text>
  <text x="380" y="262">· homelessness</text>
  <text x="380" y="280">· BMI &gt; 35</text>
</g>

<!-- footer -->
<g filter="url(#tx3Sh)">
  <rect x="36" y="326" width="568" height="52" rx="12" fill="#022851"/>
</g>
<text x="52" y="348" fill="#ffbf00" font-size="10.5" font-weight="bold">Why so thorough?</text>
<text x="52" y="366" fill="#cfe0f2" font-size="9.5">lifelong immunosuppression amplifies every risk — cancer, infection, cardiac disease — so candidates must withstand it</text>
<text x="616" y="410" fill="#9aa7b4" font-size="9" text-anchor="end">CNN Exam Prep · Transplant</text>
</svg>