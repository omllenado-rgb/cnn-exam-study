<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="pd5Head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#022851"/><stop offset="1" stop-color="#003a6b"/></linearGradient>
  <marker id="pd5Arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#022851"/></marker>
  <filter id="pd5Sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#022851" flood-opacity="0.18"/></filter>
</defs>
<rect width="640" height="420" fill="#f7fafc"/>
<rect width="640" height="56" fill="url(#pd5Head)"/>
<rect y="56" width="640" height="4" fill="#ffbf00"/>
<text x="24" y="27" fill="#ffffff" font-size="17" font-weight="bold">PD Modalities: CAPD vs. CCPD</text>
<text x="24" y="45" fill="#ffbf00" font-size="11" letter-spacing="0.5">Manual exchanges · cycler nights · tidal &amp; intermittent PD</text>

<!-- ============ daily rhythm timelines (top) ============ -->
<rect x="36" y="70" width="568" height="172" rx="12" fill="#ffffff" stroke="#e3e8ee" filter="url(#pd5Sh)"/>
<text x="52" y="92" fill="#022851" font-size="12.5" font-weight="bold">Two ways to spend 24 hours on dialysis</text>

<!-- CAPD -->
<text x="52" y="120" fill="#00573f" font-size="10" font-weight="bold">CAPD — manual</text>
<rect x="160" y="108" width="200" height="24" rx="6" fill="#022851"/>
<rect x="360" y="108" width="100" height="24" rx="0" fill="#7fc4dd"/>
<rect x="460" y="108" width="100" height="24" rx="0" fill="#7fc4dd"/>
<rect x="560" y="108" width="44" height="24" rx="6" fill="#022851"/>
<circle cx="362" cy="120" r="4.5" fill="#ffbf00"/><circle cx="462" cy="120" r="4.5" fill="#ffbf00"/><circle cx="562" cy="120" r="4.5" fill="#ffbf00"/>
<circle cx="262" cy="120" r="4.5" fill="#ffbf00"/><circle cx="162" cy="120" r="4.5" fill="#ffbf00"/>
<text x="260" y="102" fill="#5b6b7a" font-size="7.5" text-anchor="middle">overnight dwell 8–10 h</text>
<text x="52" y="148" fill="#5b6b7a" font-size="8">4–5 exchanges/day, all by hand</text>
<text x="460" y="146" fill="#5b6b7a" font-size="7.5" text-anchor="middle">gold dots = exchanges</text>
<text x="460" y="102" fill="#5b6b7a" font-size="7.5" text-anchor="middle">daytime dwells 4–6 h</text>

<!-- CCPD -->
<text x="52" y="188" fill="#0a4f88" font-size="10" font-weight="bold">CCPD — cycler</text>
<rect x="160" y="176" width="52" height="24" rx="4" fill="#5aa8c9"/>
<rect x="216" y="176" width="50" height="24" rx="0" fill="#9fd0e2"/>
<rect x="270" y="176" width="50" height="24" rx="0" fill="#5aa8c9"/>
<rect x="324" y="176" width="52" height="24" rx="0" fill="#9fd0e2"/>
<rect x="322" y="176" width="2" height="24" fill="#ffffff"/>
<rect x="376" y="176" width="228" height="24" rx="6" fill="#bfe2f2"/>
<circle cx="216" cy="188" r="3" fill="#ffffff" opacity="0.8"/><circle cx="270" cy="188" r="3" fill="#ffffff" opacity="0.8"/><circle cx="378" cy="188" r="3" fill="#ffffff" opacity="0.8"/>
<text x="52" y="216" fill="#5b6b7a" font-size="8">3–5 cycler cycles · 1.5–3 h each</text>
<text x="490" y="216" fill="#5b6b7a" font-size="8" text-anchor="middle">single daytime dwell 12–16 h</text>
<text x="52" y="234" fill="#5b6b7a" font-size="8">machine does the work while you sleep</text>
<text x="490" y="236" fill="#8a6d1b" font-size="8" text-anchor="middle">last fill stays in all day</text>

<!-- ============ exchange mechanics (bottom left) ============ -->
<rect x="36" y="252" width="270" height="134" rx="12" fill="#ffffff" stroke="#e3e8ee" filter="url(#pd5Sh)"/>
<text x="52" y="274" fill="#022851" font-size="12.5" font-weight="bold">One exchange, by the clock</text>
<!-- infusion -->
<line x1="58" y1="292" x2="86" y2="292" stroke="#0090b8" stroke-width="4" marker-end="url(#pd5Arr)"/>
<text x="96" y="290" fill="#1c2b39" font-size="9" font-weight="bold">IN ≈ 10 min</text>
<text x="96" y="302" fill="#5b6b7a" font-size="8">per 2 L fill — gravity</text>
<!-- dwell -->
<circle cx="72" cy="322" r="10" fill="#fdf3d1" stroke="#8a6d1b" stroke-width="1.5"/>
<text x="72" y="326" fill="#8a6d1b" font-size="8" text-anchor="middle" font-weight="bold">4h</text>
<text x="96" y="320" fill="#1c2b39" font-size="9" font-weight="bold">DWELL</text>
<text x="96" y="334" fill="#5b6b7a" font-size="8">solute + fluid equilibrate</text>
<!-- drain -->
<line x1="58" y1="350" x2="86" y2="350" stroke="#0090b8" stroke-width="4" marker-end="url(#pd5Arr)"/>
<text x="96" y="348" fill="#1c2b39" font-size="9" font-weight="bold">OUT ≈ 20 min</text>
<text x="96" y="360" fill="#5b6b7a" font-size="8">drain to the bag</text>
<rect x="52" y="366" width="238" height="16" rx="5" fill="#e2f2e6"/>
<text x="171" y="378" fill="#00573f" font-size="8.5" text-anchor="middle" font-weight="bold">Breakpoint: stop draining at 95% out</text>

<!-- ============ variations (bottom right) ============ -->
<rect x="318" y="252" width="286" height="134" rx="12" fill="#ffffff" stroke="#e3e8ee" filter="url(#pd5Sh)"/>
<text x="334" y="274" fill="#022851" font-size="12.5" font-weight="bold">Two useful variations</text>
<!-- tidal -->
<g filter="url(#pd5Sh)">
  <rect x="334" y="284" width="254" height="46" rx="8" fill="#e9f1f8"/>
</g>
<rect x="346" y="294" width="90" height="14" rx="7" fill="#5aa8c9"/>
<rect x="346" y="300" width="62" height="8" rx="4" fill="#022851" opacity="0.7"/>
<text x="452" y="304" fill="#022851" font-size="9.5" font-weight="bold">Tidal PD — leave some fluid in</text>
<text x="452" y="318" fill="#5b6b7a" font-size="8">partial drain only → less drain pain,</text>
<text x="452" y="328" fill="#5b6b7a" font-size="8">fewer cycler alarms, better clearances</text>
<!-- intermittent -->
<g filter="url(#pd5Sh)">
  <rect x="346" y="338" width="242" height="40" rx="8" fill="#e2f2e6"/>
</g>
<rect x="358" y="348" width="70" height="10" rx="5" fill="#00573f"/>
<rect x="438" y="348" width="52" height="10" rx="5" fill="#c7d8cb"/>
<text x="466" y="362" fill="#00573f" font-size="9.5" font-weight="bold">Intermittent PD — dry periods</text>
<text x="358" y="378" fill="#5b6b7a" font-size="8">off-periods let the membrane rest — for high transporters</text>

<text x="616" y="412" fill="#9aa7b4" font-size="9" text-anchor="end">CNN Exam Prep · Peritoneal Dialysis</text>
</svg>