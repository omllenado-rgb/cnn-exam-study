<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="hd4Head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#022851"/><stop offset="1" stop-color="#003a6b"/></linearGradient>
  <linearGradient id="hd4Skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4d5bc"/><stop offset="1" stop-color="#e8b894"/></linearGradient>
  <linearGradient id="hd4Blood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e25563"/><stop offset="1" stop-color="#c10230"/></linearGradient>
  <marker id="hd4Arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#022851"/></marker>
  <marker id="hd4ArrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c10230"/></marker>
  <filter id="hd4Sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#022851" flood-opacity="0.18"/></filter>
</defs>
<rect width="640" height="420" fill="#f7fafc"/>
<rect width="640" height="56" fill="url(#hd4Head)"/>
<rect y="56" width="640" height="4" fill="#ffbf00"/>
<text x="24" y="27" fill="#ffffff" font-size="17" font-weight="bold">Vascular Access &amp; Bloodline Components</text>
<text x="24" y="45" fill="#ffbf00" font-size="11" letter-spacing="0.5">AVF · AVG · catheter · extracorporeal circuit</text>

<!-- ============ access types (top) ============ -->
<!-- AVF -->
<g>
  <rect x="40" y="80" width="230" height="92" rx="10" fill="#ffffff" stroke="#00573f" stroke-width="1.5" filter="url(#hd4Sh)"/>
  <text x="52" y="100" fill="#00573f" font-size="12" font-weight="bold">AVF — arteriovenous fistula</text>
  <path d="M62 140 q30 -8 52 0" fill="none" stroke="#c10230" stroke-width="7" stroke-linecap="round"/>
  <text x="56" y="130" fill="#c10230" font-size="8">artery</text>
  <path d="M114 140 q30 8 60 0 q26 -4 48 2" fill="none" stroke="#c10230" stroke-width="10" stroke-linecap="round" opacity="0.75"/>
  <text x="176" y="128" fill="#8d1f33" font-size="8">enlarged vein</text>
  <circle cx="114" cy="140" r="5" fill="#ffbf00"/>
  <line x1="114" y1="146" x2="114" y2="158" stroke="#8a6d1b" stroke-width="1"/>
  <text x="114" y="168" fill="#8a6d1b" font-size="8" text-anchor="middle">anastomosis</text>
</g>
<!-- AVG -->
<g>
  <rect x="286" y="80" width="150" height="92" rx="10" fill="#ffffff" stroke="#0090b8" stroke-width="1.5" filter="url(#hd4Sh)"/>
  <text x="298" y="100" fill="#0090b8" font-size="12" font-weight="bold">AVG — graft</text>
  <path d="M306 142 q10 -16 24 0" fill="none" stroke="#c10230" stroke-width="7" stroke-linecap="round"/>
  <path d="M330 142 q26 -20 46 0 q14 10 24 2" fill="none" stroke="#5b6b7a" stroke-width="7" stroke-linecap="round"/>
  <text x="342" y="126" fill="#5b6b7a" font-size="8">synthetic graft</text>
  <text x="298" y="164" fill="#5b6b7a" font-size="9">when veins are too small</text>
</g>
<!-- Catheter -->
<g>
  <rect x="452" y="80" width="164" height="92" rx="10" fill="#ffffff" stroke="#c10230" stroke-width="1.5" filter="url(#hd4Sh)"/>
  <text x="464" y="100" fill="#c10230" font-size="12" font-weight="bold">Central venous catheter</text>
  <path d="M470 150 q20 -30 44 -28 q20 2 34 -12" fill="none" stroke="#0a4f88" stroke-width="8" stroke-linecap="round"/>
  <path d="M470 150 q20 -30 44 -28 q20 2 34 -12" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="6 5" opacity="0.7"/>
  <circle cx="548" cy="110" r="7" fill="#0a4f88"/>
  <text x="562" y="114" fill="#5b6b7a" font-size="8">tunneled, cuffed</text>
</g>
<text x="320" y="184" fill="#5b6b7a" font-size="9.5" text-anchor="middle">AVF = first choice (own vessels, best survival) · AVG when veins are too small · catheter = bridge access, infection risk</text>

<!-- ============ extracorporeal circuit (bottom) ============ -->
<rect x="40" y="188" width="576" height="186" rx="12" fill="#ffffff" stroke="#e3e8ee" filter="url(#hd4Sh)"/>
<text x="56" y="210" fill="#022851" font-size="12.5" font-weight="bold">The extracorporeal circuit</text>

<!-- access stubs -->
<circle cx="84" cy="240" r="10" fill="#c10230"/>
<circle cx="84" cy="330" r="10" fill="#8d1f33"/>
<text x="58" y="228" fill="#c10230" font-size="8.5">arterial</text>
<text x="58" y="352" fill="#8d1f33" font-size="8.5">venous</text>

<!-- arterial line: access -> pre-pump -> pump -->
<path d="M94 240 H180 V262 H212" fill="none" stroke="#c10230" stroke-width="5" stroke-linecap="round"/>
<text x="94" y="258" fill="#5b6b7a" font-size="9">arterial bloodline</text>
<rect x="150" y="228" width="62" height="22" rx="6" fill="#ffe3e6" stroke="#c10230" stroke-width="1"/>
<text x="181" y="243" fill="#c10230" font-size="8" text-anchor="middle" font-weight="bold">PRE-PUMP</text>
<text x="212" y="268" fill="#c10230" font-size="8" text-anchor="end">negative pressure!</text>
<text x="212" y="279" fill="#5b6b7a" font-size="7.5" text-anchor="end">air risk if lines loosen (≤ −250 mmHg)</text>

<!-- roller pump -->
<g filter="url(#hd4Sh)">
  <circle cx="248" cy="262" r="30" fill="#022851"/>
</g>
<circle cx="248" cy="262" r="20" fill="none" stroke="#ffbf00" stroke-width="2.5"/>
<circle cx="248" cy="262" r="4" fill="#ffbf00"/>
<circle cx="248" cy="244" r="5" fill="#ffbf00"/>
<circle cx="232" cy="272" r="5" fill="#ffbf00"/>
<circle cx="264" cy="272" r="5" fill="#ffbf00"/>
<text x="248" y="300" fill="#022851" font-size="9.5" text-anchor="middle" font-weight="bold">Blood pump</text>
<text x="248" y="312" fill="#5b6b7a" font-size="8" text-anchor="middle">spring-loaded rollers</text>
<text x="248" y="323" fill="#5b6b7a" font-size="8" text-anchor="middle">too tight = hemolysis · too loose = retrograde flow</text>

<!-- pump -> dialyzer -->
<path d="M280 262 H360 V262" fill="none" stroke="#c10230" stroke-width="5" stroke-linecap="round"/>
<!-- dialyzer -->
<g filter="url(#hd4Sh)">
  <rect x="366" y="222" width="66" height="80" rx="12" fill="#e9f1f8" stroke="#5b6b7a" stroke-width="2"/>
</g>
<g stroke="#ffbf00" stroke-width="2.5">
  <line x1="376" y1="230" x2="376" y2="294"/><line x1="388" y1="230" x2="388" y2="294"/>
  <line x1="400" y1="230" x2="400" y2="294"/><line x1="412" y1="230" x2="412" y2="294"/>
</g>
<rect x="376" y="230" width="10" height="64" fill="#c10230" opacity="0.4"/>
<rect x="400" y="230" width="10" height="64" fill="#c10230" opacity="0.4"/>
<text x="399" y="318" fill="#5b6b7a" font-size="9" text-anchor="middle">dialyzer</text>

<!-- venous drip chamber + air detector -->
<path d="M432 262 H500" fill="none" stroke="#c10230" stroke-width="5" stroke-linecap="round"/>
<g filter="url(#hd4Sh)">
  <rect x="502" y="234" width="26" height="56" rx="13" fill="#ffffff" stroke="#022851" stroke-width="2"/>
</g>
<rect x="505" y="258" width="20" height="29" rx="10" fill="url(#hd4Blood)"/>
<circle cx="515" cy="248" r="6" fill="#cfe0f2" opacity="0.9"/>
<text x="500" y="310" fill="#022851" font-size="8.5" text-anchor="end" font-weight="bold">drip chamber</text>
<rect x="536" y="250" width="44" height="18" rx="4" fill="#e2f2fb" stroke="#0090b8" stroke-width="1"/>
<text x="558" y="263" fill="#0090b8" font-size="7.5" text-anchor="middle" font-weight="bold">air detector</text>
<text x="558" y="282" fill="#5b6b7a" font-size="7.5" text-anchor="middle">venous return</text>
<!-- venous pressure monitor -->
<line x1="466" y1="262" x2="466" y2="236" stroke="#022851" stroke-width="1.5" marker-end="url(#hd4Arr)"/>
<text x="474" y="230" fill="#022851" font-size="8.5" font-weight="bold">venous pressure — rising = clotting</text>
<!-- venous line back to access -->
<path d="M515 290 V360 H96 V342" fill="none" stroke="#c10230" stroke-width="5" stroke-linecap="round"/>
<path d="M515 290 V360 H96 V342" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="7 6" opacity="0.6"/>
<text x="300" y="350" fill="#c10230" font-size="8.5">cleaned blood returns to patient · roller tolerance 300–400 mmHg</text>

<text x="320" y="396" fill="#022851" font-size="10.5" text-anchor="middle" font-weight="bold">The pre-pump segment is the danger zone: negative pressure pulls air in if a connection breaks</text>
<text x="616" y="412" fill="#9aa7b4" font-size="9" text-anchor="end">CNN Exam Prep · Hemodialysis</text>
</svg>