<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="tx6Head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#022851"/><stop offset="1" stop-color="#003a6b"/></linearGradient>
  <filter id="tx6Sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#022851" flood-opacity="0.18"/></filter>
</defs>
<rect width="640" height="420" fill="#f7fafc"/>
<rect width="640" height="56" fill="url(#tx6Head)"/>
<rect y="56" width="640" height="4" fill="#ffbf00"/>
<text x="24" y="27" fill="#ffffff" font-size="17" font-weight="bold">Immunosuppression — Maintenance Agents</text>
<text x="24" y="45" fill="#ffbf00" font-size="11" letter-spacing="0.5">The lifelong daily regimen — know the class and the side effects</text>

<!-- pill bottle motif -->
<g filter="url(#tx6Sh)">
  <rect x="36" y="74" width="120" height="290" rx="12" fill="#022851"/>
</g>
<!-- bottle -->
<rect x="66" y="120" width="60" height="86" rx="8" fill="#ffffff"/>
<rect x="72" y="112" width="48" height="12" rx="3" fill="#ffbf00"/>
<rect x="76" y="138" width="40" height="34" rx="3" fill="#eef4f8" stroke="#c4d3e0"/>
<text x="96" y="152" fill="#022851" font-size="6.5" text-anchor="middle">TAKE</text>
<text x="96" y="162" fill="#022851" font-size="6.5" text-anchor="middle">DAILY</text>
<!-- pills spilling -->
<circle cx="60" cy="216" r="5" fill="#0090b8"/><circle cx="74" cy="222" r="5" fill="#ffbf00"/>
<circle cx="90" cy="224" r="5" fill="#7a3b8f"/><circle cx="106" cy="218" r="5" fill="#2e7d32"/>
<circle cx="64" cy="232" r="5" fill="#c10230"/><circle cx="100" cy="234" r="5" fill="#0090b8"/>
<text x="96" y="288" fill="#cfe0f2" font-size="9" text-anchor="middle">5 maintenance classes,</text>
<text x="96" y="302" fill="#cfe0f2" font-size="9" text-anchor="middle">usually 3 together</text>
<text x="96" y="336" fill="#ffbf00" font-size="8.5" text-anchor="middle" font-weight="bold">never stop abruptly</text>

<!-- agent cards -->
<!-- CNI -->
<g filter="url(#tx6Sh)">
  <rect x="172" y="74" width="220" height="94" rx="12" fill="#ffffff" stroke="#00573f" stroke-width="1.5"/>
</g>
<rect x="172" y="74" width="220" height="22" rx="12" fill="#00573f"/><rect x="172" y="86" width="220" height="10" fill="#00573f"/>
<text x="282" y="90" fill="#ffffff" font-size="9.5" text-anchor="middle" font-weight="bold">CALCINEURIN INHIBITORS</text>
<text x="184" y="116" fill="#1c2b39" font-size="9.5" font-weight="bold">Tacrolimus &gt; cyclosporine</text>
<text x="184" y="133" fill="#5b6b7a" font-size="8.5">block IL-2 → no T-cell activation</text>
<text x="184" y="151" fill="#5b6b7a" font-size="8.5">tacrolimus: better rejection rates</text>
<text x="184" y="163" fill="#5b6b7a" font-size="8.5">&amp; graft survival</text>
<!-- mTOR -->
<g filter="url(#tx6Sh)">
  <rect x="408" y="74" width="196" height="94" rx="12" fill="#ffffff" stroke="#7a3b8f" stroke-width="1.5"/>
</g>
<rect x="408" y="74" width="196" height="22" rx="12" fill="#7a3b8f"/><rect x="408" y="86" width="196" height="10" fill="#7a3b8f"/>
<text x="506" y="90" fill="#ffffff" font-size="9.5" text-anchor="middle" font-weight="bold">mTOR INHIBITORS</text>
<text x="420" y="116" fill="#1c2b39" font-size="9.5" font-weight="bold">Sirolimus, everolimus</text>
<text x="420" y="133" fill="#5b6b7a" font-size="8.5">suppress T-cell production;</text>
<text x="420" y="147" fill="#5b6b7a" font-size="8.5">trough monitoring required</text>
<text x="420" y="163" fill="#c10230" font-size="8.5" font-weight="bold">interacts with grapefruit!</text>
<!-- steroids -->
<g filter="url(#tx6Sh)">
  <rect x="172" y="184" width="220" height="94" rx="12" fill="#ffffff" stroke="#b8860b" stroke-width="1.5"/>
</g>
<rect x="172" y="184" width="220" height="22" rx="12" fill="#b8860b"/><rect x="172" y="196" width="220" height="10" fill="#b8860b"/>
<text x="282" y="200" fill="#ffffff" font-size="9.5" text-anchor="middle" font-weight="bold">GLUCOCORTICOIDS</text>
<text x="184" y="226" fill="#1c2b39" font-size="9.5" font-weight="bold">suppress immune response</text>
<text x="184" y="243" fill="#5b6b7a" font-size="8.5">long-term: diabetes, osteoporosis,</text>
<text x="184" y="257" fill="#5b6b7a" font-size="8.5">Cushing syndrome</text>
<text x="184" y="272" fill="#5b6b7a" font-size="8.5">— steroid minimization is a goal</text>
<!-- mycophenolate -->
<g filter="url(#tx6Sh)">
  <rect x="408" y="184" width="196" height="94" rx="12" fill="#ffffff" stroke="#0090b8" stroke-width="1.5"/>
</g>
<rect x="408" y="184" width="196" height="22" rx="12" fill="#0090b8"/><rect x="408" y="196" width="196" height="10" fill="#0090b8"/>
<text x="506" y="200" fill="#ffffff" font-size="9.5" text-anchor="middle" font-weight="bold">MYCOPHENOLIC ACID</text>
<text x="420" y="226" fill="#1c2b39" font-size="9.5" font-weight="bold">blocks B &amp; T lymphocyte</text>
<text x="420" y="240" fill="#1c2b39" font-size="9.5" font-weight="bold">production</text>
<text x="420" y="258" fill="#5b6b7a" font-size="8.5">GI side effects · teratogenic</text>
<text x="420" y="272" fill="#c10230" font-size="8.5" font-weight="bold">pregnancy category risk</text>
<!-- belatacept -->
<g filter="url(#tx6Sh)">
  <rect x="172" y="294" width="432" height="70" rx="12" fill="#ffffff" stroke="#c10230" stroke-width="1.5"/>
</g>
<rect x="172" y="294" width="432" height="22" rx="12" fill="#c10230"/><rect x="172" y="306" width="432" height="10" fill="#c10230"/>
<text x="388" y="310" fill="#ffffff" font-size="9.5" text-anchor="middle" font-weight="bold">BELATACEPT — costimulation blockade (IV, monthly)</text>
<text x="188" y="336" fill="#1c2b39" font-size="9.5">binds CD80/CD86 on APCs → T cells never get their "second signal"</text>
<text x="188" y="354" fill="#5b6b7a" font-size="8.5">requires EBV serology screening first — EBV-negative recipients risk post-transplant lymphoproliferative disease (PTLD)</text>

<text x="616" y="410" fill="#9aa7b4" font-size="9" text-anchor="end">CNN Exam Prep · Transplant</text>
</svg>