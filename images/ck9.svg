<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="ck9Head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#022851"/><stop offset="1" stop-color="#003a6b"/></linearGradient>
  <marker id="ck9Arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#022851"/></marker>
  <marker id="ck9ArrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c10230"/></marker>
  <filter id="ck9Sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#022851" flood-opacity="0.18"/></filter>
</defs>
<rect width="640" height="420" fill="#f7fafc"/>
<rect width="640" height="56" fill="url(#ck9Head)"/>
<rect y="56" width="640" height="4" fill="#ffbf00"/>
<text x="24" y="27" fill="#ffffff" font-size="17" font-weight="bold">Sleep Disturbances &amp; Cardiovascular Risk</text>
<text x="24" y="45" fill="#ffbf00" font-size="11" letter-spacing="0.5">Poor sleep accelerates kidney function decline</text>

<!-- ============ left: the OSA cycle ============ -->
<rect x="24" y="76" width="300" height="220" rx="12" fill="#ffffff" stroke="#e3e8ee" filter="url(#ck9Sh)"/>
<text x="40" y="98" fill="#022851" font-size="12" font-weight="bold">Obstructive sleep apnea — the cycle</text>
<!-- airway collapse icon -->
<g filter="url(#ck9Sh)">
  <rect x="40" y="112" width="110" height="80" rx="8" fill="#e2f2fb" stroke="#0090b8" stroke-width="1.2"/>
</g>
<!-- sleeping patient -->
<rect x="46" y="142" width="32" height="14" rx="5" fill="#ffffff" stroke="#8fa8ba" stroke-width="1"/>
<circle cx="58" cy="149" r="6.5" fill="#f4d5bc"/>
<rect x="66" y="145" width="44" height="12" rx="6" fill="#5b87c5"/>
<rect x="70" y="157" width="44" height="7" rx="3" fill="#8fb3dd"/>
<text x="66" y="128" fill="#5b6b7a" font-size="7.5" text-anchor="middle">airway collapses in sleep</text>
<!-- zzz -->
<g fill="#022851" font-weight="bold">
  <text x="100" y="146" font-size="8">z</text>
  <text x="110" y="138" font-size="10">z</text>
  <text x="122" y="128" font-size="12">z</text>
</g>
<!-- hypoxia chips -->
<text x="164" y="130" fill="#c10230" font-size="9.5" font-weight="bold">Intermittent hypoxia</text>
<text x="164" y="145" fill="#5b6b7a" font-size="9">+ reoxygenation, all night</text>
<!-- effects list -->
<g font-size="9.5" fill="#1c2b39">
  <text x="52" y="216" font-weight="bold" fill="#c10230">Each night this drives:</text>
  <text x="52" y="234">· Nocturnal BP rise</text>
  <text x="52" y="250">· Sympathetic activation · inflammation</text>
  <text x="52" y="266">· Endothelial dysfunction · arterial stiffness</text>
  <text x="52" y="282" font-weight="bold">→ faster kidney function decline</text>
</g>

<!-- ============ right: consequences web ============ -->
<rect x="344" y="76" width="272" height="220" rx="12" fill="#ffffff" stroke="#e3e8ee" filter="url(#ck9Sh)"/>
<text x="360" y="98" fill="#022851" font-size="12" font-weight="bold">What poor sleep feeds</text>
<!-- central node -->
<circle cx="408" cy="160" r="26" fill="#022851"/>
<text x="408" y="157" fill="#ffbf00" font-size="9" text-anchor="middle" font-weight="bold">SLEEP</text>
<text x="408" y="169" fill="#cfe0f2" font-size="9" text-anchor="middle" font-weight="bold">problems</text>
<!-- outcome nodes -->
<g font-size="8.5">
  <rect x="470" y="118" width="130" height="24" rx="12" fill="#fdf0f0" stroke="#c10230" stroke-width="1"/>
  <text x="535" y="134" fill="#c10230" text-anchor="middle" font-weight="bold">Obesity · T2 diabetes</text>
  <rect x="470" y="150" width="130" height="24" rx="12" fill="#fdf0f0" stroke="#c10230" stroke-width="1"/>
  <text x="535" y="166" fill="#c10230" text-anchor="middle" font-weight="bold">Hypertension</text>
  <rect x="470" y="182" width="130" height="24" rx="12" fill="#fdf0f0" stroke="#c10230" stroke-width="1"/>
  <text x="535" y="198" fill="#c10230" text-anchor="middle" font-weight="bold">↑ Urine albumin</text>
  <rect x="470" y="214" width="130" height="24" rx="12" fill="#fdf0f0" stroke="#c10230" stroke-width="1"/>
  <text x="535" y="230" fill="#c10230" text-anchor="middle" font-weight="bold">Depression</text>
</g>
<!-- connectors -->
<g stroke="#5b6b7a" stroke-width="1.2">
  <line x1="432" y1="148" x2="470" y2="130"/>
  <line x1="434" y1="160" x2="470" y2="162"/>
  <line x1="432" y1="172" x2="470" y2="194"/>
  <line x1="426" y1="182" x2="470" y2="226"/>
</g>
<text x="360" y="262" fill="#5b6b7a" font-size="8.5">all of the above accelerate CKD development &amp; progression</text>

<!-- ============ bottom: action bar ============ -->
<rect x="24" y="312" width="592" height="60" rx="12" fill="#022851" filter="url(#ck9Sh)"/>
<text x="40" y="334" fill="#ffbf00" font-size="10.5" font-weight="bold">What actually helps</text>
<text x="40" y="354" fill="#cfe0f2" font-size="9.5">· Refer sleep complaints to a sleep specialist  · 30 min CV exercise, 5 days/week</text>
<text x="40" y="368" fill="#cfe0f2" font-size="9.5">· Even 3 kg weight loss lowers BP  · shared decision-making keeps patients engaged</text>

<!-- caption -->
<text x="320" y="392" fill="#022851" font-size="10.5" text-anchor="middle" font-weight="bold">Ask about sleep at every CKD visit — OSA is common, underdiagnosed, and modifiable</text>
<text x="616" y="410" fill="#9aa7b4" font-size="9" text-anchor="end">CNN Exam Prep · CKD Complications</text>
</svg>