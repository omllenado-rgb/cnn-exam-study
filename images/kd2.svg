<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="kd2Head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#022851"/><stop offset="1" stop-color="#003a6b"/></linearGradient>
  <marker id="kd2Arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#022851"/></marker>
  <marker id="kd2ArrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c10230"/></marker>
  <marker id="kd2ArrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00573f"/></marker>
  <filter id="kd2Sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#022851" flood-opacity="0.18"/></filter>
</defs>
<rect width="640" height="420" fill="#f7fafc"/>
<rect width="640" height="56" fill="url(#kd2Head)"/>
<rect y="56" width="640" height="4" fill="#ffbf00"/>
<text x="24" y="27" fill="#ffffff" font-size="17" font-weight="bold">Prerenal Injury vs. Acute Tubular Necrosis</text>
<text x="24" y="45" fill="#ffbf00" font-size="11" letter-spacing="0.5">One is reversible — the other is not</text>

<!-- ============ tubule illustration (left) ============ -->
<g filter="url(#kd2Sh)">
  <rect x="40" y="76" width="240" height="200" rx="12" fill="#ffffff" stroke="#e3e8ee"/>
</g>
<text x="56" y="98" fill="#022851" font-size="12" font-weight="bold">What prolonged hypoperfusion does</text>
<!-- healthy tubule -->
<rect x="60" y="116" width="200" height="26" rx="13" fill="#f7d7c4" stroke="#c97b62" stroke-width="1.5"/>
<text x="160" y="133" fill="#8a4a35" font-size="9" text-anchor="middle" font-weight="bold">healthy tubule — intact cells</text>
<!-- hypoperfusion arrow -->
<line x1="160" y1="150" x2="160" y2="172" stroke="#c10230" stroke-width="2.5" marker-end="url(#kd2ArrRed)"/>
<text x="172" y="168" fill="#c10230" font-size="9" font-weight="bold">60–90 min no flow</text>
<!-- dying tubule -->
<rect x="60" y="178" width="200" height="30" rx="15" fill="#e8d0c6" stroke="#c10230" stroke-width="1.5" stroke-dasharray="5 3"/>
<g fill="#c10230">
  <circle cx="90" cy="193" r="2.5"/><circle cx="120" cy="188" r="2.5"/><circle cx="150" cy="195" r="2.5"/>
  <circle cx="150" cy="188" r="2.5"/><circle cx="180" cy="192" r="2.5"/><circle cx="210" cy="190" r="2.5"/><circle cx="235" cy="193" r="2.5"/>
</g>
<text x="160" y="222" fill="#c10230" font-size="9.5" text-anchor="middle" font-weight="bold">necrotic tubular cells slough off</text>
<text x="160" y="238" fill="#5b6b7a" font-size="9" text-anchor="middle">metabolism shifts to anaerobic → cell death</text>
<!-- response chips -->
<rect x="54" y="248" width="102" height="20" rx="10" fill="#e2f2e6"/>
<text x="105" y="262" fill="#00573f" font-size="8" text-anchor="middle" font-weight="bold">prerenal: responds fast</text>
<rect x="162" y="248" width="102" height="20" rx="10" fill="#ffe3e6"/>
<text x="213" y="262" fill="#c10230" font-size="8" text-anchor="middle" font-weight="bold">ATN: minimal response</text>

<!-- ============ comparison table (right) ============ -->
<rect x="304" y="76" width="312" height="200" rx="12" fill="#ffffff" stroke="#e3e8ee" filter="url(#kd2Sh)"/>
<text x="320" y="98" fill="#022851" font-size="12" font-weight="bold">Urine indices tell them apart</text>
<!-- header row -->
<rect x="316" y="106" width="130" height="20" rx="5" fill="#e2f2fb"/>
<text x="381" y="120" fill="#005a7a" font-size="9.5" text-anchor="middle" font-weight="bold">PRERENAL</text>
<rect x="466" y="106" width="122" height="20" rx="5" fill="#ffe3e6" stroke="#c10230" stroke-width="1"/>
<text x="527" y="120" fill="#c10230" font-size="9.5" text-anchor="middle" font-weight="bold">ATN</text>
<rect x="500" y="84" width="108" height="16" rx="8" fill="#e2f2e6" stroke="#00573f" stroke-width="1"/>
<text x="554" y="96" fill="#00573f" font-size="8.5" text-anchor="middle" font-weight="bold">reversible</text>
<!-- rows -->
<g font-size="9">
  <text x="320" y="150" fill="#5b6b7a" font-weight="bold">specific gravity</text>
  <text x="420" y="150" fill="#00573f" text-anchor="middle" font-weight="bold">HIGH</text>
  <text x="520" y="150" fill="#c10230" text-anchor="middle" font-weight="bold">LOW</text>
  <line x1="316" y1="158" x2="588" y2="158" stroke="#eef4f8" stroke-width="1"/>
  <text x="320" y="172" fill="#5b6b7a" font-weight="bold">urine sodium</text>
  <text x="420" y="172" fill="#00573f" text-anchor="middle" font-weight="bold">LOW</text>
  <text x="520" y="172" fill="#c10230" text-anchor="middle" font-weight="bold">&gt; 20 mEq/L</text>
  <line x1="316" y1="180" x2="588" y2="180" stroke="#eef4f8" stroke-width="1"/>
  <text x="320" y="194" fill="#5b6b7a" font-weight="bold">osmolality</text>
  <text x="420" y="194" fill="#00573f" text-anchor="middle" font-weight="bold">HIGH</text>
  <text x="520" y="194" fill="#c10230" text-anchor="middle" font-weight="bold">LOW</text>
  <line x1="316" y1="202" x2="588" y2="202" stroke="#eef4f8" stroke-width="1"/>
  <text x="320" y="216" fill="#5b6b7a" font-weight="bold">U/P creatinine</text>
  <text x="420" y="216" fill="#00573f" text-anchor="middle" font-weight="bold">&gt; 15 : 1</text>
  <text x="520" y="216" fill="#c10230" text-anchor="middle" font-weight="bold">&lt; 10 : 1</text>
  <line x1="316" y1="224" x2="588" y2="224" stroke="#eef4f8" stroke-width="1"/>
  <text x="320" y="238" fill="#5b6b7a" font-weight="bold">therapy response</text>
  <text x="420" y="240" fill="#00573f" text-anchor="middle" font-weight="bold">rapid</text>
  <text x="520" y="240" fill="#c10230" text-anchor="middle" font-weight="bold">minimal</text>
</g>
<rect x="316" y="252" width="272" height="16" rx="8" fill="#eef4f8"/>
<text x="452" y="264" fill="#022851" font-size="8.5" text-anchor="middle" font-weight="bold">Get the urine studies BEFORE fluids confuse the picture</text>

<!-- ============ footer ============ -->
<g filter="url(#kd2Sh)">
  <rect x="40" y="296" width="576" height="70" rx="12" fill="#022851"/>
</g>
<text x="60" y="322" fill="#ffbf00" font-size="11.5" font-weight="bold">Why it matters at the bedside</text>
<text x="60" y="342" fill="#cfe0f2" font-size="9.5">Prerenal injury resolves rapidly with volume and perfusion support — ATN needs supportive care while the</text>
<text x="60" y="356" fill="#cfe0f2" font-size="9.5">tubules regenerate. Treating ATN like prerenal (pushing fluids) risks volume overload.</text>
<text x="616" y="414" fill="#9aa7b4" font-size="9" text-anchor="end">CNN Exam Prep · Kidney Disease</text>
</svg>