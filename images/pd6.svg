<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="pd6Head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#022851"/><stop offset="1" stop-color="#003a6b"/></linearGradient>
  <marker id="pd6Arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#022851"/></marker>
  <filter id="pd6Sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#022851" flood-opacity="0.18"/></filter>
</defs>
<rect width="640" height="420" fill="#f7fafc"/>
<rect width="640" height="56" fill="url(#pd6Head)"/>
<rect y="56" width="640" height="4" fill="#ffbf00"/>
<text x="24" y="27" fill="#ffffff" font-size="17" font-weight="bold">Peritonitis — the #1 Complication</text>
<text x="24" y="45" fill="#ffbf00" font-size="11" letter-spacing="0.5">Diagnosis · empiric coverage · prevention</text>

<!-- ============ diagnosis (left) ============ -->
<rect x="36" y="70" width="300" height="170" rx="12" fill="#ffffff" stroke="#c10230" stroke-width="1.5" filter="url(#pd6Sh)"/>
<rect x="36" y="70" width="300" height="26" rx="12" fill="#c10230"/><rect x="36" y="84" width="300" height="12" fill="#c10230"/>
<text x="186" y="88" fill="#ffffff" font-size="11" text-anchor="middle" font-weight="bold">DIAGNOSIS — need ≥ 2 of these 3</text>
<!-- criterion rows -->
<rect x="52" y="106" width="268" height="34" rx="6" fill="#fdf3d1"/>
<text x="64" y="122" fill="#8a6d1b" font-size="10" font-weight="bold">1 · Cloudy effluent</text>
<text x="64" y="134" fill="#5b6b7a" font-size="8">± abdominal pain — treat on sight</text>
<rect x="52" y="146" width="268" height="34" rx="6" fill="#e9f1f8"/>
<text x="64" y="162" fill="#022851" font-size="10" font-weight="bold">2 · Effluent WBC &gt; 100/µL</text>
<text x="64" y="174" fill="#5b6b7a" font-size="8">neutrophils ≥ 50% (with short dwells)</text>
<rect x="52" y="186" width="268" height="34" rx="6" fill="#e2f2e6"/>
<text x="64" y="200" fill="#00573f" font-size="10" font-weight="bold">3 · Positive culture</text>
<text x="64" y="212" fill="#5b6b7a" font-size="8">Gram stain + cell count before antibiotics if possible</text>

<!-- ============ risk factors (right) ============ -->
<rect x="348" y="70" width="256" height="170" rx="12" fill="#ffffff" stroke="#e3e8ee" filter="url(#pd6Sh)"/>
<text x="364" y="92" fill="#022851" font-size="12.5" font-weight="bold">Who gets peritonitis?</text>
<g font-size="9" fill="#1c2b39">
  <circle cx="402" cy="110" r="3.5" fill="#c10230"/>
  <text x="412" y="113" font-weight="bold">Touch contamination (technique</text>
  <text x="412" y="126">errors during exchanges)</text>
  <circle cx="402" cy="142" r="3.5" fill="#c10230"/>
  <text x="412" y="145">exit-site or tunnel infection</text>
  <circle cx="402" cy="160" r="3.5" fill="#c10230"/>
  <text x="412" y="163">constipation / bowel stasis</text>
  <circle cx="402" cy="178" r="3.5" fill="#c10230"/>
  <text x="412" y="181">hypoalbuminemia</text>
  <circle cx="402" cy="196" r="3.5" fill="#c10230"/>
  <text x="412" y="199">hypokalemia</text>
</g>
<text x="364" y="228" fill="#5b6b7a" font-size="8">low albumin &amp; low K+ impair gut and immune defenses</text>

<!-- ============ treatment (bottom left) ============ -->
<rect x="36" y="252" width="300" height="134" rx="12" fill="#ffffff" stroke="#e3e8ee" filter="url(#pd6Sh)"/>
<text x="52" y="274" fill="#022851" font-size="12.5" font-weight="bold">Treatment starts immediately</text>
<g filter="url(#pd6Sh)">
  <rect x="52" y="284" width="268" height="34" rx="8" fill="#022851"/>
</g>
<text x="186" y="298" fill="#ffbf00" font-size="9.5" text-anchor="middle" font-weight="bold">Empiric Gram-POSITIVE + Gram-NEGATIVE coverage</text>
<text x="186" y="311" fill="#cfe0f2" font-size="8" text-anchor="middle">the moment effluent turns cloudy — never wait for culture</text>
<g font-size="8.5">
  <rect x="52" y="328" width="128" height="34" rx="6" fill="#e2f2fb"/>
  <text x="116" y="342" fill="#0090b8" text-anchor="middle" font-weight="bold">Intraperitoneal &gt; IV</text>
  <text x="116" y="354" fill="#5b6b7a" text-anchor="middle">dwell delivers the dose</text>
  <rect x="192" y="328" width="128" height="34" rx="6" fill="#fdf3d1"/>
  <text x="256" y="342" fill="#8a6d1b" text-anchor="middle" font-weight="bold">+ antifungal prophylaxis</text>
  <text x="256" y="354" fill="#5b6b7a" text-anchor="middle">while on broad antibiotics</text>
</g>
<text x="52" y="379" fill="#5b6b7a" font-size="8">typical regimen: cefazolin + ceftazidime (or aminoglycoside) per dwell</text>

<!-- ============ prevention (bottom right) ============ -->
<rect x="348" y="252" width="256" height="134" rx="12" fill="#ffffff" stroke="#00573f" stroke-width="1.5" filter="url(#pd6Sh)"/>
<text x="364" y="274" fill="#00573f" font-size="12.5" font-weight="bold">Prevention checklist</text>
<g font-size="8.5" fill="#1c2b39">
  <path d="M366 288 l4 4 l7 -8" fill="none" stroke="#00573f" stroke-width="2" stroke-linecap="round"/>
  <text x="382" y="292">antibiotics before catheter placement</text>
  <path d="M366 306 l4 4 l7 -8" fill="none" stroke="#00573f" stroke-width="2" stroke-linecap="round"/>
  <text x="382" y="310" font-weight="bold">handwashing before every exchange</text>
  <text x="382" y="320" fill="#5b6b7a">soap + water if C. difficile risk</text>
  <path d="M366 332 l4 4 l7 -8" fill="none" stroke="#00573f" stroke-width="2" stroke-linecap="round"/>
  <text x="382" y="336">daily exit-site antibiotic (staph carrier)</text>
  <path d="M366 356 l4 4 l7 -8" fill="none" stroke="#00573f" stroke-width="2" stroke-linecap="round"/>
  <text x="382" y="358">prophylaxis before invasive procedures</text>
  <text x="382" y="370" fill="#5b6b7a">dental work, colonoscopy, gynecologic</text>
</g>

<text x="616" y="412" fill="#9aa7b4" font-size="9" text-anchor="end">CNN Exam Prep · Peritoneal Dialysis</text>
</svg>