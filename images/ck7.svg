<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="ck7Head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#022851"/><stop offset="1" stop-color="#003a6b"/></linearGradient>
  <marker id="ck7Arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#022851"/></marker>
  <marker id="ck7ArrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c10230"/></marker>
  <filter id="ck7Sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#022851" flood-opacity="0.18"/></filter>
</defs>
<rect width="640" height="420" fill="#f7fafc"/>
<rect width="640" height="56" fill="url(#ck7Head)"/>
<rect y="56" width="640" height="4" fill="#ffbf00"/>
<text x="24" y="27" fill="#ffffff" font-size="17" font-weight="bold">Malnutrition &amp; Blood Pressure Management</text>
<text x="24" y="45" fill="#ffbf00" font-size="11" letter-spacing="0.5">Fuel the body · protect the kidneys</text>

<!-- ============ left: malnutrition ============ -->
<rect x="24" y="76" width="286" height="190" rx="12" fill="#ffffff" stroke="#e3e8ee" filter="url(#ck7Sh)"/>
<rect x="24" y="76" width="286" height="30" rx="12" fill="#022851"/>
<rect x="24" y="94" width="286" height="12" fill="#022851"/>
<text x="167" y="97" fill="#ffbf00" font-size="10.5" text-anchor="middle" font-weight="bold">MALNUTRITION — BMI &lt; 18 · LOW ALBUMIN</text>
<text x="40" y="126" fill="#5b6b7a" font-size="9">Causes: poor appetite · financial barriers · uremia</text>
<!-- nutrition targets -->
<g font-size="9.5" fill="#1c2b39">
  <text x="40" y="150" font-weight="bold" fill="#022851">KDIGO 2020 targets</text>
  <text x="40" y="170">· Protein 0.55–0.60 g/kg/day (CKD 3a–5)</text>
  <text x="40" y="188">· Protein 0.6–0.8 g/kg/day with diabetes</text>
  <text x="40" y="206">· Energy 25–35 kcal/kg/day, all stages</text>
  <text x="40" y="224">· More fruits &amp; vegetables (stages 1–4)</text>
</g>
<rect x="40" y="236" width="254" height="20" rx="6" fill="#e2f2e6"/>
<text x="167" y="250" fill="#00573f" font-size="8.5" text-anchor="middle" font-weight="bold">Dietitian referral is part of the prescription</text>

<!-- ============ right: BP management ============ -->
<rect x="330" y="76" width="286" height="190" rx="12" fill="#ffffff" stroke="#e3e8ee" filter="url(#ck7Sh)"/>
<rect x="330" y="76" width="286" height="30" rx="12" fill="#022851"/>
<rect x="330" y="94" width="286" height="12" fill="#022851"/>
<text x="473" y="97" fill="#ffbf00" font-size="10.5" text-anchor="middle" font-weight="bold">BLOOD PRESSURE — KDIGO TARGET</text>
<!-- target circle -->
<circle cx="392" cy="156" r="34" fill="#022851"/>
<text x="392" y="152" fill="#ffbf00" font-size="13" text-anchor="middle" font-weight="bold">&lt;120</text>
<text x="392" y="168" fill="#cfe0f2" font-size="7.5" text-anchor="middle">systolic mmHg</text>
<text x="440" y="140" fill="#1c2b39" font-size="9.5">· person-centered approach</text>
<text x="440" y="156" fill="#1c2b39" font-size="9.5">· ACE inhibitor or ARB first-line</text>
<text x="452" y="170" fill="#5b6b7a" font-size="8.5">when BP ↑ with albuminuria</text>
<text x="452" y="186" fill="#5b6b7a" font-size="8.5">lowers intraglomerular pressure</text>
<text x="452" y="200" fill="#5b6b7a" font-size="8.5">&amp; proteinuria</text>
<!-- GFR dip note -->
<rect x="346" y="216" width="254" height="36" rx="8" fill="#fdf6e3" stroke="#b8860b" stroke-width="1"/>
<text x="358" y="232" fill="#8a6d1b" font-size="9" font-weight="bold">Expect up to 30% reversible GFR dip on ACEi/ARB</text>
<text x="358" y="246" fill="#5b6b7a" font-size="8">monitor K⁺ and creatinine after starting</text>

<!-- ============ bottom row: two pearls ============ -->
<rect x="24" y="282" width="286" height="76" rx="12" fill="#e2f2fb" stroke="#0090b8" stroke-width="1.2" filter="url(#ck7Sh)"/>
<text x="40" y="304" fill="#0090b8" font-size="10.5" font-weight="bold">Sodium restriction</text>
<text x="40" y="322" fill="#1c2b39" font-size="9.5">Target &lt; 2 g/day</text>
<text x="40" y="338" fill="#5b6b7a" font-size="8.5">lowers BP and augments the effect</text>
<text x="40" y="350" fill="#5b6b7a" font-size="8.5">of ACEi/ARB therapy</text>

<rect x="330" y="282" width="286" height="76" rx="12" fill="#e2f2fb" stroke="#0090b8" stroke-width="1.2" filter="url(#ck7Sh)"/>
<text x="346" y="304" fill="#0090b8" font-size="10" font-weight="bold">Population-specific choice</text>
<text x="346" y="322" fill="#1c2b39" font-size="9">African American patients often respond</text>
<text x="346" y="338" fill="#1c2b39" font-size="9">better to diuretics and calcium channel</text>
<text x="346" y="350" fill="#1c2b39" font-size="9">blockers than to ACEi/ARB monotherapy</text>

<!-- caption -->
<text x="320" y="390" fill="#022851" font-size="10.5" text-anchor="middle" font-weight="bold">Nutrition and BP control are the two modifiable levers that slow CKD progression most</text>
<text x="616" y="410" fill="#9aa7b4" font-size="9" text-anchor="end">CNN Exam Prep · CKD Complications</text>
</svg>