<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="hd8Head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#022851"/><stop offset="1" stop-color="#003a6b"/></linearGradient>
  <marker id="hd8Arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#022851"/></marker>
  <filter id="hd8Sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#022851" flood-opacity="0.18"/></filter>
</defs>
<rect width="640" height="420" fill="#f7fafc"/>
<rect width="640" height="56" fill="url(#hd8Head)"/>
<rect y="56" width="640" height="4" fill="#ffbf00"/>
<text x="24" y="27" fill="#ffffff" font-size="17" font-weight="bold">Allergic &amp; Pyrogenic Reactions</text>
<text x="24" y="45" fill="#ffbf00" font-size="11" letter-spacing="0.5">Recognize early — and never rinse that blood back</text>

<!-- ============ timeline axis ============ -->
<line x1="70" y1="96" x2="600" y2="96" stroke="#5b6b7a" stroke-width="2" marker-end="url(#hd8Arr)"/>
<text x="612" y="112" fill="#5b6b7a" font-size="9" text-anchor="end">minutes of treatment →</text>
<circle cx="110" cy="96" r="6" fill="#c10230"/>
<circle cx="330" cy="96" r="6" fill="#b8860b"/>
<circle cx="500" cy="96" r="6" fill="#7a3b8f"/>
<text x="110" y="84" fill="#c10230" font-size="9" text-anchor="middle" font-weight="bold">first minutes</text>
<text x="330" y="84" fill="#b8860b" font-size="9" text-anchor="middle" font-weight="bold">20–40 min</text>
<text x="500" y="84" fill="#7a3b8f" font-size="9" text-anchor="middle" font-weight="bold">30–60 min</text>

<!-- ============ Type A ============ -->
<g filter="url(#hd8Sh)">
  <rect x="40" y="116" width="272" height="150" rx="12" fill="#ffffff" stroke="#c10230" stroke-width="2"/>
</g>
<rect x="40" y="116" width="272" height="30" rx="12" fill="#c10230"/>
<rect x="40" y="134" width="272" height="12" fill="#c10230"/>
<text x="176" y="137" fill="#ffffff" font-size="12" text-anchor="middle" font-weight="bold">TYPE A — IgE allergic · most serious</text>
<g font-size="9.5" fill="#1c2b39">
  <text x="56" y="168">· warmth, itching, hives</text>
  <text x="56" y="186">· stridor / wheezing</text>
  <text x="56" y="204">· hypotension, "impending doom"</text>
  <text x="56" y="222">· → anaphylaxis, respiratory arrest</text>
</g>
<rect x="56" y="234" width="240" height="22" rx="6" fill="#ffe3e6"/>
<text x="176" y="237" fill="#c10230" font-size="8.5" text-anchor="middle" font-weight="bold">IgE-mediated · culprits: EO-sterilized dialyzer, drugs</text>
<text x="176" y="246" fill="#c10230" font-size="7.5" text-anchor="middle">stop treatment, save the circuit, never rinse back</text>

<!-- ============ Type B ============ -->
<g filter="url(#hd8Sh)">
  <rect x="328" y="116" width="272" height="150" rx="12" fill="#ffffff" stroke="#b8860b" stroke-width="2"/>
</g>
<rect x="328" y="116" width="272" height="30" rx="12" fill="#b8860b"/>
<rect x="328" y="134" width="272" height="12" fill="#b8860b"/>
<text x="464" y="137" fill="#ffffff" font-size="10.5" text-anchor="middle" font-weight="bold">TYPE B — complement · milder, later</text>
<g font-size="9.5" fill="#1c2b39">
  <text x="344" y="168">· nausea, vomiting</text>
  <text x="344" y="186">· chest or back pain</text>
  <text x="344" y="204">· starts 20–40 min into treatment</text>
  <text x="344" y="222">· often from a brand-new dialyzer</text>
</g>
<rect x="344" y="230" width="240" height="22" rx="6" fill="#fdf6e3"/>
<text x="464" y="243" fill="#8a6d1b" font-size="8.5" text-anchor="middle">may continue with monitoring / symptom care</text>

<!-- ============ pyrogenic ============ -->
<g filter="url(#hd8Sh)">
  <rect x="40" y="282" width="330" height="106" rx="12" fill="#ffffff" stroke="#7a3b8f" stroke-width="2"/>
</g>
<rect x="40" y="282" width="330" height="28" rx="12" fill="#7a3b8f"/>
<rect x="40" y="298" width="330" height="12" fill="#7a3b8f"/>
<text x="205" y="301" fill="#ffffff" font-size="10.5" text-anchor="middle" font-weight="bold">PYROGENIC REACTION — bacterial contamination</text>
<g font-size="9.5" fill="#1c2b39">
  <text x="56" y="330">· fever, chills, headache, hemodynamic instability</text>
  <text x="56" y="348">· onset 30–60 min into treatment</text>
  <text x="56" y="366">· several patients sick at once? → culture the water</text>
  <text x="56" y="384">  system and dialysate; suspect the distribution loop</text>
</g>

<!-- ============ action panel ============ -->
<g filter="url(#hd8Sh)">
  <rect x="386" y="282" width="214" height="106" rx="12" fill="#022851"/>
</g>
<text x="493" y="306" fill="#ffbf00" font-size="12" text-anchor="middle" font-weight="bold">IF SEVERE / SUSPECTED</text>
<g font-size="10" fill="#ffffff" text-anchor="middle" font-weight="bold">
  <text x="493" y="330">STOP treatment</text>
  <text x="493" y="348">clamp lines</text>
  <text x="493" y="366">support airway &amp; BP</text>
</g>
<rect x="402" y="372" width="182" height="12" rx="6" fill="#c10230"/>
<text x="493" y="381.5" fill="#ffffff" font-size="7.5" text-anchor="middle" font-weight="bold">DO NOT rinse the blood back</text>
<text x="616" y="414" fill="#9aa7b4" font-size="9" text-anchor="end">CNN Exam Prep · Hemodialysis</text>
</svg>