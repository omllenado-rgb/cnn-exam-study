<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="hd2Head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#022851"/><stop offset="1" stop-color="#003a6b"/></linearGradient>
  <linearGradient id="hd2Shell" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9e4ee"/><stop offset="0.5" stop-color="#f4f8fb"/><stop offset="1" stop-color="#c4d3e0"/></linearGradient>
  <linearGradient id="hd2Fiber" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdf3d1"/><stop offset="1" stop-color="#ffdf80"/></linearGradient>
  <marker id="hd2Arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#022851"/></marker>
  <marker id="hd2ArrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c10230"/></marker>
  <marker id="hd2ArrCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0090b8"/></marker>
  <filter id="hd2Sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#022851" flood-opacity="0.18"/></filter>
</defs>
<rect width="640" height="420" fill="#f7fafc"/>
<rect width="640" height="56" fill="url(#hd2Head)"/>
<rect y="56" width="640" height="4" fill="#ffbf00"/>
<text x="24" y="27" fill="#ffffff" font-size="17" font-weight="bold">Dialyzers: Membranes, Efficiency &amp; Selection</text>
<text x="24" y="45" fill="#ffbf00" font-size="11" letter-spacing="0.5">Hollow-fiber construction · flux · KoA</text>

<!-- ============ dialyzer cutaway (left) ============ -->
<!-- blood in -->
<line x1="100" y1="74" x2="136" y2="90" stroke="#c10230" stroke-width="3" marker-end="url(#hd2ArrRed)"/>
<text x="40" y="72" fill="#c10230" font-size="9.5" font-weight="bold">blood in (top port)</text>
<g filter="url(#hd2Sh)">
  <rect x="40" y="100" width="300" height="150" rx="24" fill="url(#hd2Shell)" stroke="#5b6b7a" stroke-width="2"/>
</g>
<!-- cutaway open top -->
<path d="M70 100 L110 76 L300 76 L340 100" fill="#e7eef5" stroke="#5b6b7a" stroke-width="1.5"/>
<!-- dialysate wash -->
<rect x="66" y="114" width="248" height="132" rx="10" fill="#00b2e3" opacity="0.12"/>
<!-- hollow fibers -->
<g>
  <rect x="72" y="128" width="236" height="7" rx="3.5" fill="url(#hd2Fiber)" stroke="#c9a227" stroke-width="0.8"/>
  <rect x="72" y="144" width="236" height="7" rx="3.5" fill="url(#hd2Fiber)" stroke="#c9a227" stroke-width="0.8"/>
  <rect x="72" y="160" width="236" height="7" rx="3.5" fill="url(#hd2Fiber)" stroke="#c9a227" stroke-width="0.8"/>
  <rect x="72" y="176" width="236" height="7" rx="3.5" fill="url(#hd2Fiber)" stroke="#c9a227" stroke-width="0.8"/>
  <rect x="72" y="192" width="236" height="7" rx="3.5" fill="url(#hd2Fiber)" stroke="#c9a227" stroke-width="0.8"/>
  <rect x="72" y="208" width="236" height="7" rx="3.5" fill="url(#hd2Fiber)" stroke="#c9a227" stroke-width="0.8"/>
  <rect x="72" y="224" width="236" height="7" rx="3.5" fill="url(#hd2Fiber)" stroke="#c9a227" stroke-width="0.8"/>
</g>
<!-- blood inside alternating fibers -->
<rect x="72" y="128" width="236" height="7" rx="3.5" fill="#c10230" opacity="0.35"/>
<rect x="72" y="160" width="236" height="7" rx="3.5" fill="#c10230" opacity="0.35"/>
<rect x="72" y="192" width="236" height="7" rx="3.5" fill="#c10230" opacity="0.35"/>
<rect x="72" y="224" width="236" height="7" rx="3.5" fill="#c10230" opacity="0.35"/>
<!-- ports -->
<rect x="132" y="86" width="36" height="14" rx="3" fill="#022851"/>
<rect x="132" y="248" width="36" height="14" rx="3" fill="#022851"/>
<rect x="28" y="158" width="16" height="30" rx="3" fill="#0090b8"/>
<rect x="336" y="158" width="16" height="30" rx="3" fill="#0090b8"/>
<!-- blood out -->
<line x1="150" y1="266" x2="150" y2="280" stroke="#c10230" stroke-width="3" marker-end="url(#hd2ArrRed)"/>
<text x="162" y="282" fill="#c10230" font-size="9.5" font-weight="bold">blood out</text>
<!-- dialysate counter-current -->
<line x1="14" y1="173" x2="30" y2="173" stroke="#0090b8" stroke-width="3" marker-end="url(#hd2ArrCyan)"/>
<line x1="352" y1="173" x2="368" y2="173" stroke="#0090b8" stroke-width="3" marker-end="url(#hd2ArrCyan)"/>
<text x="14" y="148" fill="#0090b8" font-size="9.5" font-weight="bold">dialysate</text>
<text x="14" y="204" fill="#0090b8" font-size="9">counter-current</text>
<!-- internal labels -->
<text x="86" y="302" fill="#8a6d1b" font-size="10" font-weight="bold">Hollow fibers = the semipermeable membrane</text>
<text x="86" y="318" fill="#0090b8" font-size="9" font-weight="bold">Dialysate flows around the fibers, counter-current to blood</text>
<text x="86" y="332" fill="#5b6b7a" font-size="9">Thousands of fibers ≈ 200 µm → huge surface area</text>

<!-- ============ membrane panel (right) ============ -->
<rect x="384" y="88" width="232" height="130" rx="10" fill="#ffffff" stroke="#e3e8ee" filter="url(#hd2Sh)"/>
<text x="400" y="108" fill="#022851" font-size="12" font-weight="bold">Membrane types</text>
<g>
  <rect x="400" y="118" width="200" height="26" rx="6" fill="#ffe3e6"/>
  <text x="410" y="135" fill="#c10230" font-size="10" font-weight="bold">Unmodified cellulose</text>
  <text x="586" y="135" fill="#c10230" font-size="9" text-anchor="end">poor — avoid</text>
  <rect x="400" y="148" width="200" height="26" rx="6" fill="#e2f2e6"/>
  <text x="410" y="165" fill="#00573f" font-size="10" font-weight="bold">Polysulfone</text>
  <text x="586" y="165" fill="#00573f" font-size="9" text-anchor="end">excellent biocompat.</text>
  <rect x="400" y="178" width="200" height="26" rx="6" fill="#e2f2fb"/>
  <text x="410" y="195" fill="#0090b8" font-size="10" font-weight="bold">Polyethersulfone</text>
  <text x="586" y="195" fill="#0090b8" font-size="9" text-anchor="end">middle molecules ↑</text>
</g>

<!-- ============ efficiency / flux panel (bottom right) ============ -->
<rect x="384" y="230" width="232" height="120" rx="10" fill="#ffffff" stroke="#e3e8ee" filter="url(#hd2Sh)"/>
<text x="400" y="250" fill="#022851" font-size="12" font-weight="bold">How dialyzers are graded</text>
<text x="400" y="272" fill="#5b6b7a" font-size="10">Efficiency (clearance):</text>
<text x="400" y="290" fill="#1c2b39" font-size="10">· Low &lt; 450 mL/min · High &gt; 700 mL/min</text>
<text x="400" y="312" fill="#5b6b7a" font-size="10">Flux (middle-molecule removal):</text>
<text x="400" y="330" fill="#1c2b39" font-size="10">· High-flux clears up to 15,000 daltons</text>
<rect x="400" y="338" width="200" height="4" rx="2" fill="#eef4f8"/>
<rect x="400" y="338" width="120" height="4" rx="2" fill="#ffbf00"/>

<!-- KoA footer -->
<g filter="url(#hd2Sh)">
  <rect x="40" y="340" width="300" height="46" rx="10" fill="#022851"/>
</g>
<text x="56" y="360" fill="#ffbf00" font-size="11" font-weight="bold">KoA = mass transfer coefficient × surface area</text>
<text x="56" y="376" fill="#cfe0f2" font-size="9">overall efficiency — pick by size, access, comorbidities</text>
<text x="616" y="410" fill="#9aa7b4" font-size="9" text-anchor="end">CNN Exam Prep · Hemodialysis</text>
</svg>