<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="ck3Head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#022851"/><stop offset="1" stop-color="#003a6b"/></linearGradient>
  <linearGradient id="ck3Bone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdf6e3"/><stop offset="1" stop-color="#f0dcb4"/></linearGradient>
  <marker id="ck3Arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#022851"/></marker>
  <marker id="ck3ArrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c10230"/></marker>
  <filter id="ck3Sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#022851" flood-opacity="0.18"/></filter>
</defs>
<rect width="640" height="420" fill="#f7fafc"/>
<rect width="640" height="56" fill="url(#ck3Head)"/>
<rect y="56" width="640" height="4" fill="#ffbf00"/>
<text x="24" y="27" fill="#ffffff" font-size="17" font-weight="bold">CKD–Mineral Bone Disorder Overview</text>
<text x="24" y="45" fill="#ffbf00" letter-spacing="0.5" font-size="11">Bone · vessels · minerals — one systemic disease</text>

<!-- ============ center: the cascade ============ -->
<rect x="24" y="76" width="360" height="240" rx="12" fill="#ffffff" stroke="#e3e8ee" filter="url(#ck3Sh)"/>
<text x="40" y="98" fill="#022851" font-size="12" font-weight="bold">The MBD cascade (begins at stage 3)</text>
<!-- start node -->
<rect x="40" y="112" width="160" height="36" rx="8" fill="#022851"/>
<text x="120" y="127" fill="#ffbf00" font-size="9.5" text-anchor="middle" font-weight="bold">↓ Phosphate excretion</text>
<text x="120" y="142" fill="#cfe0f2" font-size="8" text-anchor="middle">GFR falls</text>
<!-- arrow right to hyperphos -->
<line x1="200" y1="130" x2="238" y2="130" stroke="#c10230" stroke-width="2" marker-end="url(#ck3ArrRed)"/>
<rect x="240" y="112" width="128" height="36" rx="8" fill="#fdf0f0" stroke="#c10230" stroke-width="1.2"/>
<text x="304" y="134" fill="#c10230" font-size="9.5" text-anchor="middle" font-weight="bold">Hyperphosphatemia</text>
<!-- down to hormones row -->
<line x1="304" y1="148" x2="304" y2="170" stroke="#c10230" stroke-width="2" marker-end="url(#ck3ArrRed)"/>
<!-- hormone chips -->
<rect x="40" y="172" width="108" height="34" rx="8" fill="#fdf6e3" stroke="#b8860b"/>
<text x="94" y="186" fill="#8a6d1b" font-size="9.5" text-anchor="middle" font-weight="bold">PTH ↑</text>
<text x="94" y="199" fill="#5b6b7a" font-size="7.5" text-anchor="middle">2° hyperparathyroidism</text>
<rect x="156" y="172" width="108" height="34" rx="8" fill="#fdf6e3" stroke="#b8860b"/>
<text x="210" y="186" fill="#8a6d1b" font-size="9.5" text-anchor="middle" font-weight="bold">FGF23 ↑</text>
<text x="210" y="199" fill="#5b6b7a" font-size="7.5" text-anchor="middle">phosphaturic hormone</text>
<rect x="272" y="172" width="100" height="34" rx="8" fill="#e2f2fb" stroke="#0090b8"/>
<text x="322" y="186" fill="#0090b8" font-size="9.5" text-anchor="middle" font-weight="bold">Vitamin D ↓</text>
<text x="322" y="199" fill="#5b6b7a" font-size="7.5" text-anchor="middle">calcitriol falls</text>
<!-- down to consequences -->
<line x1="210" y1="206" x2="304" y2="226" stroke="#c10230" stroke-width="2" marker-end="url(#ck3ArrRed)"/>
<rect x="40" y="222" width="164" height="38" rx="8" fill="#e2f2e6" stroke="#00573f"/>
<text x="122" y="238" fill="#00573f" font-size="9" text-anchor="middle" font-weight="bold">Bone resorption</text>
<text x="122" y="252" fill="#5b6b7a" font-size="7.5" text-anchor="middle">renal osteodystrophy</text>
<rect x="212" y="222" width="160" height="38" rx="8" fill="#fdf0f0" stroke="#c10230"/>
<text x="292" y="238" fill="#c10230" font-size="9" text-anchor="middle" font-weight="bold">Soft tissue calcification</text>
<text x="292" y="252" fill="#5b6b7a" font-size="7.5" text-anchor="middle">vessels · valves · skin</text>
<text x="40" y="292" fill="#5b6b7a" font-size="9">Diagnosis: bone biopsy is the gold standard for renal</text>
<text x="40" y="304" fill="#5b6b7a" font-size="9">osteodystrophy · monitor labs from stage 3 onward</text>

<!-- ============ right: the triad ============ -->
<rect x="404" y="76" width="212" height="150" rx="12" fill="#ffffff" stroke="#e3e8ee" filter="url(#ck3Sh)"/>
<text x="420" y="98" fill="#022851" font-size="12" font-weight="bold">One disorder, three faces</text>
<g font-size="9.5" fill="#1c2b39">
  <text x="420" y="122" font-weight="bold" fill="#022851">1 · Vascular / soft tissue</text>
  <text x="432" y="136">calcification</text>
  <text x="420" y="156" font-weight="bold" fill="#022851">2 · Bone abnormalities</text>
  <text x="432" y="170">turnover · strength · mineralization</text>
  <text x="420" y="190" font-weight="bold" fill="#022851">3 · Lab abnormalities</text>
  <text x="432" y="204">Ca · PO₄ · PTH · vitamin D</text>
</g>

<!-- ============ right lower: monitoring ============ -->
<rect x="404" y="240" width="212" height="76" rx="12" fill="#022851" filter="url(#ck3Sh)"/>
<text x="420" y="262" fill="#ffbf00" font-size="10.5" font-weight="bold">Monitoring frequency by stage</text>
<text x="420" y="284" fill="#cfe0f2" font-size="9">Stage 3 → start Ca · PO₄ · PTH · vit D</text>
<text x="420" y="300" fill="#cfe0f2" font-size="9">Stage 4–5 → check more often</text>

<!-- bone cross-section mini-diagram -->
<g filter="url(#ck3Sh)">
  <rect x="404" y="330" width="212" height="38" rx="10" fill="url(#ck3Bone)" stroke="#b8860b" stroke-width="1.2"/>
</g>
<text x="420" y="352" fill="#8a6d1b" font-size="9" font-weight="bold">PTH ↑ = bones give up calcium</text>
<text x="320" y="388" fill="#022851" font-size="10.5" text-anchor="middle" font-weight="bold">Elevated PTH is the engine of CKD-MBD — phosphate control is the first lever</text>
<text x="616" y="406" fill="#9aa7b4" font-size="9" text-anchor="end">CNN Exam Prep · CKD Complications</text>
</svg>