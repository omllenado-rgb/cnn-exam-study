<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="pd8Head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#022851"/><stop offset="1" stop-color="#003a6b"/></linearGradient>
  <filter id="pd8Sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#022851" flood-opacity="0.18"/></filter>
</defs>
<rect width="640" height="420" fill="#f7fafc"/>
<rect width="640" height="56" fill="url(#pd8Head)"/>
<rect y="56" width="640" height="4" fill="#ffbf00"/>
<text x="24" y="27" fill="#ffffff" font-size="17" font-weight="bold">Nutrition on PD</text>
<text x="24" y="45" fill="#ffbf00" letter-spacing="0.5" font-size="11">Protein loss · potassium paradox · glucose load · iron targets</text>

<!-- ============ protein (left) ============ -->
<rect x="36" y="70" width="184" height="180" rx="12" fill="#ffffff" stroke="#e3e8ee" filter="url(#pd8Sh)"/>
<text x="52" y="92" fill="#022851" font-size="12" font-weight="bold">Protein drains away</text>
<g filter="url(#pd8Sh)">
  <rect x="52" y="102" width="152" height="40" rx="8" fill="#022851"/>
</g>
<text x="128" y="120" fill="#ffbf00" font-size="11" text-anchor="middle" font-weight="bold">5–15 g lost daily</text>
<text x="128" y="132" fill="#cfe0f2" font-size="7.5" text-anchor="middle">protein in every bag of effluent</text>
<text x="52" y="160" fill="#1c2b39" font-size="8.5">PD patients need MORE protein</text>
<text x="52" y="172" fill="#1c2b39" font-size="8.5">than HD patients — feed the loss</text>
<text x="52" y="190" fill="#00573f" font-size="8.5" font-weight="bold">≥ 50% high biologic value:</text>
<!-- meat / egg / dairy icons -->
<g transform="translate(56,198)">
  <path d="M0 14 q8 -12 20 -10 q8 2 6 10 q-2 8 -12 8 q-10 0 -14 -10 z" fill="#c10230" opacity="0.85"/>
  <text x="10" y="34" fill="#5b6b7a" font-size="7" text-anchor="middle">meat</text>
</g>
<g transform="translate(108,198)">
  <path d="M12 2 a10 12 0 1 1 -0.1 0 z" fill="#fdf3d1" stroke="#8a6d1b"/>
  <circle cx="12" cy="12" r="6" fill="#ffbf00"/>
  <text x="12" y="34" fill="#5b6b7a" font-size="7" text-anchor="middle">eggs</text>
</g>
<g transform="translate(158,198)">
  <path d="M0 6 q0 -6 6 -6 h10 q6 0 6 6 v10 q0 6 -6 6 h-10 q-6 0 -6 -6 z" fill="#e9f1f8" stroke="#5b6b7a"/>
  <text x="11" y="34" fill="#5b6b7a" font-size="7" text-anchor="middle">dairy</text>
</g>

<!-- ============ potassium paradox (middle) ============ -->
<rect x="232" y="70" width="184" height="180" rx="12" fill="#ffffff" stroke="#00573f" stroke-width="1.5" filter="url(#pd8Sh)"/>
<text x="248" y="92" fill="#00573f" font-size="12" font-weight="bold">The potassium paradox</text>
<g filter="url(#pd8Sh)">
  <rect x="248" y="102" width="152" height="44" rx="8" fill="#e2f2e6"/>
</g>
<text x="324" y="120" fill="#00573f" font-size="10.5" text-anchor="middle" font-weight="bold">Hypokalemia in 30%</text>
<text x="324" y="134" fill="#5b6b7a" font-size="8" text-anchor="middle">— the OPPOSITE of HD</text>
<path d="M258 160 v28 M258 160 l-6 8 M258 160 l6 8" stroke="#5b6b7a" stroke-width="2" fill="none"/>
<text x="272" y="158" fill="#1c2b39" font-size="8.5">8 L of dialysate a day</text>
<text x="272" y="170" fill="#5b6b7a" font-size="8">strips ≈ 40 mEq of K+</text>
<text x="272" y="182" fill="#5b6b7a" font-size="8">across the membrane</text>
<rect x="248" y="196" width="152" height="40" rx="8" fill="#fdf3d1"/>
<text x="324" y="212" fill="#8a6d1b" font-size="8.5" text-anchor="middle" font-weight="bold">Prescribe: high-K diet</text>
<text x="324" y="226" fill="#8a6d1b" font-size="8.5" text-anchor="middle">+ potassium supplements</text>

<!-- ============ glucose load (right) ============ -->
<rect x="428" y="70" width="176" height="180" rx="12" fill="#ffffff" stroke="#c10230" stroke-width="1.5" filter="url(#pd8Sh)"/>
<text x="444" y="92" fill="#022851" font-size="12" font-weight="bold">Feeding on sugar</text>
<rect x="444" y="102" width="144" height="34" rx="8" fill="#022851"/>
<text x="516" y="124" fill="#ffbf00" font-size="10.5" text-anchor="middle" font-weight="bold">100–200 g/day absorbed</text>
<text x="444" y="156" fill="#c10230" font-size="8.5" font-weight="bold">→ hyperglycemia</text>
<text x="444" y="190" fill="#1c2b39" font-size="8.5" font-weight="bold">→ weight gain</text>
<text x="444" y="224" fill="#1c2b39" font-size="8.5" font-weight="bold">→ appetite suppression</text>
<text x="444" y="240" fill="#5b6b7a" font-size="8">watch closely in diabetics</text>

<!-- ============ iron / anemia panel (bottom) ============ -->
<rect x="36" y="262" width="568" height="122" rx="12" fill="#ffffff" stroke="#e3e8ee" filter="url(#pd8Sh)"/>
<text x="52" y="284" fill="#022851" font-size="12.5" font-weight="bold">Iron &amp; hemoglobin targets</text>
<!-- ferritin dial -->
<g filter="url(#pd8Sh)">
  <circle cx="120" cy="330" r="34" fill="#e9f1f8" stroke="#5b6b7a" stroke-width="2"/>
</g>
<path d="M120 330 L96 314" stroke="#c10230" stroke-width="3" stroke-linecap="round"/>
<path d="M94 352 a34 34 0 0 0 48 0" fill="none" stroke="#00573f" stroke-width="4"/>
<text x="120" y="380" fill="#022851" font-size="9" text-anchor="middle" font-weight="bold">Ferritin</text>
<text x="120" y="391" fill="#00573f" font-size="8" text-anchor="middle" font-weight="bold">200–500 ng/mL</text>
<!-- TSAT bar -->
<text x="196" y="316" fill="#022851" font-size="9.5" font-weight="bold">TSAT</text>
<rect x="196" y="324" width="170" height="14" rx="7" fill="#eef4f8"/>
<rect x="196" y="324" width="76" height="14" rx="7" fill="#00573f"/>
<text x="280" y="334" fill="#00573f" font-size="8" font-weight="bold">target &gt; 20%</text>
<text x="196" y="356" fill="#5b6b7a" font-size="8">IV iron when TSAT or ferritin fall short</text>
<!-- ESA -->
<g filter="url(#pd8Sh)">
  <rect x="400" y="302" width="190" height="56" rx="8" fill="#022851"/>
</g>
<text x="416" y="324" fill="#ffbf00" font-size="10" font-weight="bold">ESAs — erythropoietin</text>
<text x="416" y="342" fill="#cfe0f2" font-size="8.5">give SUBCUTANEOUSLY on PD</text>
<text x="416" y="352" fill="#9fc9e8" font-size="7.5">(IV absorption is unreliable)</text>

<text x="616" y="412" fill="#9aa7b4" font-size="9" text-anchor="end">CNN Exam Prep · Peritoneal Dialysis</text>
</svg>