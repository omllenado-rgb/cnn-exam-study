<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="hdTHead" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#022851"/><stop offset="1" stop-color="#003a6b"/></linearGradient>
  <linearGradient id="hdTMachine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9f1f8"/><stop offset="1" stop-color="#c4d3e0"/></linearGradient>
  <linearGradient id="hdTChair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c4a68"/><stop offset="1" stop-color="#022851"/></linearGradient>
  <linearGradient id="hdTScreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c3a63"/><stop offset="1" stop-color="#022851"/></linearGradient>
  <filter id="hdTSh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#022851" flood-opacity="0.18"/></filter>
</defs>
<rect width="640" height="420" fill="#f7fafc"/>
<rect width="640" height="56" fill="url(#hdTHead)"/>
<rect y="56" width="640" height="4" fill="#ffbf00"/>
<text x="24" y="27" fill="#ffffff" font-size="17" font-weight="bold">Hemodialysis</text>
<text x="24" y="45" fill="#ffbf00" font-size="11" letter-spacing="0.5">Machine · circuit · patient — the treatment at a glance</text>

<!-- floor -->
<rect x="0" y="366" width="640" height="54" fill="#e4ebf2"/>
<line x1="0" y1="366" x2="640" y2="366" stroke="#cdd8e2" stroke-width="2"/>

<!-- ============ machine ============ -->
<g filter="url(#hdTSh)">
  <rect x="150" y="120" width="190" height="248" rx="16" fill="url(#hdTMachine)" stroke="#5b6b7a" stroke-width="2"/>
</g>
<!-- screen -->
<g filter="url(#hdTSh)">
  <rect x="166" y="134" width="158" height="76" rx="8" fill="url(#hdTScreen)"/>
</g>
<rect x="176" y="146" width="80" height="8" rx="4" fill="#00b2e3"/>
<rect x="176" y="160" width="56" height="8" rx="4" fill="#ffbf00"/>
<rect x="176" y="174" width="96" height="8" rx="4" fill="#3d7ba8"/>
<circle cx="298" cy="162" r="16" fill="none" stroke="#ffbf00" stroke-width="2"/>
<path d="M292 162 h12 M298 156 v12" stroke="#ffbf00" stroke-width="2"/>
<!-- buttons -->
<circle cx="182" cy="228" r="6" fill="#00b2e3"/>
<circle cx="202" cy="228" r="6" fill="#ffbf00"/>
<circle cx="222" cy="228" r="6" fill="#c10230"/>
<rect x="244" y="220" width="70" height="16" rx="4" fill="#ffffff" stroke="#c4d3e0"/>
<!-- blood pump window -->
<circle cx="202" cy="272" r="26" fill="#022851"/>
<circle cx="202" cy="272" r="17" fill="none" stroke="#ffbf00" stroke-width="2"/>
<circle cx="202" cy="262" r="4.5" fill="#ffbf00"/>
<circle cx="193" cy="279" r="4.5" fill="#ffbf00"/>
<circle cx="211" cy="279" r="4.5" fill="#ffbf00"/>
<text x="202" y="308" fill="#5b6b7a" font-size="8.5" text-anchor="middle">blood pump</text>
<!-- dialyzer hung on machine -->
<g filter="url(#hdTSh)">
  <rect x="268" y="242" width="52" height="88" rx="10" fill="#e9f1f8" stroke="#5b6b7a" stroke-width="2"/>
</g>
<g stroke="#ffbf00" stroke-width="2.5">
  <line x1="278" y1="250" x2="278" y2="322"/><line x1="290" y1="250" x2="290" y2="322"/>
  <line x1="302" y1="250" x2="302" y2="322"/>
</g>
<rect x="276" y="250" width="10" height="72" fill="#c10230" opacity="0.4"/>
<text x="294" y="344" fill="#5b6b7a" font-size="8" text-anchor="middle">dialyzer</text>

<!-- ============ circuit to patient ============ -->
<path d="M150 205 H118 V322" fill="none" stroke="#c10230" stroke-width="5" stroke-linecap="round"/>
<path d="M294 334 V360 H70 V344" fill="none" stroke="#c10230" stroke-width="5" stroke-linecap="round"/>
<circle cx="118" cy="322" r="7" fill="#c10230"/>
<circle cx="70" cy="344" r="7" fill="#8d1f33"/>

<!-- ============ patient in chair ============ -->
<g filter="url(#hdTSh)">
  <rect x="30" y="238" width="26" height="96" rx="10" fill="url(#hdTChair)"/>
</g>
<rect x="30" y="320" width="124" height="13" rx="6.5" fill="#0a3358"/>
<rect x="60" y="302" width="82" height="9" rx="4.5" fill="#2c4a68"/>
<rect x="38" y="333" width="9" height="24" fill="#0a3358"/>
<rect x="136" y="333" width="9" height="24" fill="#0a3358"/>
<!-- patient -->
<circle cx="84" cy="266" r="12" fill="#f4d5bc"/>
<rect x="72" y="279" width="25" height="40" rx="8" fill="#4d7fa8"/>
<line x1="82" y1="312" x2="132" y2="314" stroke="#3d5a78" stroke-width="12" stroke-linecap="round"/>
<line x1="134" y1="318" x2="130" y2="342" stroke="#f4d5bc" stroke-width="8" stroke-linecap="round"/>
<!-- arm resting on armrest, fistula site -->
<path d="M84 288 q-8 10 -8 16" fill="none" stroke="#4d7fa8" stroke-width="7" stroke-linecap="round"/>
<line x1="80" y1="302" x2="104" y2="302" stroke="#f4d5bc" stroke-width="8" stroke-linecap="round"/>
<circle cx="100" cy="302" r="3" fill="#c10230"/>
<text x="64" y="374" fill="#5b6b7a" font-size="8" text-anchor="middle">patient · AVF in forearm</text>

<!-- ============ labels ============ -->
<line x1="340" y1="150" x2="392" y2="150" stroke="#022851" stroke-width="1.5"/>
<text x="398" y="154" fill="#022851" font-size="11" font-weight="bold">Treatment screen</text>
<text x="398" y="168" fill="#5b6b7a" font-size="9">UF goal, time, pressures</text>
<line x1="240" y1="272" x2="380" y2="272" stroke="#022851" stroke-width="1.5"/>
<text x="386" y="276" fill="#022851" font-size="11" font-weight="bold">Blood pump</text>
<text x="386" y="290" fill="#5b6b7a" font-size="9">sets blood flow rate</text>
<line x1="322" y1="300" x2="380" y2="320" stroke="#022851" stroke-width="1.5"/>
<text x="386" y="324" fill="#022851" font-size="11" font-weight="bold">Dialyzer</text>
<text x="386" y="338" fill="#5b6b7a" font-size="9">blood ⇄ dialysate exchange</text>

<!-- key numbers chip -->
<g filter="url(#hdTSh)">
  <rect x="398" y="180" width="218" height="76" rx="12" fill="#022851"/>
</g>
<text x="414" y="202" fill="#ffbf00" font-size="10.5" font-weight="bold">3 pillars of every treatment</text>
<g font-size="9.5" fill="#cfe0f2">
  <text x="414" y="222">· access (AVF &gt; graft &gt; catheter)</text>
  <text x="414" y="238">· blood + dialysate flows</text>
  <text x="414" y="251">· time and ultrafiltration goal</text>
</g>
<text x="320" y="392" fill="#5b6b7a" font-size="10" text-anchor="middle">Waste crosses the membrane by diffusion · fluid leaves by ultrafiltration</text>
<text x="616" y="412" fill="#9aa7b4" font-size="9" text-anchor="end">CNN Exam Prep</text>
</svg>